name: AuthorGram 12.9.2 Final Main Release

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: [.github/FINAL_MAIN_RELEASE_12_9_2]

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: authorgram-12-9-2-final-main
  cancel-in-progress: true

jobs:
  main-release:
    name: Verify sources and build Main APK
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      MAIN_PACKAGE: fork.risin42.nagramx
      PLAY_PACKAGE: toss.authorgram.apk
      VERSION_NAME: 12.9.2
      VERSION_CODE: '6991'
      PYTHONDONTWRITEBYTECODE: '1'
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      AUTHORGRAM_SIGNING_CERT_SHA256: ${{ secrets.AUTHORGRAM_SIGNING_CERT_SHA256 }}

    steps:
      - name: Checkout dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Publish pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'authorgram/final-main-release',
              description: 'Final Main source verification and release build are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Validate and apply final chat UI repairs
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/final_main_release_12_9_2.sh
          python3 - <<'PY'
          from pathlib import Path

          scripts = (
              'scripts/patch_authorgram_ui_12_9_2.py',
              'scripts/patch_authorgram_ios_menu_v2.py',
              'scripts/patch_authorgram_final_chat_ui.py',
              'scripts/patch_authorgram_final_ui_compat.py',
              'scripts/patch_authorgram_popup_bounds.py',
              'scripts/patch_authorgram_badge_surfaces.py',
              'scripts/patch_authorgram_play_policy.py',
              'scripts/patch_authorgram_build_key.py',
              'scripts/finalize_authorgram_source.py',
              'scripts/authorgram_parity_guard.py',
          )
          for relative in scripts:
              source = Path(relative).read_text(encoding='utf-8')
              compile(source, relative, 'exec')
              print(f'Python syntax passed: {relative}')
          PY

          python3 scripts/patch_authorgram_ui_12_9_2.py
          python3 scripts/patch_authorgram_popup_bounds.py
          python3 scripts/patch_authorgram_badge_surfaces.py
          python3 scripts/patch_authorgram_play_policy.py
          git diff --check

          python3 - <<'PY'
          from pathlib import Path

          required = {
              'TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ActionBar.java': (
                  'AUTHORGRAM_STANDARD_CHAT_HEADER',
                  'parentFragment instanceof org.telegram.ui.ChatActivity',
              ),
              'TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ActionBarPopupWindow.java': (
                  'AUTHORGRAM_RELIABLE_POPUP_SCROLL',
                  'scrollView.setScrollContainer(true);',
              ),
              'TMessagesProj/src/main/java/org/telegram/ui/Components/ChatScrimPopupContainerLayout.java': (
                  'AUTHORGRAM_FIXED_IOS_MESSAGE_PREVIEW',
                  'AUTHORGRAM_MENU_FOOTER_WIDTH_PARITY',
                  'availableForActions',
              ),
              'TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java': (
                  'AUTHORGRAM_FIXED_IOS_PREVIEW_OWNER',
                  'scrimPopupContainerLayout.setFixedMessagePreview(iosPreview);',
                  'AUTHORGRAM_FULL_SCREEN_IOS_MENU_BLUR',
              ),
              'TMessagesProj/src/main/java/org/telegram/ui/Components/ChatActivityEnterView.java': (
                  'AUTHORGRAM_IOS_SEND_BUTTON_INVARIANT',
                  'sendButtonView.setVisibility(VISIBLE);',
                  'sendButtonView.setAlpha(1.0f);',
              ),
              'TMessagesProj/src/main/java/org/telegram/ui/Components/IOSMessageMenuPreview.java': (
                  'AUTHORGRAM_UNIFIED_IOS_MESSAGE_BLOCK',
                  'BackupImageView avatarView',
                  'TextView senderNameView',
              ),
          }
          for relative, markers in required.items():
              text = Path(relative).read_text(encoding='utf-8')
              missing = [marker for marker in markers if marker not in text]
              if missing:
                  raise SystemExit(f'{relative}: missing {missing}')
          chat = Path('TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java').read_text(encoding='utf-8')
          if 'AUTHORGRAM_IOS_MESSAGE_ACTION_GAP' in chat:
              raise SystemExit('The selected-message preview is still owned by the actions ScrollView')
          print('Final chat UI source invariants passed')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36'

      - name: Commit repaired dev source without workflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_authorgram_exact_icon_and_spy.py
          python3 scripts/fix_authorgram_adaptive_icon.py
          python3 scripts/patch_authorgram_build_key.py
          python3 scripts/patch_authorgram_play_policy.py
          python3 scripts/finalize_authorgram_source.py --role dev --package "${MAIN_PACKAGE}"
          python3 scripts/patch_authorgram_popup_bounds.py
          git diff --check

          git config user.name "AuthorGram Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Apply final chat UI and protected release policy"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:dev; then
                pushed=true
                break
              fi
              git fetch --force origin dev
              git rebase origin/dev
            done
            [[ "${pushed}" == "true" ]] || {
              echo 'Unable to push repaired dev source after three attempts.' >&2
              exit 1
            }
          fi

      - name: Synchronize both source branches and build only Main release APK
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/final_main_release_12_9_2.sh

      - name: Verify Main-only artifact set
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/authorgram-main-final/artifacts"
          mapfile -t main_apks < <(find "${artifact_dir}" -maxdepth 1 -type f -name 'AuthorGram-Main-*.apk' -print | sort)
          mapfile -t play_apks < <(find "${artifact_dir}" -maxdepth 1 -type f -name 'AuthorGram-Play-*.apk' -print | sort)
          mapfile -t aabs < <(find "${artifact_dir}" -maxdepth 1 -type f -name '*.aab' -print | sort)
          [[ "${#main_apks[@]}" -eq 1 ]] || {
            printf 'Expected exactly one Main APK, found %s\n' "${#main_apks[@]}" >&2
            exit 1
          }
          [[ "${#play_apks[@]}" -eq 0 ]] || {
            printf 'Play APK was built unexpectedly.\n' >&2
            exit 1
          }
          [[ "${#aabs[@]}" -eq 0 ]] || {
            printf 'AAB artifacts are forbidden.\n' >&2
            exit 1
          }
          test -s "${artifact_dir}/SHA256SUMS.txt"
          test -s "${artifact_dir}/Main-CERTIFICATE.txt"
          test -s "${artifact_dir}/Main-BUILD.txt"
          cat "${artifact_dir}/RELEASE-SUMMARY.txt"

      - name: Upload verified Main release APK
        uses: actions/upload-artifact@v4
        with:
          name: AuthorGram-12.9.2-Final-Main-Release
          path: ${{ runner.temp }}/authorgram-main-final/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'authorgram/final-main-release',
              description: success
                ? 'Verified Main release APK is ready; Play source synchronized without build'
                : 'Final Main release verification or build failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
