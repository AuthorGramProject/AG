name: CI (Debug Build)

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'documentations/**'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'documentations/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_PLATFORM: 'android-36'
  ANDROID_NDK: '27.2.12479018'
  ANDROID_CMAKE: '3.31.6'

jobs:
  debug:
    name: Assemble Debug (no native)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    env:
      NATIVE_TARGET: SKIP

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          check-latest: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: 'on-failure'
          add-job-summary-as-pr-comment: never

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: >-
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;${{ env.ANDROID_NDK }}
            platforms;${{ env.ANDROID_PLATFORM }}
            cmake;${{ env.ANDROID_CMAKE }}

      - name: Wire Android SDK
        run: |
          set -euo pipefail
          chmod +x gradlew
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Assemble debug
        run: |
          set -euo pipefail
          ./gradlew --build-cache --parallel --configuration-cache \
            -x lint -x test \
            :TMessagesProj:assembleDebug
