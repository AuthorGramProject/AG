name: AuthorGram security fast validation

on:
  push:
    branches: [agent/authorgram-security-hardening]
    paths: ['.github/workflows/security-fast-validation.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NATIVE_TARGET: SKIP
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/authorgram-security-hardening
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 platforms;android-36'
      - name: Compile and report
        shell: bash
        run: |
          set -uo pipefail
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          set +e
          ./gradlew --no-daemon TMessagesProj:compileDebugJavaWithJavac > security-fast-validation.log 2>&1
          STATUS=$?
          set -e
          {
            echo "status=$([ "$STATUS" -eq 0 ] && echo success || echo failure)"
            echo "head=$(git rev-parse HEAD)"
            echo "--- log tail ---"
            tail -n 260 security-fast-validation.log
          } > .github/security-fast-validation-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/security-fast-validation-result.txt
          git commit -m 'Record security fast validation result'
          git push origin HEAD:agent/authorgram-security-hardening
          exit "$STATUS"
