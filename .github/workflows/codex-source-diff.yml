name: Codex AuthorGram source diff

on:
  pull_request:
    branches:
      - dev
    paths:
      - .github/CODEX_SOURCE_SNAPSHOT

permissions:
  contents: read

concurrency:
  group: codex-authorgram-source-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-diff:
    name: Export current AuthorGram tree against NagramXF base
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NAGRAMXF_BASE_COMMIT: 140d86610e5ee58e8b25a3db9d75e4eed9d7946d

    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: true

      - name: Fetch the exact NagramXF 12.9.0 base tree
        shell: bash
        run: |
          set -euo pipefail
          git remote add nagramxf https://github.com/Keeperorowner/NagramXF.git
          git fetch --no-tags --filter=blob:none --depth=1 nagramxf "${NAGRAMXF_BASE_COMMIT}"
          git cat-file -e "${NAGRAMXF_BASE_COMMIT}^{commit}"

          git config remote.nagramxf.promisor true
          git config remote.nagramxf.partialclonefilter blob:none
          git config extensions.partialClone nagramxf
          git config --unset-all remote.origin.promisor || true
          git config --unset-all remote.origin.partialclonefilter || true

      - name: Create a binary-safe whole-tree patch
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/authorgram-source-diff"
          mkdir -p "${output_dir}"

          head_commit="$(git rev-parse HEAD)"
          head_tree="$(git rev-parse "HEAD^{tree}")"

          git diff --binary --full-index --find-renames=50%             "${NAGRAMXF_BASE_COMMIT}" "${head_commit}"             > "${output_dir}/authorgram-vs-nagramxf.patch"
          git diff --name-status --find-renames=50%             "${NAGRAMXF_BASE_COMMIT}" "${head_commit}"             > "${output_dir}/authorgram-vs-nagramxf-files.txt"

          {
            printf 'nagramxf_base_commit=%s\n' "${NAGRAMXF_BASE_COMMIT}"
            printf 'authorgram_head_commit=%s\n' "${head_commit}"
            printf 'authorgram_head_tree=%s\n' "${head_tree}"
            printf 'changed_files=%s\n' "$(wc -l < "${output_dir}/authorgram-vs-nagramxf-files.txt")"
            sha256sum "${output_dir}/authorgram-vs-nagramxf.patch"
          } > "${output_dir}/manifest.txt"

          test -s "${output_dir}/authorgram-vs-nagramxf.patch"
          cat "${output_dir}/manifest.txt"

      - name: Upload source diff
        uses: actions/upload-artifact@v4
        with:
          name: authorgram-tree-vs-nagramxf
          path: ${{ runner.temp }}/authorgram-source-diff/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
