name: TOSS one-time resource patch

on:
  push:
    branches: [agent/toss-play-market-rebrand]
    paths: ['.github/workflows/toss-self-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/toss-play-market-rebrand
          fetch-depth: 0
      - name: Apply compile fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              Path('TMessagesProj/src/main/java/org/telegram/messenger/NotificationsController.java'): {
                  'R.drawable.nagramx_notification': 'R.drawable.toss_notification',
              },
              Path('TMessagesProj/src/main/java/org/telegram/ui/Cells/SessionCell.java'): {
                  'R.drawable.nagramx_notification': 'R.drawable.toss_notification',
              },
              Path('TMessagesProj/src/main/java/toss/authorgram/settings/AGAppearanceSettingsActivity.java'): {
                  'getString(R.string.NekoSettings), R.drawable.nagramx_outline':
                      'getString(R.string.AGSettings), R.drawable.ag_settings',
              },
          }
          for path, mapping in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  if text.count(old) != 1:
                      raise RuntimeError(f'{path}: expected exactly one {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          for extra in (
              '.github/authorgram_agent_patch.py',
              '.github/toss-resource-fix-trigger',
          ):
              Path(extra).unlink(missing_ok=True)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix remaining TOSS resource references'
          git push origin HEAD:agent/toss-play-market-rebrand
