name: Cancel stale AuthorGram release queues

on:
  pull_request:
    types: [ready_for_review]
    branches: [dev]

permissions:
  contents: read

jobs:
  cancel-stale-release-groups:
    if: github.event.pull_request.number == 30
    name: Cancel stale group ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group:
          - authorgram-12-9-2-final-main
          - authorgram-12-9-2-deterministic-final-release
          - authorgram-12-9-2-final-dual-apk-v2
          - authorgram-12-9-2-final-dual-apk-v3
          - authorgram-12-9-2-final-dual-apk-v4
          - authorgram-12-9-2-final-main-play-release
    concurrency:
      group: ${{ matrix.group }}
      cancel-in-progress: true
    steps:
      - name: Release stale concurrency slot
        shell: bash
        run: |
          set -euo pipefail
          printf 'Stale AuthorGram release concurrency group cleared: %s\n' '${{ matrix.group }}'
