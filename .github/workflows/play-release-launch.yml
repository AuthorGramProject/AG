name: Launch Play Universal Release

on:
  workflow_dispatch:
  push:
    branches: [play-market]
    paths:
      - .github/workflows/play-release-launch.yml

permissions:
  actions: write
  contents: read

jobs:
  launch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch Play release workflow on play-market
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: 'play-market',
            });
            core.info('Dispatched Play Java-preflight + Universal release workflow');
