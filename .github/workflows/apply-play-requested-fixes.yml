name: Apply requested Play fixes

on:
  push:
    branches: [play-market]
    paths:
      - .github/workflows/apply-play-requested-fixes.yml

permissions:
  contents: write

concurrency:
  group: authorgram-apply-play-requested-fixes
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout play-market
        uses: actions/checkout@v4
        with:
          ref: play-market
          fetch-depth: 1

      - name: Apply source and release workflow changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          # 1) Google Play versionCode: next uploadable bundle.
          gradle_path = 'gradle.properties'
          gradle = read(gradle_path)
          gradle = replace_once(gradle, 'APP_VERSION_CODE=6993', 'APP_VERSION_CODE=6994', 'gradle versionCode')
          write(gradle_path, gradle)

          # 2) Keep iOS Message Menu Play-blocked, but allow the existing iOS input only.
          policy_path = 'TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramPlayPolicy.java'
          policy = read(policy_path)
          policy = replace_once(
              policy,
              '        // AuthorGram iOS-inspired interface variants remain Main-only.\n        values.put("iOSMessageInputField", false);\n        values.put("iOSMessageMenu", false);',
              '        // Google Play may use the iOS-inspired input only. The iOS Message Menu remains disabled.\n        values.put("iOSMessageMenu", false);',
              'Play iOS config lock'
          )
          policy = replace_once(
              policy,
              '    public static boolean canUseIosUi() {\n        return !isPlayBuild();\n    }',
              '    public static boolean canUseIosInput() {\n        return true;\n    }\n\n    public static boolean canUseIosUi() {\n        return !isPlayBuild();\n    }',
              'iOS capability method'
          )
          write(policy_path, policy)

          chat_settings_path = 'TMessagesProj/src/main/java/toss/authorgram/settings/AGChatSettingsActivity.java'
          chat_settings = read(chat_settings_path)
          chat_settings = replace_once(
              chat_settings,
              '    private AbstractConfigCell appendIOSMessageInputFieldRow() {\n        if (AuthorGramPlayPolicy.isPlayBuild()) {\n            return null;\n        }\n        return cellGroup.appendCell(new ConfigCellTextCheck(',
              '    private AbstractConfigCell appendIOSMessageInputFieldRow() {\n        if (!AuthorGramPlayPolicy.canUseIosInput()) {\n            return null;\n        }\n        return cellGroup.appendCell(new ConfigCellTextCheck(',
              'iOS input settings visibility'
          )
          write(chat_settings_path, chat_settings)

          icon_path = 'TMessagesProj/src/main/java/org/telegram/ui/Components/ChatActivityEnterViewAnimatedIconView.java'
          icon = read(icon_path)
          icon = replace_once(
              icon,
              '        return AuthorGramPlayPolicy.canUseIosUi()\n                && NekoConfig.iOSMessageInputField.Bool();',
              '        return AuthorGramPlayPolicy.canUseIosInput()\n                && NekoConfig.iOSMessageInputField.Bool();',
              'iOS input animation gate'
          )
          write(icon_path, icon)

          # 3) Centered titles must never alter the chat header, same behavior as dev.
          action_path = 'TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ActionBar.java'
          action = read(action_path)
          action = replace_once(
              action,
              '    private boolean isCentered() {\n        return NaConfig.INSTANCE.getCenterActionBarTitle().Bool();\n    }',
              '    private boolean isCentered() {\n        return !(parentFragment instanceof org.telegram.ui.ChatActivity)\n                && NaConfig.INSTANCE.getCenterActionBarTitle().Bool();\n    }',
              'chat title centering guard'
          )
          write(action_path, action)

          # 4) Chat menu: reuse the existing filter submenu, expose it directly as Message Filters
          # between the two existing separators in Play. Force the entry visible so users can
          # configure per-chat rules/exclusion even when the global master switch is currently off.
          # Also recognize the new AuthorGram JSON suffix while keeping old NekoX backups importable.
          chat_path = 'TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java'
          chat = read(chat_path)
          chat = replace_once(
              chat,
              '        boolean showRegexFilters = NaConfig.INSTANCE.getRegexFiltersEnabled().Bool();',
              '        boolean showRegexFilters = true;',
              'Play Message Filters visibility'
          )
          chat = replace_once(
              chat,
              '        headerItem.lazilyAddSwipeBackItem(R.drawable.msg2_reactions2, null, getString(R.string.AyuGramMenu), ayuLayout);',
              '        headerItem.lazilyAddSwipeBackItem(R.drawable.hide_title, null, getString(R.string.RegexFilters), ayuLayout);',
              'Play Message Filters root item'
          )

          suffix_checks = [
              'messageObject.getDocumentName().toLowerCase().endsWith(".nekox-settings.json")',
              'locFile.getName().toLowerCase().endsWith(".nekox-settings.json")',
              'fileName.endsWith(".nekox-settings.json")',
              'message.getDocumentName().toLowerCase().endsWith(".nekox-settings.json")',
          ]
          for old in suffix_checks:
              count = chat.count(old)
              if count < 1:
                  raise SystemExit(f'settings import suffix marker missing: {old}')
              lhs = old[:-len('.endsWith(".nekox-settings.json")')]
              new = f'({lhs}.endsWith(".authorgram-settings.json") || {old})'
              chat = chat.replace(old, new)
          if '.authorgram-settings.json' not in chat:
              raise SystemExit('AuthorGram settings suffix was not added')
          write(chat_path, chat)

          # 5) Release workflow: 6994, one verified release AAB artifact only.
          workflow_path = '.github/workflows/play-aab-release.yml'
          workflow = read(workflow_path)
          workflow = replace_once(workflow, "      VERSION_CODE: '6993'", "      VERSION_CODE: '6994'", 'workflow versionCode')
          workflow = workflow.replace('AuthorGram-Play-12.9.2-6993-Google-Play-AAB', 'AuthorGram-Play-12.9.2-6994-Google-Play-AAB')

          safety = re.compile(
              r'\n      - name: Upload built AAB safety copy\n'
              r'        uses: actions/upload-artifact@v4\n'
              r'        with:\n'
              r'          name: AuthorGram-Play-AAB-SAFETY-NOT-FOR-RELEASE\n'
              r'          path: \$\{\{ runner\.temp \}\}/authorgram-play-aab-raw/\n'
              r'          if-no-files-found: error\n'
              r'          retention-days: 7\n',
              re.MULTILINE,
          )
          workflow, count = safety.subn('', workflow, count=1)
          if count != 1:
              raise SystemExit(f'safety artifact step: expected 1 block, found {count}')

          diagnostics = re.compile(
              r'\n      - name: Upload verification diagnostics on failure\n'
              r'        if: failure\(\)\n'
              r'        uses: actions/upload-artifact@v4\n'
              r'        with:\n'
              r'          name: AuthorGram-Play-AAB-DIAGNOSTIC-NOT-FOR-RELEASE\n'
              r'          path: \|\n'
              r'            \$\{\{ runner\.temp \}\}/authorgram-play-aab/\n'
              r'            \$\{\{ runner\.temp \}\}/authorgram-play-aab-raw/\n'
              r'          if-no-files-found: warn\n'
              r'          retention-days: 7\n',
              re.MULTILINE,
          )
          workflow, count = diagnostics.subn('', workflow, count=1)
          if count != 1:
              raise SystemExit(f'diagnostic artifact step: expected 1 block, found {count}')

          workflow = replace_once(
              workflow,
              '          path: ${{ runner.temp }}/authorgram-play-aab/\n          if-no-files-found: error\n          retention-days: 30',
              '          path: ${{ runner.temp }}/authorgram-play-aab/AuthorGram-Play-v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}-release.aab\n          if-no-files-found: error\n          retention-days: 30',
              'verified AAB upload path'
          )

          # The policy no longer locks iOS input; keep iOS Message Menu explicitly locked.
          workflow = workflow.replace(
              '          grep -Fq \'values.put("iOSMessageInputField", false);\' TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramPlayPolicy.java\n',
              ''
          )

          # Add explicit preflight checks for all requested fixes before javac.
          marker = '          grep -Fq \'RegexFiltersExclusionPopupWrapper\' TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java\n\n          git diff --check\n'
          checks = '''          grep -Fq 'RegexFiltersExclusionPopupWrapper' TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java
          grep -Fq 'getString(R.string.RegexFilters), ayuLayout' TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java
          grep -Fq '.authorgram-settings.json' TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java
          grep -Fq 'canUseIosInput()' TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramPlayPolicy.java
          grep -Fq 'values.put("iOSMessageMenu", false);' TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramPlayPolicy.java
          ! grep -Fq 'values.put("iOSMessageInputField", false);' TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramPlayPolicy.java
          grep -Fq 'AuthorGramPlayPolicy.canUseIosInput()' TMessagesProj/src/main/java/org/telegram/ui/Components/ChatActivityEnterViewAnimatedIconView.java
          grep -Fq 'parentFragment instanceof org.telegram.ui.ChatActivity' TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ActionBar.java

          git diff --check
'''
          if marker not in workflow:
              raise SystemExit('release preflight insertion marker changed')
          workflow = workflow.replace(marker, checks, 1)

          if 'NOT-FOR-RELEASE' in workflow:
              raise SystemExit('A NOT-FOR-RELEASE artifact step remains in Play workflow')
          write(workflow_path, workflow)

          # Sanity checks before committing.
          assert 'APP_VERSION_CODE=6994' in read(gradle_path)
          assert 'values.put("iOSMessageInputField", false);' not in read(policy_path)
          assert 'values.put("iOSMessageMenu", false);' in read(policy_path)
          assert 'canUseIosInput()' in read(policy_path)
          assert '.authorgram-settings.json' in read(chat_path)
          assert 'getString(R.string.RegexFilters), ayuLayout' in read(chat_path)
          assert 'parentFragment instanceof org.telegram.ui.ChatActivity' in read(action_path)
          assert "VERSION_CODE: '6994'" in read(workflow_path)
          assert 'NOT-FOR-RELEASE' not in read(workflow_path)
          PY

      - name: Commit requested Play changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AuthorGram Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/apply-play-requested-fixes.yml
          git add gradle.properties \
            .github/workflows/play-aab-release.yml \
            TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramPlayPolicy.java \
            TMessagesProj/src/main/java/toss/authorgram/settings/AGChatSettingsActivity.java \
            TMessagesProj/src/main/java/org/telegram/ui/Components/ChatActivityEnterViewAnimatedIconView.java \
            TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ActionBar.java \
            TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java
          git diff --cached --check
          git commit -m 'Play: restore Message Filters, iOS input and AuthorGram JSON import'
          git push origin HEAD:play-market
