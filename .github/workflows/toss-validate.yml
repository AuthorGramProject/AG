name: TOSS branch validation

on:
  push:
    branches: [agent/toss-play-market-rebrand]
    paths: ['.github/workflows/toss-validate.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NATIVE_TARGET: arm64-v8a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/toss-play-market-rebrand
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36'
      - name: Configure SDK
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties
      - name: Build TOSS debug APK
        id: build
        continue-on-error: true
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          DEBUG_BUILD: 'true'
        run: |
          set -o pipefail
          sed -i 's/signingConfig = signingConfigs.release//g' TMessagesProj/build.gradle
          ./gradlew --no-daemon TMessagesProj:assembleDebug 2>&1 | tee toss-debug.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TOSS-branch-validation-log
          path: toss-debug.log
          retention-days: 7
      - name: Fail failed build
        if: steps.build.outcome != 'success'
        run: exit 1
