name: Temporary Billing v8 migration

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Apply Billing Library 8 API migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('TMessagesProj/src/main/java/org/telegram/messenger/BillingController.java')
          s = p.read_text()

          s = s.replace(
              'import com.android.billingclient.api.ProductDetailsResponseListener;\n',
              ''
          )
          s = s.replace(
              'import com.android.billingclient.api.ProductDetails;\n',
              'import com.android.billingclient.api.PendingPurchasesParams;\nimport com.android.billingclient.api.ProductDetails;\n'
          )
          s = s.replace(
              '.enablePendingPurchases()\n',
              '.enablePendingPurchases(\n                        PendingPurchasesParams.newBuilder()\n                                .enableOneTimeProducts()\n                                .build()\n                )\n'
          )
          s = s.replace(
              '    public void queryProductDetails(List<QueryProductDetailsParams.Product> products, ProductDetailsResponseListener responseListener) {\n',
              '    @FunctionalInterface\n    public interface ProductDetailsResponseCallback {\n        void onResponse(BillingResult billingResult, List<ProductDetails> productDetailsList);\n    }\n\n    public void queryProductDetails(List<QueryProductDetailsParams.Product> products, ProductDetailsResponseCallback responseListener) {\n'
          )
          s = s.replace(
              '        billingClient.queryProductDetailsAsync(QueryProductDetailsParams.newBuilder().setProductList(products).build(), responseListener);\n',
              '        billingClient.queryProductDetailsAsync(\n                QueryProductDetailsParams.newBuilder().setProductList(products).build(),\n                (billingResult, result) -> responseListener.onResponse(\n                        billingResult,\n                        result == null ? Collections.emptyList() : result.getProductDetailsList()\n                )\n        );\n'
          )

          p.write_text(s)
          PY

          git diff --check
          grep -R "enablePendingPurchases()" -n TMessagesProj || true
          grep -R "ProductDetailsResponseListener" -n TMessagesProj/src/main || true
          grep -R "queryPurchaseHistoryAsync\|querySkuDetailsAsync" -n TMessagesProj/src/main || true

      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_fix_billing_v8.yml
          git add TMessagesProj/src/main/java/org/telegram/messenger/BillingController.java
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix: complete Play Billing Library 8 migration'
          git push origin HEAD:dev
