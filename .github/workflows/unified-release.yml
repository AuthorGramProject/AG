name: AuthorGram Unified Release (AGP & PM)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Both AuthorGram+ and Play Market APKs
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VERSION_NAME: 12.10.1
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      AUTHORGRAM_SIGNING_CERT_SHA256: ${{ secrets.AUTHORGRAM_SIGNING_CERT_SHA256 }}
      GH_TOKEN: ${{ github.token }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache
          mkdir -p ${{ github.workspace }}/.ccache
          ccache -M 10G

      - name: Cache ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Cache Gradle
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ github.sha }}
          restore-keys: |
            gradle-

      - name: Checkout AGP (Dev) branch
        uses: actions/checkout@v4
        with:
          ref: agp
          path: build-agp

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Keystore for AGP
        shell: bash
        working-directory: build-agp
        run: |
          set -euo pipefail
          rm -f TMessagesProj/release.keystore
          curl -sSL -H "Authorization: token ${GH_TOKEN}" "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/eaabf4f2c52addfa1fc91d3cb91db6e3ac6e9369/TMessagesProj/release.keystore" > TMessagesProj/release.keystore
          test -s TMessagesProj/release.keystore
          chmod 600 TMessagesProj/release.keystore
          [[ -n "${LOCAL_PROPERTIES}" ]] || { echo 'LOCAL_PROPERTIES secret is missing' >&2; exit 1; }
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
          printf 'cmake.dir=/usr\n' >> local.properties
          printf 'org.gradle.caching=true\norg.gradle.daemon=false\norg.gradle.parallel=true\norg.gradle.workers.max=4\norg.gradle.jvmargs=-Xmx3G -XX:+HeapDumpOnOutOfMemoryError\n' >> gradle.properties

      - name: Build AGP Release APK
        shell: bash
        working-directory: build-agp
        env:
          APP_PACKAGE: fork.risin42.nagramx
          NATIVE_TARGET: arm64-v8a
        run: |
          set -euo pipefail
          ./gradlew --build-cache --stacktrace TMessagesProj:assembleRelease

      - name: Save AGP APK
        shell: bash
        run: |
          mkdir -p unified-outputs
          cp build-agp/TMessagesProj/build/outputs/apk/release/*.apk unified-outputs/AuthorGram-Plus-Release.apk || true
          # Free up space by deleting the agp build directory before PM starts
          rm -rf build-agp

      - name: Checkout PM (Play Market) branch
        uses: actions/checkout@v4
        with:
          ref: play-market
          path: build-pm

      - name: Restore Keystore for PM
        shell: bash
        working-directory: build-pm
        run: |
          set -euo pipefail
          rm -f TMessagesProj/release.keystore
          curl -sSL -H "Authorization: token ${GH_TOKEN}" "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/eaabf4f2c52addfa1fc91d3cb91db6e3ac6e9369/TMessagesProj/release.keystore" > TMessagesProj/release.keystore
          test -s TMessagesProj/release.keystore
          chmod 600 TMessagesProj/release.keystore
          [[ -n "${LOCAL_PROPERTIES}" ]] || { echo 'LOCAL_PROPERTIES secret is missing' >&2; exit 1; }
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
          printf 'cmake.dir=/usr\n' >> local.properties
          printf 'org.gradle.caching=true\norg.gradle.daemon=false\norg.gradle.parallel=true\norg.gradle.workers.max=4\norg.gradle.jvmargs=-Xmx3G -XX:+HeapDumpOnOutOfMemoryError\n' >> gradle.properties

      - name: Build PM Release AAB
        shell: bash
        working-directory: build-pm
        env:
          APP_PACKAGE: toss.authorgram.apk
          NATIVE_TARGET: ""
          IS_BUNDLE: "true"
        run: |
          set -euo pipefail
          ./gradlew --build-cache --stacktrace TMessagesProj:bundleRelease

      - name: Save PM AAB
        shell: bash
        run: |
          mkdir -p unified-outputs
          cp build-pm/TMessagesProj/build/outputs/bundle/release/*.aab unified-outputs/AuthorGram-PlayMarket-Release.aab || true
          rm -rf build-pm


      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: authorgram-unified-apks
          path: unified-outputs/*

      - name: Upload to Latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v12.10.1-features
          files: unified-outputs/*
          fail_on_unmatched_files: false

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ github.sha }}

      - name: Save Gradle Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ github.sha }}

