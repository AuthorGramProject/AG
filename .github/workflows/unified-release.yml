name: AuthorGram Releases (AG+)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-ag-plus:
    name: Build AuthorGram+ (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      AUTHORGRAM_SIGNING_CERT_SHA256: ${{ secrets.AUTHORGRAM_SIGNING_CERT_SHA256 }}
      GH_TOKEN: ${{ github.token }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache
          mkdir -p "${{ github.workspace }}/.ccache"
          ccache -M 10G

      - name: Cache ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-dev-${{ github.sha }}
          restore-keys: |
            ccache-dev-
            ccache-

      - name: Cache Gradle
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-dev-${{ github.sha }}
          restore-keys: |
            gradle-dev-
            gradle-

      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: build-src

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Keystore & Local Properties
        shell: bash
        working-directory: build-src
        run: |
          set -euo pipefail
          rm -f TMessagesProj/release.keystore
          curl -sSL -H "Authorization: token ${GH_TOKEN}" "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/eaabf4f2c52addfa1fc91d3cb91db6e3ac6e9369/TMessagesProj/release.keystore" > TMessagesProj/release.keystore
          chmod 600 TMessagesProj/release.keystore
          [[ -n "${LOCAL_PROPERTIES}" ]] || { echo 'LOCAL_PROPERTIES secret is missing' >&2; exit 1; }
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
          printf 'cmake.dir=/usr\n' >> local.properties
          printf 'org.gradle.caching=true\norg.gradle.daemon=false\norg.gradle.parallel=true\norg.gradle.workers.max=4\norg.gradle.jvmargs=-Xmx3G -XX:+HeapDumpOnOutOfMemoryError\n' >> gradle.properties

      - name: Build AuthorGram+ APK (arm64)
        shell: bash
        working-directory: build-src
        run: |
          export NATIVE_TARGET="arm64-v8a"
          ./gradlew -PAPP_PACKAGE=fork.risin42.nagramx --build-cache --stacktrace TMessagesProj:assembleRelease

      - name: Collect AuthorGram+ APK
        shell: bash
        run: |
          mkdir -p releases
          APK_FILE=$(find build-src/TMessagesProj/build/outputs/apk/release -maxdepth 1 -type f -name '*arm64-v8a*.apk' | head -n 1)
          cp "${APK_FILE}" releases/AuthorGram-Plus-arm64-v8a-release.apk

      - name: Upload AG+ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: authorgram-plus-release
          path: releases/*
          if-no-files-found: error
