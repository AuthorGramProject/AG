name: AuthorGram Play Market Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-play-market:
    name: Build Play Market (AAB & Universal)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      AUTHORGRAM_SIGNING_CERT_SHA256: ${{ secrets.AUTHORGRAM_SIGNING_CERT_SHA256 }}
      GH_TOKEN: ${{ github.token }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache
          mkdir -p "${{ github.workspace }}/.ccache"
          ccache -M 10G

      - name: Cache ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-pm-${{ github.sha }}
          restore-keys: |
            ccache-pm-
            ccache-

      - name: Cache Gradle
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-pm-${{ github.sha }}
          restore-keys: |
            gradle-pm-
            gradle-

      - name: Checkout play-market branch
        uses: actions/checkout@v4
        with:
          ref: play-market
          path: build-src

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Keystore & Local Properties
        shell: bash
        working-directory: build-src
        run: |
          set -euo pipefail
          rm -f TMessagesProj/release.keystore
          curl -sSL -H "Authorization: token ${GH_TOKEN}" "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/eaabf4f2c52addfa1fc91d3cb91db6e3ac6e9369/TMessagesProj/release.keystore" > TMessagesProj/release.keystore
          chmod 600 TMessagesProj/release.keystore
          [[ -n "${LOCAL_PROPERTIES}" ]] || { echo 'LOCAL_PROPERTIES secret is missing' >&2; exit 1; }
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
          printf 'cmake.dir=/usr\n' >> local.properties
          printf 'org.gradle.caching=true\norg.gradle.daemon=false\norg.gradle.parallel=true\norg.gradle.workers.max=4\norg.gradle.jvmargs=-Xmx3G -XX:+HeapDumpOnOutOfMemoryError\n' >> gradle.properties

      - name: Build Play Market AAB
        shell: bash
        working-directory: build-src
        run: |
          ./gradlew -PAPP_PACKAGE=toss.authorgram.apk --build-cache --stacktrace TMessagesProj:bundleRelease

      - name: Build Play Market Universal APK
        shell: bash
        working-directory: build-src
        run: |
          export NATIVE_TARGET=""
          ./gradlew -PAPP_PACKAGE=toss.authorgram.apk --build-cache --stacktrace TMessagesProj:assembleRelease

      - name: Collect Play Market Artifacts
        shell: bash
        run: |
          mkdir -p releases
          AAB_FILE=$(find build-src/TMessagesProj/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)
          cp "${AAB_FILE}" releases/AuthorGram-PlayMarket-release.aab
          APK_FILE=$(find build-src/TMessagesProj/build/outputs/apk/release -maxdepth 1 -type f -name '*standalone*.apk' | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find build-src/TMessagesProj/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | grep -v 'arm64' | grep -v 'x86' | grep -v 'armeabi' | head -n 1)
          fi
          cp "${APK_FILE}" releases/AuthorGram-PlayMarket-Universal-release.apk

      - name: Upload Play Market Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: authorgram-playmarket-release
          path: releases/*
          if-no-files-found: error
