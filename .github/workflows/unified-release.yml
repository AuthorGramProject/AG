name: AuthorGram Unified Release (AGP & PM)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Both AuthorGram+ and Play Market APKs
    runs-on: self-hosted
    timeout-minutes: 720
    env:
      VERSION_NAME: 12.9.2
      NATIVE_TARGET: arm64-v8a
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      AUTHORGRAM_SIGNING_CERT_SHA256: ${{ secrets.AUTHORGRAM_SIGNING_CERT_SHA256 }}
      GH_TOKEN: ${{ github.token }}
      ANDROID_HOME: /home/ubuntu/.android/sdk
      CCACHE_DIR: /home/ubuntu/.ccache

    steps:
      - name: Install ARM64 CMake and Ninja
        run: |
          sudo sed -i 's/^deb http:\/\/ports.ubuntu.com/deb [arch=arm64] http:\/\/ports.ubuntu.com/g' /etc/apt/sources.list
          echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/amd64.list
          echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/amd64.list
          echo "deb [arch=amd64] http://security.ubuntu.com/ubuntu/ jammy-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/amd64.list
          sudo dpkg --add-architecture amd64 && (sudo apt-get update || true) && sudo apt-get install -y libc6:amd64 libncurses5:amd64 libstdc++6:amd64 zlib1g:amd64
          sudo mkdir -p /lib64 && sudo ln -s /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 /lib64/ld-linux-x86-64.so.2 || true
          (sudo apt-get update || true) && sudo apt-get install -y cmake ninja-build qemu-user-static binfmt-support ccache
          NDK_PATH="${ANDROID_HOME}/ndk/27.2.12479018/toolchains/llvm/prebuilt"
          if [ -d "$NDK_PATH/linux-aarch64" ] && [ ! -d "$NDK_PATH/linux-x86_64" ]; then
            ln -s linux-aarch64 "$NDK_PATH/linux-x86_64"
            echo "Symlinked linux-aarch64 to linux-x86_64 for NDK"
          fi
          ccache -M 10G
      - name: Checkout AGP (Dev) branch
        uses: actions/checkout@v4
        with:
          ref: agp
          path: build-agp
          clean: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Keystore for AGP
        shell: bash
        working-directory: build-agp
        run: |
          set -euo pipefail
          rm -f TMessagesProj/release.keystore
          curl -sSL -H "Authorization: token ${GH_TOKEN}" "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/eaabf4f2c52addfa1fc91d3cb91db6e3ac6e9369/TMessagesProj/release.keystore" > TMessagesProj/release.keystore
          test -s TMessagesProj/release.keystore
          chmod 600 TMessagesProj/release.keystore
          [[ -n "${LOCAL_PROPERTIES}" ]] || { echo 'LOCAL_PROPERTIES secret is missing' >&2; exit 1; }
                    printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
          printf 'cmake.dir=/usr\n' >> local.properties
          printf 'org.gradle.caching=true\norg.gradle.daemon=true\norg.gradle.parallel=true\norg.gradle.configuration-cache=true\n' > gradle.properties

      - name: Build AGP Release APK
        shell: bash
        working-directory: build-agp
        env:
          APP_PACKAGE: fork.risin42.nagramx
        run: |
          set -euo pipefail
          ./gradlew --stacktrace TMessagesProj:assembleRelease

      - name: Save AGP APK
        shell: bash
        run: |
          mkdir -p unified-outputs
          cp build-agp/TMessagesProj/build/outputs/apk/release/*.apk unified-outputs/AuthorGram-Plus-Release.apk || true

      - name: Checkout PM (Play Market) branch
        uses: actions/checkout@v4
        with:
          ref: pm
          path: build-pm
          clean: false

      - name: Restore Keystore for PM
        shell: bash
        working-directory: build-pm
        run: |
          set -euo pipefail
          rm -f TMessagesProj/release.keystore
          curl -sSL -H "Authorization: token ${GH_TOKEN}" "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/eaabf4f2c52addfa1fc91d3cb91db6e3ac6e9369/TMessagesProj/release.keystore" > TMessagesProj/release.keystore
          test -s TMessagesProj/release.keystore
          chmod 600 TMessagesProj/release.keystore
          [[ -n "${LOCAL_PROPERTIES}" ]] || { echo 'LOCAL_PROPERTIES secret is missing' >&2; exit 1; }
                    printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
          printf 'cmake.dir=/usr\n' >> local.properties
          printf 'org.gradle.caching=true\norg.gradle.daemon=true\norg.gradle.parallel=true\norg.gradle.configuration-cache=true\n' > gradle.properties

      - name: Build PM Release APK
        shell: bash
        working-directory: build-pm
        env:
          APP_PACKAGE: toss.authorgram.apk
        run: |
          set -euo pipefail
          ./gradlew --stacktrace TMessagesProj:assembleRelease

      - name: Save PM APK
        shell: bash
        run: |
          cp build-pm/TMessagesProj/build/outputs/apk/release/*.apk unified-outputs/AuthorGram-PlayMarket-Release.apk || true

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: authorgram-unified-apks
          path: unified-outputs/*.apk

      - name: Upload to Latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v12.9.2-features
          files: unified-outputs/*.apk
          fail_on_unmatched_files: false
