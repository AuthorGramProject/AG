name: AuthorGram Unified Release (AGP & PM)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-pm:
    name: Build Play Market Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VERSION_NAME: 12.10.1
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      AUTHORGRAM_SIGNING_CERT_SHA256: ${{ secrets.AUTHORGRAM_SIGNING_CERT_SHA256 }}
      GH_TOKEN: ${{ github.token }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      APP_PACKAGE: toss.authorgram.apk
      NATIVE_TARGET: ""
      IS_BUNDLE: "true"

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache
          mkdir -p ${{ github.workspace }}/.ccache
          ccache -M 10G

      - name: Cache ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-pm-${{ github.sha }}
          restore-keys: |
            ccache-pm-
            ccache-

      - name: Cache Gradle
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-pm-${{ github.sha }}
          restore-keys: |
            gradle-pm-
            gradle-

      - name: Checkout PM (Play Market) branch
        uses: actions/checkout@v4
        with:
          ref: play-market
          path: build-pm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Keystore for PM
        shell: bash
        working-directory: build-pm
        run: |
          set -euo pipefail
          rm -f TMessagesProj/release.keystore
          curl -sSL -H "Authorization: token ${GH_TOKEN}" "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/eaabf4f2c52addfa1fc91d3cb91db6e3ac6e9369/TMessagesProj/release.keystore" > TMessagesProj/release.keystore
          test -s TMessagesProj/release.keystore
          chmod 600 TMessagesProj/release.keystore
          [[ -n "${LOCAL_PROPERTIES}" ]] || { echo 'LOCAL_PROPERTIES secret is missing' >&2; exit 1; }
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
          printf 'cmake.dir=/usr\n' >> local.properties
          printf 'org.gradle.caching=true\norg.gradle.daemon=false\norg.gradle.parallel=true\norg.gradle.workers.max=4\norg.gradle.jvmargs=-Xmx3G -XX:+HeapDumpOnOutOfMemoryError\n' >> gradle.properties

      - name: Build PM Release AAB
        shell: bash
        working-directory: build-pm
        run: |
          set -euo pipefail
          ./gradlew -PAPP_PACKAGE=toss.authorgram.apk --build-cache --stacktrace TMessagesProj:bundleRelease

      - name: Verify and Save PM AAB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pm-output
          AAB_FILE=$(ls build-pm/TMessagesProj/build/outputs/bundle/release/*.aab | head -n 1)
          cp "${AAB_FILE}" pm-output/AuthorGram-PlayMarket-Release.aab
          
          # Automated assertion: verify package name in manifest
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("pm-output/AuthorGram-PlayMarket-Release.aab") as z:
              manifest = z.read("base/manifest/AndroidManifest.xml")
              if b"toss.authorgram.apk" not in manifest:
                  raise ValueError("FATAL: toss.authorgram.apk was NOT found in Play Market AAB manifest!")
              print("VERIFICATION SUCCESS: toss.authorgram.apk is confirmed in AndroidManifest.xml!")
          PY
          
          ls -lh pm-output/AuthorGram-PlayMarket-Release.aab

      - name: Upload PM AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: authorgram-pm-aab
          path: pm-output/AuthorGram-PlayMarket-Release.aab

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-pm-${{ github.sha }}

      - name: Save Gradle Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-pm-${{ github.sha }}


  build-agp:
    name: Build AuthorGram+ Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VERSION_NAME: 12.10.1
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      AUTHORGRAM_SIGNING_CERT_SHA256: ${{ secrets.AUTHORGRAM_SIGNING_CERT_SHA256 }}
      GH_TOKEN: ${{ github.token }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      APP_PACKAGE: fork.risin42.nagramx
      NATIVE_TARGET: arm64-v8a

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache
          mkdir -p ${{ github.workspace }}/.ccache
          ccache -M 10G

      - name: Cache ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-agp-${{ github.sha }}
          restore-keys: |
            ccache-agp-
            ccache-

      - name: Cache Gradle
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-agp-${{ github.sha }}
          restore-keys: |
            gradle-agp-
            gradle-

      - name: Checkout AGP (Dev) branch
        uses: actions/checkout@v4
        with:
          ref: agp
          path: build-agp

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Keystore for AGP
        shell: bash
        working-directory: build-agp
        run: |
          set -euo pipefail
          rm -f TMessagesProj/release.keystore
          curl -sSL -H "Authorization: token ${GH_TOKEN}" "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/eaabf4f2c52addfa1fc91d3cb91db6e3ac6e9369/TMessagesProj/release.keystore" > TMessagesProj/release.keystore
          test -s TMessagesProj/release.keystore
          chmod 600 TMessagesProj/release.keystore
          [[ -n "${LOCAL_PROPERTIES}" ]] || { echo 'LOCAL_PROPERTIES secret is missing' >&2; exit 1; }
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
          printf 'cmake.dir=/usr\n' >> local.properties
          printf 'org.gradle.caching=true\norg.gradle.daemon=false\norg.gradle.parallel=true\norg.gradle.workers.max=4\norg.gradle.jvmargs=-Xmx3G -XX:+HeapDumpOnOutOfMemoryError\n' >> gradle.properties

      - name: Build AGP Release APK
        shell: bash
        working-directory: build-agp
        run: |
          set -euo pipefail
          ./gradlew -PAPP_PACKAGE=fork.risin42.nagramx --build-cache --stacktrace TMessagesProj:assembleRelease

      - name: Save AGP APK
        shell: bash
        run: |
          mkdir -p agp-output
          cp build-agp/TMessagesProj/build/outputs/apk/release/*.apk agp-output/AuthorGram-Plus-Release.apk || true

      - name: Upload AGP APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: authorgram-agp-apk
          path: agp-output/AuthorGram-Plus-Release.apk

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-agp-${{ github.sha }}

      - name: Save Gradle Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-agp-${{ github.sha }}


  publish-release:
    name: Publish Release to GitHub
    runs-on: ubuntu-latest
    needs: [build-pm, build-agp]
    steps:
      - name: Download PM AAB
        uses: actions/download-artifact@v4
        with:
          name: authorgram-pm-aab
          path: release-outputs

      - name: Download AGP APK
        uses: actions/download-artifact@v4
        with:
          name: authorgram-agp-apk
          path: release-outputs

      - name: Upload to Latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v12.10.1-features
          files: release-outputs/*
          fail_on_unmatched_files: false

