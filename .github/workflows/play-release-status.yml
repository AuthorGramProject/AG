name: AuthorGram Play Release Status

on:
  workflow_run:
    workflows: ["AuthorGram 12.9.2 Play ARM64 Release"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish-status:
    if: github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Publish Play release completion status
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = '.github/PLAY_RELEASE_STATUS_12_9_2.json';
            const branch = 'dev';
            const run = context.payload.workflow_run;
            const payload = {
              workflow: run.name,
              run_id: run.id,
              run_number: run.run_number,
              run_attempt: run.run_attempt,
              status: run.status,
              conclusion: run.conclusion,
              event: run.event,
              head_branch: run.head_branch,
              head_sha: run.head_sha,
              html_url: run.html_url,
              created_at: run.created_at,
              updated_at: run.updated_at,
            };
            const content = Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: `Record Play release run ${run.id}: ${run.conclusion}`,
              content,
              branch,
              ...(sha ? { sha } : {}),
            });
