name: AuthorGram 12.9.1 Final Verified Release

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: [.github/FINAL_RELEASE_12_9_1]

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: authorgram-12-9-1-final-release
  cancel-in-progress: true

jobs:
  release:
    name: Finalize, verify and build Main + Play
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'Run final AuthorGram 12.9.1 release'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MAIN_PACKAGE: fork.risin42.nagramx
      PLAY_PACKAGE: toss.authorgram.apk
      VERSION_NAME: 12.9.1
      VERSION_CODE: '6967'
      NATIVE_TARGET: arm64-v8a
      PYTHONDONTWRITEBYTECODE: '1'
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      AUTHORGRAM_SIGNING_CERT_SHA256: ${{ secrets.AUTHORGRAM_SIGNING_CERT_SHA256 }}

    steps:
      - name: Checkout release controller
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Publish pending release status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'authorgram/final-release',
              description: 'Final AuthorGram 12.9.1 verification is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Delete historical failed and cancelled workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const removable = new Set(['failure', 'cancelled']);
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            let deleted = 0;
            for (const run of runs) {
              if (Number(run.id) === Number(context.runId) || !removable.has(run.conclusion)) {
                continue;
              }
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                deleted += 1;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            core.info(`Deleted ${deleted} failed/cancelled workflow run(s).`);

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36'

      - name: Validate release controller scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/final_release_12_9_1.sh
          python3 - <<'PY'
          from pathlib import Path

          for relative in (
              'scripts/apply_authorgram_visual_revision.py',
              'scripts/finalize_authorgram_source.py',
              'scripts/authorgram_guard.py',
              'scripts/authorgram_parity_guard.py',
          ):
              source = Path(relative).read_text(encoding='utf-8')
              compile(source, relative, 'exec')
              print(f'Python syntax passed: {relative}')
          PY

      - name: Apply visual cleanup and private Spy menu
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_authorgram_visual_revision.py
          git diff --check
          git config user.name "AuthorGram Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Apply AuthorGram launcher and Spy revision"
            git push origin HEAD:dev
          fi

      - name: Finalize sources and build verified release artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/final_release_12_9_1.sh

      - name: Upload final verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuthorGram-12.9.1-Final-Verified-Release
          path: ${{ runner.temp }}/authorgram-final/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish successful release status
        if: ${{ success() }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'authorgram/final-release',
              description: 'Main APK and Play APK/AAB passed final verification',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Publish failed release status
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'authorgram/final-release',
              description: 'Final AuthorGram release verification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
