name: AuthorGram 12.9.1 Final Verified Release

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: [.github/FINAL_RELEASE_12_9_1]

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: authorgram-12-9-1-final-release
  cancel-in-progress: true

jobs:
  release:
    name: Verify and build Main + Play APKs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'Run final AuthorGram 12.9.1 release'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MAIN_PACKAGE: fork.risin42.nagramx
      PLAY_PACKAGE: toss.authorgram.apk
      VERSION_NAME: 12.9.1
      VERSION_CODE: '6967'
      NATIVE_TARGET: arm64-v8a
      PYTHONDONTWRITEBYTECODE: '1'
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      AUTHORGRAM_SIGNING_CERT_SHA256: ${{ secrets.AUTHORGRAM_SIGNING_CERT_SHA256 }}

    steps:
      - name: Checkout release controller
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Publish pending release status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'authorgram/final-release',
              description: 'Main and Play release APK verification is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Clean historical and unsuccessful workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const targetTitle = 'Update/telegram 12.9.0 20260718 212239';
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            const matchingRuns = runs
              .filter(run => {
                const commitMessage = run.head_commit && run.head_commit.message
                  ? run.head_commit.message.split(/\r?\n/, 1)[0]
                  : '';
                return run.display_title === targetTitle
                  || run.name === targetTitle
                  || commitMessage === targetTitle;
              })
              .sort((left, right) => Date.parse(right.created_at) - Date.parse(left.created_at));

            if (matchingRuns.length === 0) {
              core.setFailed(`Cleanup cutoff workflow run was not found: ${targetTitle}`);
              return;
            }

            const cutoffRun = matchingRuns[0];
            const cutoffTime = Date.parse(cutoffRun.created_at);
            if (!Number.isFinite(cutoffTime)) {
              core.setFailed(`Invalid cutoff run date: ${cutoffRun.created_at}`);
              return;
            }

            const unsuccessful = new Set(['failure', 'cancelled']);
            let deletedBeforeCutoff = 0;
            let deletedUnsuccessful = 0;

            for (const run of runs) {
              if (Number(run.id) === Number(context.runId)) {
                continue;
              }
              const beforeOrAtCutoff = Date.parse(run.created_at) <= cutoffTime;
              const isUnsuccessful = unsuccessful.has(run.conclusion);
              if (!beforeOrAtCutoff && !isUnsuccessful) {
                continue;
              }
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                if (beforeOrAtCutoff) {
                  deletedBeforeCutoff += 1;
                } else {
                  deletedUnsuccessful += 1;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            core.info(`Cleanup cutoff run: ${cutoffRun.id} (${cutoffRun.created_at}) ${targetTitle}`);
            core.info(`Deleted ${deletedBeforeCutoff} run(s) at or before the cutoff.`);
            core.info(`Deleted ${deletedUnsuccessful} newer failed/cancelled run(s).`);

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36'

      - name: Validate release controller scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/final_release_12_9_1.sh
          python3 - <<'PY'
          from pathlib import Path

          for relative in (
              'scripts/apply_authorgram_exact_icon_and_spy.py',
              'scripts/fix_authorgram_adaptive_icon.py',
              'scripts/finalize_authorgram_source.py',
              'scripts/authorgram_guard.py',
              'scripts/authorgram_parity_guard.py',
          ):
              source = Path(relative).read_text(encoding='utf-8')
              compile(source, relative, 'exec')
              print(f'Python syntax passed: {relative}')
          PY

      - name: Apply exact launcher icon and complete private Spy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_authorgram_exact_icon_and_spy.py
          python3 scripts/fix_authorgram_adaptive_icon.py
          git diff --check
          git config user.name "AuthorGram Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Apply exact AuthorGram icon and complete Spy revision"
            git push origin HEAD:dev
          fi

      - name: Finalize sources and build two verified release APKs
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/final_release_12_9_1.sh

      - name: Verify exactly two APK artifacts and no AAB
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/authorgram-final/artifacts"
          mapfile -t apks < <(find "${artifact_dir}" -maxdepth 1 -type f -name '*.apk' -print | sort)
          mapfile -t aabs < <(find "${artifact_dir}" -maxdepth 1 -type f -name '*.aab' -print | sort)
          [[ "${#apks[@]}" -eq 2 ]] || {
            printf 'Expected exactly two APKs, found %s\n' "${#apks[@]}" >&2
            printf '%s\n' "${apks[@]}" >&2
            exit 1
          }
          [[ "${#aabs[@]}" -eq 0 ]] || {
            printf 'AAB files are forbidden in this release.\n' >&2
            printf '%s\n' "${aabs[@]}" >&2
            exit 1
          }
          printf 'Verified APK artifacts:\n%s\n' "${apks[*]}"

      - name: Upload Main and Play release APKs
        uses: actions/upload-artifact@v4
        with:
          name: AuthorGram-12.9.1-Main-and-Play-Release-APKs
          path: ${{ runner.temp }}/authorgram-final/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish successful release status
        if: ${{ success() }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'authorgram/final-release',
              description: 'Main and Play release APKs passed final verification',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Publish failed release status
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'authorgram/final-release',
              description: 'Final AuthorGram two-APK verification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
