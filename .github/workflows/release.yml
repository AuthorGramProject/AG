name: AuthorGram 12.9.2 Stable Main Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev]
    paths:
      - .github/STABLE_MAIN_RELEASE_12_9_2
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: authorgram-12-9-2-canonical-main-arm64
  cancel-in-progress: true

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'release/authorgram-12-9-2-stable-main-final'
    name: Preflight, clean Actions, build stable Main APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MAIN_PACKAGE: fork.risin42.nagramx
      VERSION_NAME: 12.9.2
      VERSION_CODE: '6991'
      PYTHONDONTWRITEBYTECODE: '1'
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      AUTHORGRAM_SIGNING_CERT_SHA256: ${{ secrets.AUTHORGRAM_SIGNING_CERT_SHA256 }}

    steps:
      - name: Checkout canonical dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Static stability preflight
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${LOCAL_PROPERTIES}" ]] || {
            echo 'LOCAL_PROPERTIES secret is missing.' >&2
            exit 1
          }

          bash -n scripts/final_main_stable_release_12_9_2.sh

          python3 - <<'PY'
          from pathlib import Path

          scripts = (
              'scripts/finalize_authorgram_source.py',
              'scripts/patch_authorgram_popup_bounds.py',
              'scripts/patch_authorgram_full_screen_ios_blur.py',
              'scripts/patch_authorgram_chat_scope_safety.py',
              'scripts/patch_authorgram_main_stability.py',
              'scripts/patch_authorgram_ios_input_geometry.py',
              'scripts/audit_authorgram_runtime_stability.py',
          )
          for relative in scripts:
              source = Path(relative).read_text(encoding='utf-8')
              compile(source, relative, 'exec')

          stability = Path('scripts/patch_authorgram_main_stability.py').read_text(encoding='utf-8')
          for marker in (
              'AUTHORGRAM_STABLE_FIXED_IOS_PREVIEW',
              'AUTHORGRAM_STABLE_IOS_INPUT_LIFECYCLE',
              'AUTHORGRAM_STABLE_IOS_MENU_FOOTER',
              'AUTHORGRAM_NATIVE_ONLY_IOS_MESSAGE_PREVIEW',
              'AUTHORGRAM_WEB_PREVIEW_SAFE_IOS_MESSAGE_PREVIEW',
              'AUTHORGRAM_BOUNDED_NATIVE_IOS_PREVIEW',
              'AUTHORGRAM_CANONICAL_SEPARATE_IOS_PREVIEW',
              'AUTHORGRAM_REFERENCE_IOS_MENU_GEOMETRY',
              'AUTHORGRAM_LIVE_IOS_INPUT_STYLE_GATE',
              'AUTHORGRAM_COMPACT_IOS_MENU_FOOTER',
              'AUTHORGRAM_CLASSIC_POPUP_ZERO_EXTRA_PADDING',
              'new ChatMessageCell(context, currentAccount)',
              'new ScrollView(context)',
              'previewScroll.setNestedScrollingEnabled(true);',
              'previewCell.setMessageObject(messageObject, null, false, false, false);',
              'Math.min(oldParams.height, AndroidUtilities.dp(44))',
              'params.topMargin = AndroidUtilities.dp(8);',
              'params.bottomMargin = AndroidUtilities.dp(8);',
              'if (!isIOSInputStyle() || !isAttachedToWindow())',
              'postDelayed(authorGramInputMenuInvariantRunnable, 160L);',
          ):
              if marker not in stability:
                  raise SystemExit(f'stability pass missing {marker}')

          blur = Path('scripts/patch_authorgram_full_screen_ios_blur.py').read_text(encoding='utf-8')
          for marker in (
              'AUTHORGRAM_FULL_SCREEN_IOS_MENU_BLUR',
              'dimBehindView(null, true, true);',
              'refusing fuzzy patch',
          ):
              if marker not in blur:
                  raise SystemExit(f'full-screen blur pass missing {marker}')

          scope = Path('scripts/patch_authorgram_chat_scope_safety.py').read_text(encoding='utf-8')
          for marker in (
              'Read-only safety guard',
              'validate_canonical',
              'scope guard is read-only; no source rewrite performed',
          ):
              if marker not in scope:
                  raise SystemExit(f'scope safety guard missing {marker}')
          for forbidden in ('write_chat(', 'write_preview(', 'PREVIEW_SOURCE ='):
              if forbidden in scope:
                  raise SystemExit(f'scope safety guard is still mutating source: {forbidden}')

          runtime_audit = Path('scripts/audit_authorgram_runtime_stability.py').read_text(encoding='utf-8')
          for marker in (
              'AUTHORGRAM_FULL_SCREEN_IOS_MENU_BLUR',
              'AUTHORGRAM_REFERENCE_IOS_MENU_GEOMETRY',
              'AUTHORGRAM_REPLY_TARGET_DECRYPTION',
              'AUTHORGRAM_SETTINGS_PREVIEW_REPLY_INVARIANT',
          ):
              if marker not in runtime_audit:
                  raise SystemExit(f'runtime stability audit missing {marker}')

          geometry = Path('scripts/patch_authorgram_ios_input_geometry.py').read_text(encoding='utf-8')
          for marker in (
              'AUTHORGRAM_IOS_INPUT_GEOMETRY_INVARIANT',
              'authorGramStabilizeIOSInputGeometry',
              'authorGramScheduleInputGeometryInvariant',
              'updateSideBubbles();',
              'postDelayed(authorGramInputGeometryRunnable, 320L);',
          ):
              if marker not in geometry:
                  raise SystemExit(f'iOS input geometry pass missing {marker}')

          chat = Path('TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java').read_text(encoding='utf-8')
          enter = Path('TMessagesProj/src/main/java/org/telegram/ui/Components/ChatActivityEnterView.java').read_text(encoding='utf-8')
          scrim = Path('TMessagesProj/src/main/java/org/telegram/ui/Components/ChatScrimPopupContainerLayout.java').read_text(encoding='utf-8')

          for required in (
              'AUTHORGRAM_IOS_MESSAGE_MENU_PREVIEW',
              'NekoConfig.iOSMessageMenu.Bool()',
              'AuthorGramPlayPolicy.canUseIosUi()',
          ):
              if required not in chat:
                  raise SystemExit(f'ChatActivity preflight missing {required}')

          if enter.count('public View getSendButtonInternal() {') != 1:
              raise SystemExit('getSendButtonInternal method count is not exactly one')
          if 'AUTHORGRAM_INPUT_MENU_INVARIANT_HELPER' not in enter:
              raise SystemExit('composer invariant anchor missing')
          if 'AUTHORGRAM_MAIN_ONLY_IOS_INPUT' not in enter:
              raise SystemExit('Main-only iOS input policy gate missing')
          if 'AUTHORGRAM_UNIFIED_MENU_FOOTER' not in scrim:
              raise SystemExit('menu footer anchor missing')
          PY

          python3 scripts/patch_authorgram_chat_scope_safety.py --mode pre-apply
          python3 scripts/patch_authorgram_ios_input_geometry.py --mode pre-apply
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Purge superseded Actions and disable obsolete workflows
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = Number(context.runId);
            const currentWorkflowPath = '.github/workflows/release.yml';
            const activeStates = new Set(['queued', 'in_progress', 'waiting', 'pending', 'requested']);
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            async function listRuns() {
              return await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, per_page: 100 },
              );
            }

            async function jobsFor(runId) {
              try {
                return await github.paginate(
                  github.rest.actions.listJobsForWorkflowRun,
                  { owner, repo, run_id: runId, per_page: 100 },
                );
              } catch (error) {
                core.warning(`Unable to inspect jobs for ${runId}: ${error.message}`);
                return null;
              }
            }

            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              { owner, repo, per_page: 100 },
            );
            for (const workflow of workflows) {
              if (workflow.path === currentWorkflowPath || workflow.state !== 'active') continue;
              try {
                await github.rest.actions.disableWorkflow({ owner, repo, workflow_id: workflow.id });
                core.info(`Disabled obsolete workflow ${workflow.id}: ${workflow.name}`);
              } catch (error) {
                core.warning(`Unable to disable workflow ${workflow.id}: ${error.message}`);
              }
            }

            async function deleteRun(run) {
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                core.info(`Deleted superseded run ${run.id}: ${run.name}`);
                return true;
              } catch (error) {
                core.warning(`Delete failed for ${run.id}: ${error.message}`);
                return false;
              }
            }

            async function stopRun(run) {
              try {
                await github.request(
                  'POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel',
                  { owner, repo, run_id: run.id },
                );
                return;
              } catch (forceError) {
                core.warning(`Force-cancel failed for ${run.id}: ${forceError.message}`);
              }
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
              } catch (cancelError) {
                core.warning(`Normal cancel failed for ${run.id}: ${cancelError.message}`);
              }
            }

            for (let pass = 1; pass <= 5; pass += 1) {
              const runs = (await listRuns()).filter(run => Number(run.id) !== currentRunId);
              if (runs.length === 0) break;
              for (const run of runs) {
                if (activeStates.has(run.status)) {
                  if (!await deleteRun(run)) await stopRun(run);
                } else {
                  await deleteRun(run);
                }
              }
              await sleep(6000);
            }

            const remaining = (await listRuns()).filter(run => Number(run.id) !== currentRunId);
            const blockers = [];
            for (const run of remaining) {
              const jobs = await jobsFor(run.id);
              if (jobs === null || jobs.length > 0) {
                blockers.push(`${run.id}:${run.status}:${run.name}`);
              } else {
                core.warning(`Ignoring GitHub stale zero-job record ${run.id}:${run.status}:${run.name}`);
              }
            }

            if (blockers.length > 0) {
              core.setFailed(`Real superseded Actions runs remain: ${blockers.join(', ')}`);
            } else {
              core.info('No real superseded workflow job remains.');
            }

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          check-latest: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36'

      - name: Build and verify stable Main release
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/final_main_stable_release_12_9_2.sh

      - name: Verify exact Main artifact set
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/authorgram-main-stable/artifacts"
          mapfile -t apks < <(find "${artifact_dir}" -maxdepth 1 -type f -name '*.apk' -print | sort)
          mapfile -t aabs < <(find "${artifact_dir}" -maxdepth 1 -type f -name '*.aab' -print | sort)

          [[ "${#apks[@]}" -eq 1 ]] || {
            echo "Expected exactly one Main APK, found ${#apks[@]}" >&2
            exit 1
          }
          [[ "${#aabs[@]}" -eq 0 ]] || {
            echo 'AAB files are forbidden.' >&2
            exit 1
          }

          test -s "${artifact_dir}/Main-BUILD.txt"
          test -s "${artifact_dir}/Main-CERTIFICATE.txt"
          test -s "${artifact_dir}/RELEASE-SUMMARY.txt"
          test -s "${artifact_dir}/SHA256SUMS.txt"
          grep -q '^playTouched=false$' "${artifact_dir}/Main-BUILD.txt"
          grep -q 'AuthorGram-Main-.*\.apk' "${artifact_dir}/SHA256SUMS.txt"

          cat "${artifact_dir}/RELEASE-SUMMARY.txt"
          cat "${artifact_dir}/SHA256SUMS.txt"

      - name: Upload stable Main APK
        uses: actions/upload-artifact@v4
        with:
          name: AuthorGram-12.9.2-Stable-Main-Release
          path: ${{ runner.temp }}/authorgram-main-stable/artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
