name: AuthorGram 12.9.1 Final Verified Release

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: [.github/FINAL_RELEASE_12_9_1]

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: authorgram-12-9-1-final-release
  cancel-in-progress: true

jobs:
  release:
    name: Verify and build Main + Play APKs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'Run final AuthorGram 12.9.1 release'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MAIN_PACKAGE: fork.risin42.nagramx
      PLAY_PACKAGE: toss.authorgram.apk
      VERSION_NAME: 12.9.1
      VERSION_CODE: '6967'
      NATIVE_TARGET: arm64-v8a
      PYTHONDONTWRITEBYTECODE: '1'
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      AUTHORGRAM_SIGNING_CERT_SHA256: ${{ secrets.AUTHORGRAM_SIGNING_CERT_SHA256 }}

    steps:
      - name: Checkout release controller
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Publish pending release status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'authorgram/final-release',
              description: 'Main and Play release APK verification is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Remove Designers workflow and clean historical runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const cutoffTitle = 'Update/telegram 12.9.0 20260718 212239';
            const fallbackCutoffIso = '2026-07-19T10:47:18Z';
            const designerPattern = /\bdesigners?\b/i;
            const branches = ['dev', 'main', 'play-market'];

            let deletedDesignerFiles = 0;
            for (const branch of branches) {
              let entries;
              try {
                const response = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: '.github/workflows',
                  ref: branch,
                });
                entries = Array.isArray(response.data) ? response.data : [];
              } catch (error) {
                if (error.status === 404) {
                  core.info(`No workflow directory on ${branch}.`);
                  continue;
                }
                throw error;
              }

              for (const entry of entries) {
                if (entry.type !== 'file' || !/\.(?:ya?ml)$/i.test(entry.name)) {
                  continue;
                }

                let isDesignerWorkflow = designerPattern.test(entry.name);
                if (!isDesignerWorkflow) {
                  const file = await github.rest.repos.getContent({
                    owner,
                    repo,
                    path: entry.path,
                    ref: branch,
                  });
                  if (!Array.isArray(file.data) && file.data.content) {
                    const source = Buffer.from(file.data.content, 'base64').toString('utf8');
                    const topLevelName = source.match(/^name:\s*(.+)$/m)?.[1] ?? '';
                    isDesignerWorkflow = designerPattern.test(topLevelName);
                  }
                }

                if (!isDesignerWorkflow) {
                  continue;
                }

                await github.rest.repos.deleteFile({
                  owner,
                  repo,
                  path: entry.path,
                  branch,
                  sha: entry.sha,
                  message: `[skip ci] Remove obsolete Designers workflow from ${branch}`,
                });
                deletedDesignerFiles += 1;
                core.info(`Deleted obsolete workflow ${entry.path} from ${branch}.`);
              }
            }

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );
            const cutoffMatches = runs.filter(run => {
              const values = [
                run.display_title,
                run.name,
                run.head_commit?.message,
              ].filter(Boolean);
              return values.some(value => value === cutoffTitle);
            });
            cutoffMatches.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            const cutoffIso = cutoffMatches[0]?.created_at ?? fallbackCutoffIso;
            const cutoffTime = Date.parse(cutoffIso);
            const unsuccessful = new Set(['failure', 'cancelled']);
            let deletedBeforeCutoff = 0;
            let deletedDesignerRuns = 0;
            let deletedUnsuccessful = 0;

            for (const run of runs) {
              if (Number(run.id) === Number(context.runId)) {
                continue;
              }
              const runLabel = `${run.name ?? ''} ${run.display_title ?? ''}`;
              const beforeOrAtCutoff = Date.parse(run.created_at) <= cutoffTime;
              const isDesignerRun = designerPattern.test(runLabel);
              const isUnsuccessful = unsuccessful.has(run.conclusion);
              if (!beforeOrAtCutoff && !isDesignerRun && !isUnsuccessful) {
                continue;
              }

              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                if (beforeOrAtCutoff) {
                  deletedBeforeCutoff += 1;
                } else if (isDesignerRun) {
                  deletedDesignerRuns += 1;
                } else {
                  deletedUnsuccessful += 1;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const remainingRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );
            const remainingHistorical = remainingRuns.filter(run =>
              Number(run.id) !== Number(context.runId)
              && Date.parse(run.created_at) <= cutoffTime
            );
            const remainingDesigner = remainingRuns.filter(run =>
              Number(run.id) !== Number(context.runId)
              && designerPattern.test(`${run.name ?? ''} ${run.display_title ?? ''}`)
            );
            if (remainingHistorical.length || remainingDesigner.length) {
              throw new Error(
                `Workflow cleanup incomplete: historical=${remainingHistorical.length}, designers=${remainingDesigner.length}`
              );
            }

            core.info(`Cleanup cutoff: ${cutoffIso} — ${cutoffTitle}`);
            core.info(`Deleted ${deletedDesignerFiles} Designers workflow file(s).`);
            core.info(`Deleted ${deletedBeforeCutoff} run(s) at or before the cutoff.`);
            core.info(`Deleted ${deletedDesignerRuns} newer Designers run(s).`);
            core.info(`Deleted ${deletedUnsuccessful} newer failed/cancelled run(s).`);

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36'

      - name: Validate release controller scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/final_release_12_9_1.sh
          python3 - <<'PY'
          from pathlib import Path

          for relative in (
              'scripts/apply_authorgram_exact_icon_and_spy.py',
              'scripts/fix_authorgram_adaptive_icon.py',
              'scripts/finalize_authorgram_source.py',
              'scripts/authorgram_guard.py',
              'scripts/authorgram_parity_guard.py',
          ):
              source = Path(relative).read_text(encoding='utf-8')
              compile(source, relative, 'exec')
              print(f'Python syntax passed: {relative}')
          PY

      - name: Apply exact launcher icon and complete private Spy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_authorgram_exact_icon_and_spy.py
          python3 scripts/fix_authorgram_adaptive_icon.py
          git diff --check
          git config user.name "AuthorGram Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Apply exact AuthorGram icon and complete Spy revision"
            git push origin HEAD:dev
          fi

      - name: Finalize sources and build two verified release APKs
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/final_release_12_9_1.sh

      - name: Verify exactly two APK artifacts and no AAB
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/authorgram-final/artifacts"
          mapfile -t apks < <(find "${artifact_dir}" -maxdepth 1 -type f -name '*.apk' -print | sort)
          mapfile -t aabs < <(find "${artifact_dir}" -maxdepth 1 -type f -name '*.aab' -print | sort)
          [[ "${#apks[@]}" -eq 2 ]] || {
            printf 'Expected exactly two APKs, found %s\n' "${#apks[@]}" >&2
            printf '%s\n' "${apks[@]}" >&2
            exit 1
          }
          [[ "${#aabs[@]}" -eq 0 ]] || {
            printf 'AAB files are forbidden in this release.\n' >&2
            printf '%s\n' "${aabs[@]}" >&2
            exit 1
          }
          printf 'Verified APK artifacts:\n%s\n' "${apks[*]}"

      - name: Upload Main and Play release APKs
        uses: actions/upload-artifact@v4
        with:
          name: AuthorGram-12.9.1-Main-and-Play-Release-APKs
          path: ${{ runner.temp }}/authorgram-final/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish successful release status
        if: ${{ success() }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'authorgram/final-release',
              description: 'Main and Play release APKs passed final verification',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Publish failed release status
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'authorgram/final-release',
              description: 'Final AuthorGram two-APK verification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
