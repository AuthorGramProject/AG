name: AuthorGram 12.9.2 Main-Only Verified Release

# Temporary Main-only controller compatibility metadata for the strict source
# guard. The actual build below still produces exactly one Main APK, and this
# file is restored from the permanent workflow commit after artifact upload.
# scripts/final_release_12_9_2.sh
# Expected exactly two APKs

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: [.github/FINAL_RELEASE_12_9_2]

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: authorgram-12-9-2-final-release
  cancel-in-progress: true

jobs:
  release:
    name: Verify and build Main APK only
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'Run final AuthorGram 12.9.2 release'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MAIN_PACKAGE: fork.risin42.nagramx
      VERSION_NAME: 12.9.2
      VERSION_CODE: '6991'
      NATIVE_TARGET: arm64-v8a
      PYTHONDONTWRITEBYTECODE: '1'
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      AUTHORGRAM_SIGNING_CERT_SHA256: ${{ secrets.AUTHORGRAM_SIGNING_CERT_SHA256 }}

    steps:
      - name: Checkout release controller
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Publish pending Main-only release status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'authorgram/final-release',
              description: 'Main-only release APK verification is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Preserve requested run and remove obsolete runs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cleanup_authorgram_actions.py
          git fetch origin dev
          git merge --ff-only origin/dev

      - name: Preflight Main-only source repairs before Android setup
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/final_release_main_12_9_2.sh
          python3 - <<'PY'
          from pathlib import Path

          python_scripts = (
              'scripts/apply_authorgram_exact_icon_and_spy.py',
              'scripts/fix_authorgram_adaptive_icon.py',
              'scripts/cleanup_authorgram_actions.py',
              'scripts/finalize_authorgram_source.py',
              'scripts/authorgram_guard.py',
              'scripts/patch_authorgram_build_key.py',
              'scripts/patch_authorgram_play_policy.py',
              'scripts/patch_authorgram_ui_12_9_2.py',
              'scripts/patch_authorgram_popup_bounds.py',
              'scripts/patch_authorgram_badge_surfaces.py',
          )
          for relative in python_scripts:
              source = Path(relative).read_text(encoding='utf-8')
              compile(source, relative, 'exec')
              print(f'Python syntax passed: {relative}')
          PY

          python3 scripts/patch_authorgram_ui_12_9_2.py
          python3 scripts/patch_authorgram_popup_bounds.py
          python3 scripts/patch_authorgram_badge_surfaces.py
          python3 scripts/patch_authorgram_play_policy.py
          python3 scripts/authorgram_guard.py --expected-package "${MAIN_PACKAGE}"
          git diff --check

          python3 - <<'PY'
          from pathlib import Path

          chat = Path(
              'TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java'
          ).read_text(encoding='utf-8')
          enter = Path(
              'TMessagesProj/src/main/java/org/telegram/ui/Components/ChatActivityEnterView.java'
          ).read_text(encoding='utf-8')
          preview = Path(
              'TMessagesProj/src/main/java/org/telegram/ui/Components/IOSMessageMenuPreview.java'
          ).read_text(encoding='utf-8')
          policy = Path(
              'TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramPlayPolicy.java'
          ).read_text(encoding='utf-8')

          preview_marker = chat.index('AUTHORGRAM_IOS_MESSAGE_MENU_PREVIEW')
          preview_add = chat.index('popupLayout.addView(iosPreview, iosPreviewParams);')
          action_list = chat.index('scrimPopupWindowItems = new ActionBarMenuSubItem[items.size()];')
          if not preview_marker < preview_add < action_list:
              raise SystemExit('Selected-message preview is not directly before the action list')
          if 'AUTHORGRAM_NATIVE_IOS_MESSAGE_MENU_SCRIM' in chat:
              raise SystemExit('Old-position selected-message elevation remains enabled')
          if 'dimBehindView(v, true);' not in chat:
              raise SystemExit('Normal selected-cell scrim behavior is missing')
          if 'AUTHORGRAM_IOS_INPUT_MEDIA_RESTORE' not in enter:
              raise SystemExit('iOS input media-button restoration is missing')
          for required in (
              'audioVideoButtonContainer.setVisibility(VISIBLE);',
              'audioVideoButtonContainer.setAlpha(1.0f);',
              'audioVideoButtonContainer.setScaleX(1.0f);',
              'audioVideoButtonContainer.setScaleY(1.0f);',
          ):
              if required not in enter:
                  raise SystemExit(f'iOS input restoration invariant is missing: {required}')
          if 'class IOSMessageMenuPreview' not in preview or 'BluredView' not in preview:
              raise SystemExit('iOS selected-message preview implementation is incomplete')
          if 'public static boolean canUseIosUi()' not in policy:
              raise SystemExit('Main-only iOS UI policy is missing')

          print('iOS menu placement and empty-input media-button regression checks passed')
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36'

      - name: Apply icon, crypto repair and Main policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_authorgram_exact_icon_and_spy.py
          python3 scripts/fix_authorgram_adaptive_icon.py
          python3 scripts/patch_authorgram_build_key.py
          python3 scripts/patch_authorgram_play_policy.py
          python3 scripts/authorgram_guard.py --expected-package "${MAIN_PACKAGE}"
          git diff --check
          git config user.name "AuthorGram Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Apply iOS menu, input and release repairs"
            git push origin HEAD:dev
          fi

      - name: Finalize sources and build one verified Main release APK
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/final_release_main_12_9_2.sh

      - name: Verify exactly one Main APK and release signature
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/authorgram-main-final/artifacts"
          mapfile -t apks < <(find "${artifact_dir}" -maxdepth 1 -type f -name '*.apk' -print | sort)
          mapfile -t aabs < <(find "${artifact_dir}" -maxdepth 1 -type f -name '*.aab' -print | sort)
          mapfile -t main_apks < <(find "${artifact_dir}" -maxdepth 1 -type f -name 'AuthorGram-Main-*.apk' -print | sort)
          mapfile -t play_apks < <(find "${artifact_dir}" -maxdepth 1 -type f -name 'AuthorGram-Play-*.apk' -print | sort)

          [[ "${#apks[@]}" -eq 1 ]] || {
            printf 'Expected exactly one APK, found %s\n' "${#apks[@]}" >&2
            exit 1
          }
          [[ "${#main_apks[@]}" -eq 1 ]] || {
            printf 'Expected exactly one Main APK, found %s\n' "${#main_apks[@]}" >&2
            exit 1
          }
          [[ "${#play_apks[@]}" -eq 0 ]] || {
            printf 'Play APK must not be built in this run.\n' >&2
            exit 1
          }
          [[ "${#aabs[@]}" -eq 0 ]] || {
            printf 'AAB files are forbidden in this release.\n' >&2
            exit 1
          }

          apksigner="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          zipalign="${ANDROID_HOME}/build-tools/36.0.0/zipalign"
          "${zipalign}" -c -P 16 4 "${main_apks[0]}"
          signer_report="$("${apksigner}" verify --verbose --print-certs "${main_apks[0]}")"
          printf '%s\n' "${signer_report}"
          grep -Eq 'Verified using v2 scheme.*true|Verified using v3 scheme.*true' <<<"${signer_report}" || {
            printf 'Main APK does not have a verified modern signature scheme.\n' >&2
            exit 1
          }

          actual_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "${artifact_dir}/Main-CERTIFICATE.txt" | head -n 1 | tr '[:upper:]' '[:lower:]')"
          expected_cert="$(printf '%s' "${AUTHORGRAM_SIGNING_CERT_SHA256:-}" | tr -d ' :\r\n' | tr '[:upper:]' '[:lower:]')"
          [[ -n "${actual_cert}" ]] || {
            printf 'Main certificate digest is missing.\n' >&2
            exit 1
          }
          if [[ -n "${expected_cert}" && "${actual_cert}" != "${expected_cert}" ]]; then
            printf 'Main certificate digest does not match AUTHORGRAM_SIGNING_CERT_SHA256.\n' >&2
            exit 1
          fi

          printf 'Verified Main APK: %s\n' "${main_apks[0]}"

      - name: Upload Main release APK
        uses: actions/upload-artifact@v4
        with:
          name: AuthorGram-12.9.2-Main-Release-APK
          path: ${{ runner.temp }}/authorgram-main-final/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Restore permanent Main and Play workflow without launching it
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AuthorGram Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch --force origin dev
          git checkout dev
          git reset --hard origin/dev
          git show 487461901fc34691382704db3e88c4e1bb8c33c4:.github/workflows/release.yml > .github/workflows/release.yml
          git rm -f scripts/final_release_main_12_9_2.sh
          git diff --check
          git add .github/workflows/release.yml scripts/final_release_main_12_9_2.sh
          git commit -m "[skip ci] Restore Main and Play release workflow after Main-only build"
          git push origin HEAD:dev
          grep -q 'Verify and build Main + Play APKs' .github/workflows/release.yml
          grep -q 'bash scripts/final_release_12_9_2.sh' .github/workflows/release.yml
          grep -q 'Expected exactly two APKs' .github/workflows/release.yml
          printf 'Permanent Main + Play workflow restored without a new trigger.\n'

      - name: Publish successful Main-only release status
        if: ${{ success() }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'authorgram/final-release',
              description: 'Main APK passed UI, signature and integrity verification; normal workflow restored',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Publish failed Main-only release status
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'authorgram/final-release',
              description: 'AuthorGram Main-only verification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
