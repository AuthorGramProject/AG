name: AuthorGram 12.9.2 Clean Main + Play Release

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - .github/FINAL_RELEASE_12_9_2

permissions:
  actions: write
  contents: write

concurrency:
  group: authorgram-12-9-2-final-main-play-release
  cancel-in-progress: true

jobs:
  release:
    name: Clean queue, verify source, build Main + Play APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MAIN_PACKAGE: fork.risin42.nagramx
      PLAY_PACKAGE: toss.authorgram.apk
      VERSION_NAME: 12.9.2
      VERSION_CODE: '6991'
      PYTHONDONTWRITEBYTECODE: '1'
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      AUTHORGRAM_SIGNING_CERT_SHA256: ${{ secrets.AUTHORGRAM_SIGNING_CERT_SHA256 }}

    steps:
      - name: Stop every other active Actions run
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = Number(context.runId);
            const active = new Set(['queued', 'in_progress', 'waiting', 'pending', 'requested']);
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            async function listOtherActiveRuns() {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, per_page: 100 },
              );
              return runs.filter(run => Number(run.id) !== currentRunId && active.has(run.status));
            }

            let runs = await listOtherActiveRuns();
            core.info(`Found ${runs.length} other active run(s).`);
            for (const run of runs) {
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                core.info(`Cancel requested: ${run.id} ${run.name}`);
              } catch (error) {
                core.warning(`Cancel failed for ${run.id}: ${error.message}`);
              }
            }

            await sleep(15000);
            runs = await listOtherActiveRuns();
            for (const run of runs) {
              try {
                if (github.rest.actions.forceCancelWorkflowRun) {
                  await github.rest.actions.forceCancelWorkflowRun({ owner, repo, run_id: run.id });
                } else {
                  await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                }
                core.info(`Force-cancel requested: ${run.id} ${run.name}`);
              } catch (error) {
                core.warning(`Force-cancel failed for ${run.id}: ${error.message}`);
              }
            }

            for (let attempt = 1; attempt <= 30; attempt += 1) {
              runs = await listOtherActiveRuns();
              if (runs.length === 0) {
                core.info('All other queued or running workflows are stopped.');
                return;
              }
              core.info(`Waiting for ${runs.length} run(s) to stop: ${attempt}/30`);
              await sleep(5000);
            }

            runs = await listOtherActiveRuns();
            throw new Error(`Active runs remain: ${runs.map(run => `${run.id}:${run.status}:${run.name}`).join(', ')}`);

      - name: Checkout canonical dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Validate source and release controller
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${LOCAL_PROPERTIES}" ]] || {
            echo 'LOCAL_PROPERTIES secret is missing.' >&2
            exit 1
          }

          bash -n scripts/final_release_12_9_2.sh

          python3 - <<'PY'
          from pathlib import Path

          for relative in (
              'scripts/finalize_authorgram_source.py',
              'scripts/authorgram_guard.py',
              'scripts/authorgram_parity_guard.py',
              'scripts/patch_authorgram_build_key.py',
              'scripts/patch_authorgram_play_policy.py',
              'scripts/patch_authorgram_ui_12_9_2.py',
              'scripts/patch_authorgram_popup_bounds.py',
              'scripts/patch_authorgram_badge_surfaces.py',
          ):
              compile(Path(relative).read_text(encoding='utf-8'), relative, 'exec')

          required = {
              'TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ActionBar.java': (
                  'AUTHORGRAM_STANDARD_CHAT_HEADER',
                  'parentFragment instanceof org.telegram.ui.ChatActivity',
              ),
              'TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ActionBarPopupWindow.java': (
                  'AUTHORGRAM_RELIABLE_POPUP_SCROLL',
                  'scrollView.setScrollContainer(true);',
              ),
              'TMessagesProj/src/main/java/org/telegram/ui/Components/ChatScrimPopupContainerLayout.java': (
                  'AUTHORGRAM_FIXED_IOS_MESSAGE_PREVIEW',
                  'AUTHORGRAM_ADAPTIVE_IOS_PREVIEW_SCROLL',
                  'AUTHORGRAM_MENU_FOOTER_WIDTH_PARITY',
                  'availableForActions',
              ),
              'TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java': (
                  'AUTHORGRAM_FIXED_IOS_PREVIEW_OWNER',
                  'AUTHORGRAM_ADAPTIVE_IOS_PREVIEW_OWNER',
                  'AUTHORGRAM_FULL_SCREEN_IOS_MENU_BLUR',
                  'NekoConfig.iOSMessageMenu.Bool()',
                  'AuthorGramPlayPolicy.canUseIosUi()',
              ),
              'TMessagesProj/src/main/java/org/telegram/ui/Components/ChatActivityEnterView.java': (
                  'AUTHORGRAM_MAIN_ONLY_IOS_INPUT',
                  'AUTHORGRAM_IOS_INPUT_MENU_GUARD',
                  'AUTHORGRAM_IOS_SEND_BUTTON_INVARIANT',
                  'public View getSendButtonInternal() {',
              ),
              'TMessagesProj/src/main/java/org/telegram/ui/Components/IOSMessageMenuPreview.java': (
                  'AUTHORGRAM_UNIFIED_IOS_MESSAGE_BLOCK',
                  'AUTHORGRAM_ADAPTIVE_IOS_MESSAGE_PREVIEW',
                  'BackupImageView avatarView',
                  'TextView senderNameView',
                  'sourceCell.draw(canvas);',
                  'public boolean shouldScrollWithActions()',
              ),
              'TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramPlayPolicy.java': (
                  'values.put("iOSMessageInputField", false)',
                  'values.put("iOSMessageMenu", false)',
                  'public static boolean canUseIosUi()',
              ),
          }

          loaded = {}
          for path, markers in required.items():
              text = Path(path).read_text(encoding='utf-8')
              loaded[path] = text
              missing = [marker for marker in markers if marker not in text]
              if missing:
                  raise SystemExit(f'{path}: missing {missing}')

          chat = loaded['TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java']
          enter = loaded['TMessagesProj/src/main/java/org/telegram/ui/Components/ChatActivityEnterView.java']
          preview = loaded['TMessagesProj/src/main/java/org/telegram/ui/Components/IOSMessageMenuPreview.java']
          forbidden = ('new BluredView(', 'new BlurredView(', 'private final BluredView', 'private final BlurredView')
          leaked = [token for token in forbidden if token in preview]
          if leaked:
              raise SystemExit(f'Preview-local blur remains: {leaked}')
          if 'AUTHORGRAM_IOS_MESSAGE_ACTION_GAP' in chat:
              raise SystemExit('Short preview is incorrectly owned by the action ScrollView')
          if 'compactIndices.remove(index);' in chat:
              raise SystemExit('Unsafe compact-menu index removal remains')
          if enter.count('public View getSendButtonInternal() {') != 1:
              raise SystemExit('Native send-button method count is not exactly one')
          PY

          git diff --check
          test -z "$(git status --porcelain)"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          check-latest: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36'

      - name: Prepare protected runtime release script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('scripts/final_release_12_9_2.sh').read_text(encoding='utf-8')
          declaration = '  local keystore_backup="${WORK_ROOT}/main-release.keystore"\n'
          replacement = declaration + '  local destination_ref\n  destination_ref="$(git -C "${destination}" rev-parse HEAD)"\n'
          if declaration not in source:
              raise SystemExit('Unable to find sync_from_dev declaration anchor')
          source = source.replace(declaration, replacement, 1)

          read_tree = '  git -C "${destination}" read-tree --reset -u "${DEV_COMMIT}"\n'
          preserve = read_tree + '''

          # Keep branch-local GitHub metadata out of application source synchronization.
          # This prevents the release token from rewriting workflow files on main/play.
          if git -C "${destination}" cat-file -e "${destination_ref}:.github" 2>/dev/null; then
            git -C "${destination}" checkout "${destination_ref}" -- .github
          else
            rm -rf "${destination}/.github"
          fi
          '''
          if read_tree not in source:
              raise SystemExit('Unable to find read-tree synchronization anchor')
          source = source.replace(read_tree, preserve, 1)

          output = Path('/tmp/final_release_12_9_2_protected.sh')
          output.write_text(source, encoding='utf-8', newline='')
          output.chmod(0o700)
          PY
          bash -n /tmp/final_release_12_9_2_protected.sh

      - name: Build and verify Main + Play release APKs
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/final_release_12_9_2_protected.sh

      - name: Verify exact final artifact set
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/authorgram-final/artifacts"
          mapfile -t main_apks < <(find "${artifact_dir}" -maxdepth 1 -type f -name 'AuthorGram-Main-*.apk' -print | sort)
          mapfile -t play_apks < <(find "${artifact_dir}" -maxdepth 1 -type f -name 'AuthorGram-Play-*.apk' -print | sort)
          mapfile -t all_apks < <(find "${artifact_dir}" -maxdepth 1 -type f -name '*.apk' -print | sort)
          mapfile -t aabs < <(find "${artifact_dir}" -maxdepth 1 -type f -name '*.aab' -print | sort)

          [[ "${#main_apks[@]}" -eq 1 ]]
          [[ "${#play_apks[@]}" -eq 1 ]]
          [[ "${#all_apks[@]}" -eq 2 ]]
          [[ "${#aabs[@]}" -eq 0 ]]

          main_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "${artifact_dir}/Main-CERTIFICATE.txt" | head -n1)"
          play_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "${artifact_dir}/Play-CERTIFICATE.txt" | head -n1)"
          [[ -n "${main_cert}" && "${main_cert}" == "${play_cert}" ]]

          test -s "${artifact_dir}/Main-BUILD.txt"
          test -s "${artifact_dir}/Play-BUILD.txt"
          test -s "${artifact_dir}/Main-CERTIFICATE.txt"
          test -s "${artifact_dir}/Play-CERTIFICATE.txt"
          test -s "${artifact_dir}/RELEASE-SUMMARY.txt"
          test -s "${artifact_dir}/SHA256SUMS.txt"
          [[ "$(grep -c 'AuthorGram-.*\.apk' "${artifact_dir}/SHA256SUMS.txt")" -eq 2 ]]
          cat "${artifact_dir}/RELEASE-SUMMARY.txt"
          cat "${artifact_dir}/SHA256SUMS.txt"

      - name: Upload final Main and Play APK package
        uses: actions/upload-artifact@v4
        with:
          name: AuthorGram-12.9.2-Final-Main-and-Play-Release
          path: ${{ runner.temp }}/authorgram-final/artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
