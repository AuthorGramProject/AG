# ---------------------------------------------------------------------------
# Nagram Extera - Release pipeline
# ---------------------------------------------------------------------------
# Builds signed release APKs for any combination of ABIs and (optionally)
# publishes the arm64-v8a build to the Telegram release channel.
#
# ── How to trigger ──────────────────────────────────────────────────────────
#   push to `main`         → arm64-v8a built automatically + publish
#   workflow_dispatch      → set each ABI flag to "y" to include it
#
# ── ABI flags (workflow_dispatch only) ──────────────────────────────────────
#   arm64_v8a   "y" → build arm64-v8a   (default on push)
#   armeabi_v7a "y" → build armeabi-v7a
#   x86_64      "y" → build x86_64
#   universal   "y" → build universal (all ABIs in one APK)
#
# ── Skip tokens (commit message) ────────────────────────────────────────────
#   [skip upload]  → build only, no Telegram publish
#   [skip ci]      → workflow does not run at all
# ---------------------------------------------------------------------------

name: Release Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'documentations/**'
      - 'changelogs/**'
      - '.github/**'
      - '!.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      arm64_v8a:
        description: 'Build arm64-v8a — set to "y" to build'
        required: false
        default: 'y'
        type: string
      armeabi_v7a:
        description: 'Build armeabi-v7a — set to "y" to build'
        required: false
        default: ''
        type: string
      x86_64:
        description: 'Build x86_64 — set to "y" to build'
        required: false
        default: ''
        type: string
      universal:
        description: 'Build universal (all ABIs) — set to "y" to build'
        required: false
        default: ''
        type: string
      upload:
        description: 'Skip upload — set to "y" to skip Telegram publish'
        required: false
        default: ''
        type: string

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  PYTHON_VERSION: '3.13'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_PLATFORM: 'android-36'
  ANDROID_NDK: '27.2.12479018'
  ANDROID_CMAKE: '3.31.6'

jobs:
  # ---------------------------------------------------------------------------
  # 0. Determine which ABIs to build + compute shared build metadata
  # ---------------------------------------------------------------------------
  setup:
    name: Configure build matrix
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    outputs:
      matrix:          ${{ steps.matrix.outputs.matrix }}
      version_name:    ${{ steps.meta.outputs.version_name }}
      version_code:    ${{ steps.meta.outputs.version_code }}
      short_sha:       ${{ steps.meta.outputs.short_sha }}
      build_timestamp: ${{ steps.meta.outputs.build_timestamp }}

    steps:
      - name: Checkout (blobless full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false
          show-progress: false

      - id: matrix
        name: Resolve ABI list
        run: |
          set -euo pipefail
          abis=()

          # On push → always arm64-v8a; on dispatch → respect per-ABI flags
          if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ github.event.inputs.arm64_v8a }}" == "y" ]]; then
            abis+=("arm64-v8a")
          fi
          if [[ "${{ github.event.inputs.armeabi_v7a }}" == "y" ]]; then
            abis+=("armeabi-v7a")
          fi
          if [[ "${{ github.event.inputs.x86_64 }}" == "y" ]]; then
            abis+=("x86_64")
          fi
          if [[ "${{ github.event.inputs.universal }}" == "y" ]]; then
            abis+=("universal")
          fi

          # Fallback: ensure at least arm64-v8a is always built
          [[ ${#abis[@]} -gt 0 ]] || abis=("arm64-v8a")

          json=$(printf '"%s"\n' "${abis[@]}" | jq -s -c '{abi: .}')
          echo "matrix=$json" | tee -a "$GITHUB_OUTPUT"
          echo "Will build: ${abis[*]}"

      - id: meta
        name: Compute build metadata
        run: |
          set -euo pipefail

          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          VERSION_CODE=$(git rev-list --count HEAD)
          EXTERA_BASE=$(grep -E '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          TG_VERSION=$(grep -E '^TELEGRAM_VERSION_NAME=' gradle.properties | cut -d= -f2)
          VERSION_NAME="${EXTERA_BASE}-${SHORT_SHA}"
          BUILD_TIMESTAMP=$(date +%s)

          echo "Nagram Extera : ${VERSION_NAME} (code ${VERSION_CODE})"
          echo "Telegram base : ${TG_VERSION}"

          {
            echo "short_sha=${SHORT_SHA}"
            echo "version_code=${VERSION_CODE}"
            echo "version_name=${VERSION_NAME}"
            echo "build_timestamp=${BUILD_TIMESTAMP}"
          } | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 1. Build — one job per requested ABI (matrix)
  # ---------------------------------------------------------------------------
  build:
    name: Gradle Build (${{ matrix.abi }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      # "universal" → blank NATIVE_TARGET → build.gradle enables universalApk
      NATIVE_TARGET: ${{ matrix.abi == 'universal' && '' || matrix.abi }}
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: "include_file_mtime,include_file_ctime,time_macros,locale,system_headers"
      CCACHE_MAXSIZE: "5G"
      GRADLE_OPTS: "-Dorg.gradle.welcome=never -Dorg.gradle.configureondemand=true -Dkotlin.incremental=true -Dkotlin.compiler.execution.strategy=in-process"

    steps:
      # ---- Source -----------------------------------------------------------
      - name: Checkout (blobless full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: recursive
          show-progress: false

      - name: Normalise wrapper permissions
        run: chmod +x gradlew

      # ---- Toolchain --------------------------------------------------------
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          check-latest: true

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-${{ matrix.abi }}
          max-size: 5G
          append-timestamp: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          add-job-summary: 'on-failure'
          add-job-summary-as-pr-comment: never
          gradle-home-cache-cleanup: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: >-
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;${{ env.ANDROID_NDK }}
            platforms;${{ env.ANDROID_PLATFORM }}
            cmake;${{ env.ANDROID_CMAKE }}

      # ---- Configuration ----------------------------------------------------
      - name: Wire Android SDK + tune Gradle for the runner
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties

          MEMORY_GB=$(awk '/MemTotal/ {printf "%d", $2/1024/1024}' /proc/meminfo)
          CPU_COUNT=$(nproc)
          echo "Runner: ${MEMORY_GB} GB RAM, ${CPU_COUNT} vCPU"

          sed -i \
            -e '/^org\.gradle\.jvmargs=/d' \
            -e '/^org\.gradle\.parallel=/d' \
            -e '/^org\.gradle\.caching=/d' \
            -e '/^org\.gradle\.configuration-cache=/d' \
            -e '/^org\.gradle\.daemon=/d' \
            -e '/^org\.gradle\.workers\.max=/d' \
            -e '/^kotlin\.incremental=/d' \
            gradle.properties

          XMX=$([ "$MEMORY_GB" -ge 12 ] && echo 8 || echo 4)
          {
            echo "org.gradle.jvmargs=-Xmx${XMX}G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
            echo "org.gradle.daemon=true"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
            echo "org.gradle.configuration-cache=true"
            echo "org.gradle.workers.max=${CPU_COUNT}"
            echo "kotlin.incremental=true"
          } >> gradle.properties

          echo "--- gradle.properties ---"
          cat gradle.properties

      - name: Restore signing keystore (optional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/release.keystore

      # ---- Build ------------------------------------------------------------
      - id: assemble
        name: Assemble release APK (${{ matrix.abi }})
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          COMMIT_ID:        ${{ github.sha }}
          BUILD_TIMESTAMP:  ${{ needs.setup.outputs.build_timestamp }}
          VERSION_CODE:     ${{ needs.setup.outputs.version_code }}
        run: |
          set -euo pipefail
          ./gradlew \
            --build-cache --parallel --configuration-cache \
            -x lint -x test \
            :TMessagesProj:assembleRelease

          # Locate the APK for this ABI
          if [[ -z "${NATIVE_TARGET}" ]]; then
            # universal build: pick the universal APK
            APK_PATH=$(find TMessagesProj/build/outputs/apk -type f -name "*universal*.apk" | head -n1)
          else
            APK_PATH=$(find TMessagesProj/build/outputs/apk -type f -name "*${NATIVE_TARGET}*.apk" | head -n1)
          fi

          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found for ABI '${{ matrix.abi }}'"
            find TMessagesProj/build/outputs/apk -type f -ls || true
            exit 1
          fi

          APK_DIR=$(dirname "$APK_PATH")
          echo "APK=$APK_DIR"       >> "$GITHUB_ENV"
          echo "APK_FILE=$APK_PATH" >> "$GITHUB_ENV"
          echo "apk=$APK_DIR"       >> "$GITHUB_OUTPUT"
          echo "apk_file=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Built: $APK_PATH ($(stat -c%s "$APK_PATH") bytes)"

      - name: Generate APK checksums
        run: |
          set -euo pipefail
          ( cd "$APK" && sha256sum *.apk > SHA256SUMS && sha1sum *.apk > SHA1SUMS )
          echo "--- SHA256 ---"
          cat "$APK/SHA256SUMS"

      # ---- Artifacts --------------------------------------------------------
      - name: Upload release artifact (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: NagramExtera-${{ needs.setup.outputs.version_name }}-${{ matrix.abi }}
          path: ${{ steps.assemble.outputs.apk }}
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      # ---- Diagnostics on failure ------------------------------------------
      - name: Collect build logs on failure
        if: failure()
        run: |
          set +e
          mkdir -p build-logs
          cp -v gradle.properties local.properties build-logs/ 2>/dev/null || true
          find . -type d -name "reports" -path "*/build/*" -exec cp -r {} build-logs/ \; 2>/dev/null
          find . -type d -name "logs"    -path "*/build/*" -exec cp -r {} build-logs/ \; 2>/dev/null
          find . -type f -name "*.log"   -path "*/build/*" -exec cp    {} build-logs/ \; 2>/dev/null
          find ~/.gradle/daemon -type f -name "*.out.log" -exec cp {} build-logs/ \; 2>/dev/null
          ARCHIVE="build-logs-${{ github.run_id }}-${{ matrix.abi }}.zip"
          ( cd build-logs && zip -qr "../$ARCHIVE" . ) || true
          ls -lh "$ARCHIVE" || true

      - name: Upload build log archive
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}-${{ matrix.abi }}
          path: build-logs-${{ github.run_id }}-${{ matrix.abi }}.zip
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2. Publish to Telegram (arm64-v8a build, release channel)
  # ---------------------------------------------------------------------------
  upload:
    name: Publish to Telegram
    needs: [setup, build]
    if: |
      success()
      && github.event.inputs.upload != 'y'
      && !contains(github.event.head_commit.message, '[skip upload]')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (sources for upload.py)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          show-progress: false

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false
          pattern: 'NagramExtera-*'

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Resolve APK path (prefer arm64-v8a)
        id: locate
        run: |
          set -euo pipefail
          # Prefer arm64-v8a; fall back to first available APK
          APK=$(find artifacts -type f -name "*arm64-v8a*.apk" | head -n1)
          if [ -z "$APK" ]; then
            APK=$(find artifacts -type f -name "*.apk" | head -n1)
          fi
          if [ -z "$APK" ]; then
            echo "::error::No APK found in downloaded artifacts."
            find artifacts -type f -ls
            exit 1
          fi
          echo "apk=$APK" | tee -a "$GITHUB_OUTPUT"
          echo "Publishing: $APK"

      - name: Send to Telegram
        env:
          APP_ID:          ${{ secrets.APP_ID }}
          APP_HASH:        ${{ secrets.APP_HASH }}
          COMMIT_ID:       ${{ github.sha }}
          COMMIT_URL:      ${{ github.event.head_commit.url }}
          COMMIT_MESSAGE:  ${{ github.event.head_commit.message }}
          BUILD_TIMESTAMP: ${{ needs.setup.outputs.build_timestamp }}
          VERSION_NAME:    ${{ needs.setup.outputs.version_name }}
          VERSION_CODE:    ${{ needs.setup.outputs.version_code }}
        run: |
          set -euo pipefail
          export mini64="${{ steps.locate.outputs.apk }}"
          echo "Publishing $mini64"
          if [ -f "Tools/scripts/requirements.txt" ] && [ -f "Tools/scripts/upload.py" ]; then
            python -m pip install --upgrade pip
            python -m pip install -r Tools/scripts/requirements.txt
            python Tools/scripts/upload.py \
              "${{ secrets.HELPER_BOT_TOKEN }}" \
              "${{ secrets.HELPER_BOT_TARGET }}" \
              release \
              "${{ secrets.HELPER_BOT_CANARY_TARGET }}"
          else
            echo "Telegram upload script not found; skipping upload."
          fi

  # ---------------------------------------------------------------------------
  # 3. Failure-mode log shipping
  # ---------------------------------------------------------------------------
  upload-logs:
    name: Ship build logs to Telegram
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download log archives
        uses: actions/download-artifact@v4
        with:
          path: logs
          pattern: 'build-logs-*'
          merge-multiple: true

      - name: Send log archives to Telegram
        env:
          TG_BOT_TOKEN:   ${{ secrets.HELPER_BOT_TOKEN }}
          TG_CHAT_ID:     ${{ secrets.HELPER_BOT_TARGET }}
          COMMIT_ID:      ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "Telegram secrets not configured; skipping log upload."
            exit 0
          fi
          find logs -type f -name "*.zip" | while read -r ARCHIVE; do
            {
              printf 'Nagram Extera build failed\n'
              printf 'Commit:  %s\n'  "${COMMIT_ID}"
              printf 'Run:     %s\n'  "${RUN_URL}"
              printf 'Message: %s\n'  "${COMMIT_MESSAGE}"
            } > caption.txt
            curl -sSf -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TG_CHAT_ID}" \
              -F caption="$(cat caption.txt)" \
              -F document=@"${ARCHIVE}" || true
          done
