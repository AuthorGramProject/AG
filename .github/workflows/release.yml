name: AuthorGram 12.9.2 Economical ARM64 Main Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev]
    paths:
      - .github/FINAL_RELEASE_PR_12_9_2
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: authorgram-12-9-2-economical-main-arm64
  cancel-in-progress: true

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'release/authorgram-12-9-2-clean-final'
    name: Audit first, then build one ARM64 Main APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MAIN_PACKAGE: fork.risin42.nagramx
      PLAY_PACKAGE: toss.authorgram.apk
      VERSION_NAME: 12.9.2
      VERSION_CODE: '6991'
      NATIVE_TARGET: arm64-v8a
      PYTHONDONTWRITEBYTECODE: '1'
      GRADLE_OPTS: -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2 -Dfile.encoding=UTF-8
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      AUTHORGRAM_SIGNING_CERT_SHA256: ${{ secrets.AUTHORGRAM_SIGNING_CERT_SHA256 }}

    steps:
      - name: Checkout canonical dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Full zero-Gradle release audit
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${LOCAL_PROPERTIES}" ]] || { echo 'LOCAL_PROPERTIES secret is missing.' >&2; exit 1; }
          [[ "${NATIVE_TARGET}" == "arm64-v8a" ]] || { echo 'NATIVE_TARGET must be arm64-v8a.' >&2; exit 1; }
          bash -n scripts/final_main_release_12_9_2.sh

          python3 - <<'PY'
          from pathlib import Path

          scripts = (
              'scripts/repair_authorgram_patch_chain.py',
              'scripts/finalize_authorgram_source.py',
              'scripts/authorgram_guard.py',
              'scripts/authorgram_parity_guard.py',
              'scripts/patch_authorgram_build_key.py',
              'scripts/patch_authorgram_play_policy.py',
              'scripts/patch_authorgram_popup_bounds.py',
              'scripts/patch_authorgram_chat_scope_safety.py',
              'scripts/patch_authorgram_adaptive_ios_preview.py',
              'scripts/patch_authorgram_final_chat_ui.py',
          )
          for path in scripts:
              compile(Path(path).read_text(encoding='utf-8'), path, 'exec')

          build_gradle = Path('TMessagesProj/build.gradle').read_text(encoding='utf-8')
          release = Path('scripts/final_main_release_12_9_2.sh').read_text(encoding='utf-8')
          for marker in (
              "def nativeTarget = System.getenv('NATIVE_TARGET') ?: ''",
              'include nativeTarget',
              'universalApk = nativeTarget.isBlank()',
          ):
              if marker not in build_gradle:
                  raise SystemExit(f'ARM64 split support missing: {marker}')
          if release.count('TMessagesProj:assembleRelease') != 1:
              raise SystemExit('Main release controller must contain exactly one assembleRelease')
          if 'bundleRelease' in release or '.aab' in release:
              raise SystemExit('AAB generation is forbidden in Main release controller')
          if 'playBuilt=false' not in release:
              raise SystemExit('Main-only release metadata invariant is missing')
          if 'Build the Main release APK only' not in release:
              raise SystemExit('Main-only build stage marker is missing')
          print('Static Main-only ARM64 controller audit passed')
          PY

          python3 scripts/patch_authorgram_chat_scope_safety.py --mode pre-apply
          python3 scripts/repair_authorgram_patch_chain.py
          python3 scripts/patch_authorgram_popup_bounds.py
          python3 scripts/patch_authorgram_chat_scope_safety.py --mode validate
          python3 scripts/finalize_authorgram_source.py --role dev --package "${MAIN_PACKAGE}" --check

          python3 - <<'PY'
          from pathlib import Path

          chat = Path('TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java').read_text(encoding='utf-8')
          enter = Path('TMessagesProj/src/main/java/org/telegram/ui/Components/ChatActivityEnterView.java').read_text(encoding='utf-8')
          preview = Path('TMessagesProj/src/main/java/org/telegram/ui/Components/IOSMessageMenuPreview.java').read_text(encoding='utf-8')
          scrim = Path('TMessagesProj/src/main/java/org/telegram/ui/Components/ChatScrimPopupContainerLayout.java').read_text(encoding='utf-8')
          actionbar = Path('TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ActionBar.java').read_text(encoding='utf-8')
          play_policy = Path('TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramPlayPolicy.java').read_text(encoding='utf-8')

          required = (
              (actionbar, 'AUTHORGRAM_STANDARD_CHAT_HEADER'),
              (chat, 'AUTHORGRAM_ADAPTIVE_IOS_PREVIEW_OWNER'),
              (chat, 'AUTHORGRAM_SCOPE_SAFE_IOS_PREVIEW_PARENT'),
              (chat, 'AUTHORGRAM_FULL_SCREEN_IOS_MENU_BLUR'),
              (chat, '.setFixedMessagePreview(iosPreview);'),
              (scrim, 'AUTHORGRAM_ADAPTIVE_IOS_PREVIEW_SCROLL'),
              (scrim, 'AUTHORGRAM_MENU_FOOTER_WIDTH_PARITY'),
              (enter, 'AUTHORGRAM_MAIN_ONLY_IOS_INPUT'),
              (enter, 'AUTHORGRAM_IOS_SEND_BUTTON_INVARIANT'),
              (enter, 'public View getSendButtonInternal() {'),
              (preview, 'AUTHORGRAM_ADAPTIVE_IOS_MESSAGE_PREVIEW'),
              (preview, 'BackupImageView avatarView'),
              (preview, 'TextView senderNameView'),
              (preview, 'public boolean shouldScrollWithActions()'),
              (play_policy, 'values.put("iOSMessageInputField", false)'),
              (play_policy, 'values.put("iOSMessageMenu", false)'),
          )
          for text, marker in required:
              if marker not in text:
                  raise SystemExit(f'Final UI audit missing: {marker}')

          for forbidden in (
              'scrimPopupContainerLayout.setFixedMessagePreview(',
              'scrimPopupContainerLayout.getBottomOffset()',
              'chatActivityEnterView.setFixedMessagePreview(',
              'AUTHORGRAM_IOS_MESSAGE_ACTION_GAP',
              'compactIndices.remove(index);',
          ):
              if forbidden in chat:
                  raise SystemExit(f'Final UI audit found forbidden stale form: {forbidden}')
          if enter.count('public View getSendButtonInternal() {') != 1:
              raise SystemExit('Native send-button method count is not exactly one')
          if any(token in preview for token in ('new BluredView(', 'new BlurredView(', 'private final BluredView', 'private final BlurredView')):
              raise SystemExit('Preview-local blur remains')

          print('Full canonical UI/source audit passed before any Gradle setup')
          PY

          git diff --check
          git reset --hard HEAD
          git clean -fd
          test -z "$(git status --porcelain)"

      - name: Clean superseded Actions records
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = Number(context.runId);
            const active = new Set(['queued', 'in_progress', 'waiting', 'pending', 'requested']);

            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              { owner, repo, per_page: 100 },
            );
            for (const workflow of workflows) {
              if (workflow.path === '.github/workflows/release.yml' || workflow.state !== 'active') continue;
              try {
                await github.rest.actions.disableWorkflow({ owner, repo, workflow_id: workflow.id });
              } catch (error) {
                core.warning(`Disable failed for ${workflow.id}: ${error.message}`);
              }
            }

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 },
            );
            for (const run of runs) {
              if (Number(run.id) === currentRunId) continue;
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                continue;
              } catch (error) {
                if (!active.has(run.status)) {
                  core.warning(`Delete failed for completed run ${run.id}: ${error.message}`);
                  continue;
                }
              }
              try {
                await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {
                  owner, repo, run_id: run.id,
                });
              } catch (error) {
                core.warning(`Ignoring active/zero-job stale record ${run.id}: ${error.message}`);
              }
            }

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          check-latest: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36'

      - name: Prepare protected Main-only release script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('scripts/final_main_release_12_9_2.sh').read_text(encoding='utf-8')

          audit_anchor = 'log "Finalize and validate dev source without mutating workflow definitions"\n'
          if audit_anchor not in source:
              raise SystemExit('Missing Main finalization anchor')
          source = source.replace(
              audit_anchor,
              audit_anchor + 'python3 scripts/repair_authorgram_patch_chain.py\n',
              1,
          )

          declaration = '  local keystore_backup="${WORK_ROOT}/main-release.keystore"\n'
          replacement = declaration + '  local destination_ref\n  destination_ref="$(git -C "${destination}" rev-parse HEAD)"\n'
          if declaration not in source:
              raise SystemExit('Missing sync_from_dev declaration anchor')
          source = source.replace(declaration, replacement, 1)

          sync_anchor = '  git -C "${destination}" read-tree --reset -u "${DEV_COMMIT}"\n'
          preserve = (
              sync_anchor
              + '\n  # Preserve branch-local GitHub metadata while synchronizing app source.\n'
              + '  if git -C "${destination}" cat-file -e "${destination_ref}:.github" 2>/dev/null; then\n'
              + '    git -C "${destination}" checkout "${destination_ref}" -- .github\n'
              + '  else\n'
              + '    rm -rf "${destination}/.github"\n'
              + '  fi\n'
          )
          if sync_anchor not in source:
              raise SystemExit('Missing read-tree synchronization anchor')
          source = source.replace(sync_anchor, preserve, 1)

          output = Path('/tmp/final_main_release_12_9_2_protected.sh')
          output.write_text(source, encoding='utf-8', newline='')
          output.chmod(0o700)
          PY
          bash -n /tmp/final_main_release_12_9_2_protected.sh

      - name: Build and verify one ARM64 Main release APK
        shell: bash
        run: |
          set -euo pipefail
          [[ "${NATIVE_TARGET}" == "arm64-v8a" ]]
          bash /tmp/final_main_release_12_9_2_protected.sh

      - name: Verify exact Main ARM64 artifact set
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/authorgram-main-final/artifacts"
          mapfile -t main_apks < <(find "${artifact_dir}" -maxdepth 1 -type f -name 'AuthorGram-Main-*-arm64-v8a.apk' -print)
          mapfile -t play_apks < <(find "${artifact_dir}" -maxdepth 1 -type f -name 'AuthorGram-Play-*.apk' -print)
          mapfile -t all_apks < <(find "${artifact_dir}" -maxdepth 1 -type f -name '*.apk' -print)
          mapfile -t aabs < <(find "${artifact_dir}" -maxdepth 1 -type f -name '*.aab' -print)

          [[ "${#main_apks[@]}" -eq 1 ]] || { echo 'Expected exactly one ARM64 Main APK'; exit 1; }
          [[ "${#play_apks[@]}" -eq 0 ]] || { echo 'Play APK must not be built this month'; exit 1; }
          [[ "${#all_apks[@]}" -eq 1 ]] || { echo 'Expected exactly one APK total'; exit 1; }
          [[ "${#aabs[@]}" -eq 0 ]] || { echo 'AAB files are forbidden'; exit 1; }

          aapt="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          main_badging="$("${aapt}" dump badging "${main_apks[0]}")"
          grep -q "package: name='${MAIN_PACKAGE}'" <<<"${main_badging}"
          grep -q "versionCode='${VERSION_CODE}'" <<<"${main_badging}"
          grep -q "versionName='${VERSION_NAME}'" <<<"${main_badging}"

          unzip -Z1 "${main_apks[0]}" > "${RUNNER_TEMP}/main-apk-files.txt"
          grep -q '^lib/arm64-v8a/' "${RUNNER_TEMP}/main-apk-files.txt"
          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' "${RUNNER_TEMP}/main-apk-files.txt"; then
            echo 'Main APK contains a non-arm64 ABI'
            exit 1
          fi

          echo 'Exactly one release-signed ARM64-v8a Main APK verified; Play source was synchronized but not built.'

      - name: Upload final ARM64 Main package
        uses: actions/upload-artifact@v4
        with:
          name: AuthorGram-12.9.2-Main-arm64-v8a
          path: ${{ runner.temp }}/authorgram-main-final/artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
