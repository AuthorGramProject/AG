name: AuthorGram+ 12.9.2 Dev Release

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - .github/FINAL_RELEASE_12_9_2

permissions:
  contents: write
  actions: read
  statuses: write

concurrency:
  group: authorgram-plus-dev-release
  cancel-in-progress: true

jobs:
  release:
    name: Build verified AuthorGram+ Dev APK
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'Run AuthorGram+ dev release'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      DEV_PACKAGE: fork.risin42.nagramx
      VERSION_NAME: 12.9.2
      VERSION_CODE: '6991'
      NATIVE_TARGET: arm64-v8a
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      AUTHORGRAM_SIGNING_CERT_SHA256: ${{ secrets.AUTHORGRAM_SIGNING_CERT_SHA256 }}
      HISTORICAL_SIGNING_COMMIT: eaabf4f2c52addfa1fc91d3cb91db6e3ac6e9369

    steps:
      - name: Publish pending release status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'authorgram/dev-release',
              description: 'AuthorGram+ Dev release APK is building',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
          submodules: recursive
          persist-credentials: true

      - name: Restore and persist iOS UI source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/restore_authorgram_ios_ui.py
          python3 scripts/restore_authorgram_ios_ui.py
          python3 scripts/restore_authorgram_ios_ui.py --check
          git diff --check

          if ! git diff --quiet; then
            git config user.name "AuthorGram Source Bot"
            git config user.email "actions@users.noreply.github.com"
            git add \
              TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java \
              TMessagesProj/src/main/java/tw/nekomimi/nekogram/NekoConfig.java \
              TMessagesProj/src/main/java/toss/authorgram/settings/AGChatSettingsActivity.java \
              TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramDefaults.java \
              TMessagesProj/src/main/res/values/strings_neko.xml
            git commit -m "[skip ci] Restore stable iOS input and iOS message menu"
            git push origin HEAD:dev
          fi

      - name: Apply and persist final iOS message menu V6
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/finalize_ios_message_menu_v6.py
          python3 scripts/finalize_ios_message_menu_v6.py
          python3 scripts/finalize_ios_message_menu_v6.py --check
          git diff --check

          if ! git diff --quiet -- TMessagesProj/src/main/java/org/telegram/ui/Components/IOSMessageMenuPreview.java; then
            git config user.name "AuthorGram Source Bot"
            git config user.email "actions@users.noreply.github.com"
            git add TMessagesProj/src/main/java/org/telegram/ui/Components/IOSMessageMenuPreview.java
            git commit -m "[skip ci] Finalize iOS message menu V6"
            git push origin HEAD:dev
          fi

      - name: Validate dev identity and protected feature baseline
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(sed -n 's/^APP_PACKAGE=//p' gradle.properties)" == "${DEV_PACKAGE}" ]]
          [[ "$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)" == "${VERSION_NAME}" ]]
          [[ "$(sed -n 's/^APP_VERSION_CODE=//p' gradle.properties)" == "${VERSION_CODE}" ]]
          grep -Fq '<string name="AppName">AuthorGram+</string>' TMessagesProj/src/release/res/values/authorgram_brand.xml
          grep -Fq 'NekoConfig.localPremium' TMessagesProj/src/main/java/toss/authorgram/settings/AGSpySettingsActivity.java
          grep -Fq 'NekoConfig.hideSponsoredMessage' TMessagesProj/src/main/java/toss/authorgram/settings/AGSpySettingsActivity.java
          grep -Fq 'NekoConfig.hideProxySponsorChannel' TMessagesProj/src/main/java/toss/authorgram/settings/AGSpySettingsActivity.java
          grep -Fq 'getEnableSaveDeletedMessages' TMessagesProj/src/main/java/toss/authorgram/settings/AGPrivacySettingsActivity.java
          grep -Fq 'getEnableSaveEditsHistory' TMessagesProj/src/main/java/toss/authorgram/settings/AGPrivacySettingsActivity.java
          grep -Fq 'public static final String PLAY_PACKAGE = "toss.authorgram.apk";' TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramPlayPolicy.java
          grep -Fq 'defaultConfig.applicationId = APP_PACKAGE' TMessagesProj/build.gradle
          grep -Fq "def telegramAdBlockingEnabled = APP_PACKAGE != 'toss.authorgram.apk'" TMessagesProj/build.gradle
          grep -Fq 'private final int DO_UPDATE_CAMERAX_SCALE = 5;' TMessagesProj/src/main/java/org/telegram/ui/Components/InstantCameraView.java
          grep -Fq 'cameraThread.updateCameraXScale();' TMessagesProj/src/main/java/org/telegram/ui/Components/InstantCameraView.java
          grep -Fq 'updateCameraXTextureScale();' TMessagesProj/src/main/java/org/telegram/ui/Components/InstantCameraView.java
          python3 scripts/restore_authorgram_ios_ui.py --check
          python3 scripts/finalize_ios_message_menu_v6.py --check
          git diff --check

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36'

      - name: Restore existing AuthorGram release signing key in runner only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e TMessagesProj/release.keystore
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/contents/TMessagesProj/release.keystore?ref=${HISTORICAL_SIGNING_COMMIT}" \
            --jq '.content' \
            | tr -d '\n' \
            | base64 --decode \
            > TMessagesProj/release.keystore
          test -s TMessagesProj/release.keystore
          chmod 600 TMessagesProj/release.keystore

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${LOCAL_PROPERTIES}" ]] || { echo 'LOCAL_PROPERTIES secret is missing' >&2; exit 1; }
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
          ./gradlew --no-daemon --stacktrace clean TMessagesProj:assembleRelease

      - name: Verify and package AuthorGram+ Dev APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/authorgram-plus-dev"
          python3 - <<'PY' > "${RUNNER_TEMP}/apk_path.txt"
          import json
          from pathlib import Path

          root = Path('TMessagesProj/build/outputs/apk')
          matches = []
          for metadata in root.rglob('output-metadata.json'):
              data = json.loads(metadata.read_text(encoding='utf-8'))
              for element in data.get('elements', []):
                  output = element.get('outputFile', '')
                  filters = element.get('filters') or []
                  abis = [item.get('value') for item in filters if item.get('filterType') == 'ABI']
                  candidate = (metadata.parent / output).resolve()
                  if candidate.is_file() and ('arm64-v8a' in abis or 'arm64-v8a' in output) and 'debug' not in candidate.name.lower():
                      matches.append(candidate)
          unique = sorted(set(matches))
          if len(unique) != 1:
              raise SystemExit(f'Expected exactly one arm64 release APK, found {len(unique)}: {unique}')
          print(unique[0])
          PY

          APK="$(cat "${RUNNER_TEMP}/apk_path.txt")"
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          ZIPALIGN="${ANDROID_HOME}/build-tools/36.0.0/zipalign"
          BADGING="$(${AAPT} dump badging "${APK}")"

          grep -Fq "package: name='${DEV_PACKAGE}'" <<<"${BADGING}"
          grep -Fq "versionCode='${VERSION_CODE}'" <<<"${BADGING}"
          grep -Fq "versionName='${VERSION_NAME}'" <<<"${BADGING}"
          grep -Fq "application-label:'AuthorGram+'" <<<"${BADGING}"
          ! grep -q '^application-debuggable' <<<"${BADGING}"

          PERMISSIONS="$(${AAPT} dump permissions "${APK}")"
          grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' <<<"${PERMISSIONS}"

          "${ZIPALIGN}" -c -P 16 4 "${APK}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK}" | tee "${RUNNER_TEMP}/authorgram-plus-dev/CERTIFICATE.txt"

          if unzip -Z1 "${APK}" | grep -Eqi '(^|/)(release\.keystore|[^/]*\.jks|[^/]*\.p12|[^/]*\.pfx)$'; then
            echo 'Signing material was packaged into APK' >&2
            exit 1
          fi

          if find TMessagesProj/build -type f -name '*.aab' -print -quit | grep -q .; then
            echo 'Unexpected AAB artifact found' >&2
            exit 1
          fi

          DEST="${RUNNER_TEMP}/authorgram-plus-dev/AuthorGram+-Dev-v${VERSION_NAME}-release-arm64-v8a.apk"
          cp "${APK}" "${DEST}"
          (
            cd "${RUNNER_TEMP}/authorgram-plus-dev"
            sha256sum "AuthorGram+-Dev-v${VERSION_NAME}-release-arm64-v8a.apk" > SHA256SUMS.txt
          )
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          cat > "${RUNNER_TEMP}/authorgram-plus-dev/BUILD.txt" <<EOF
          branch=dev
          sourceCommit=${SOURCE_COMMIT}
          triggerCommit=${GITHUB_SHA}
          package=${DEV_PACKAGE}
          appName=AuthorGram+
          versionName=${VERSION_NAME}
          versionCode=${VERSION_CODE}
          abi=arm64-v8a
          buildType=release
          signingKeySourceCommit=${HISTORICAL_SIGNING_COMMIT}
          EOF
          rm -f TMessagesProj/release.keystore local.properties

      - name: Upload AuthorGram+ Dev release APK
        uses: actions/upload-artifact@v4
        with:
          name: AuthorGram+-12.9.2-Dev-Release-ARM64
          path: ${{ runner.temp }}/authorgram-plus-dev/
          if-no-files-found: error
          retention-days: 30

      - name: Publish successful release status
        if: ${{ success() }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'authorgram/dev-release',
              description: 'AuthorGram+ Dev release APK verified successfully',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Publish failed release status
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'authorgram/dev-release',
              description: 'AuthorGram+ Dev release APK build failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Remove signing key from runner
        if: always()
        shell: bash
        run: rm -f TMessagesProj/release.keystore local.properties
