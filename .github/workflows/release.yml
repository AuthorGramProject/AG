name: AuthorGram 12.9.2 Final Main + Play Release

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - .github/FINAL_RELEASE_12_9_2

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: authorgram-12-9-2-final-main-play-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and build Main + Play release APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      MAIN_PACKAGE: fork.risin42.nagramx
      PLAY_PACKAGE: toss.authorgram.apk
      VERSION_NAME: 12.9.2
      VERSION_CODE: '6991'
      PYTHONDONTWRITEBYTECODE: '1'
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      AUTHORGRAM_SIGNING_CERT_SHA256: ${{ secrets.AUTHORGRAM_SIGNING_CERT_SHA256 }}

    steps:
      - name: Checkout final dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Publish pending release status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'authorgram/final-main-play-release',
              description: 'Final Main and Play source verification and release build are running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Apply and verify all final chat UI repairs
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/final_release_12_9_2.sh

          python3 - <<'PY'
          from pathlib import Path

          scripts = (
              'scripts/apply_authorgram_exact_icon_and_spy.py',
              'scripts/fix_authorgram_adaptive_icon.py',
              'scripts/finalize_authorgram_source.py',
              'scripts/authorgram_guard.py',
              'scripts/authorgram_parity_guard.py',
              'scripts/patch_authorgram_build_key.py',
              'scripts/patch_authorgram_play_policy.py',
              'scripts/patch_authorgram_ui_12_9_2.py',
              'scripts/patch_authorgram_ios_menu_v2.py',
              'scripts/patch_authorgram_final_chat_ui.py',
              'scripts/patch_authorgram_final_ui_compat.py',
              'scripts/patch_authorgram_adaptive_ios_preview.py',
              'scripts/patch_authorgram_popup_bounds.py',
              'scripts/patch_authorgram_badge_surfaces.py',
          )
          for relative in scripts:
              source = Path(relative).read_text(encoding='utf-8')
              compile(source, relative, 'exec')
              print(f'Python syntax passed: {relative}')
          PY

          python3 scripts/patch_authorgram_ui_12_9_2.py
          python3 scripts/patch_authorgram_adaptive_ios_preview.py
          python3 scripts/patch_authorgram_popup_bounds.py
          python3 scripts/patch_authorgram_badge_surfaces.py
          python3 scripts/patch_authorgram_play_policy.py
          git diff --check

          python3 - <<'PY'
          from pathlib import Path

          def require(relative, *markers):
              text = Path(relative).read_text(encoding='utf-8')
              missing = [marker for marker in markers if marker not in text]
              if missing:
                  raise SystemExit(f'{relative}: missing {missing}')
              return text

          action_bar = require(
              'TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ActionBar.java',
              'AUTHORGRAM_STANDARD_CHAT_HEADER',
              'parentFragment instanceof org.telegram.ui.ChatActivity',
              'return false;',
          )
          popup = require(
              'TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ActionBarPopupWindow.java',
              'AUTHORGRAM_RELIABLE_POPUP_SCROLL',
              'scrollView.setScrollContainer(true);',
          )
          scrim = require(
              'TMessagesProj/src/main/java/org/telegram/ui/Components/ChatScrimPopupContainerLayout.java',
              'AUTHORGRAM_FIXED_IOS_MESSAGE_PREVIEW',
              'AUTHORGRAM_ADAPTIVE_IOS_PREVIEW_SCROLL',
              'AUTHORGRAM_MENU_FOOTER_WIDTH_PARITY',
              'availableForActions',
          )
          chat = require(
              'TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java',
              'AUTHORGRAM_FIXED_IOS_PREVIEW_OWNER',
              'AUTHORGRAM_ADAPTIVE_IOS_PREVIEW_OWNER',
              'AUTHORGRAM_FULL_SCREEN_IOS_MENU_BLUR',
              'NekoConfig.iOSMessageMenu.Bool()',
              'AuthorGramPlayPolicy.canUseIosUi()',
          )
          enter = require(
              'TMessagesProj/src/main/java/org/telegram/ui/Components/ChatActivityEnterView.java',
              'AUTHORGRAM_MAIN_ONLY_IOS_INPUT',
              'AUTHORGRAM_IOS_INPUT_MENU_GUARD',
              'AUTHORGRAM_IOS_SEND_BUTTON_INVARIANT',
              'sendButtonView.setVisibility(VISIBLE);',
              'sendButtonView.setAlpha(1.0f);',
          )
          preview = require(
              'TMessagesProj/src/main/java/org/telegram/ui/Components/IOSMessageMenuPreview.java',
              'AUTHORGRAM_UNIFIED_IOS_MESSAGE_BLOCK',
              'AUTHORGRAM_ADAPTIVE_IOS_MESSAGE_PREVIEW',
              'AUTHORGRAM_FINAL_PREVIEW_COMPAT',
              'BackupImageView avatarView',
              'TextView senderNameView',
              'sourceCell.draw(canvas);',
              'public boolean shouldScrollWithActions()',
          )
          policy = require(
              'TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramPlayPolicy.java',
              'values.put("iOSMessageInputField", false)',
              'values.put("iOSMessageMenu", false)',
              'public static boolean canUseIosUi()',
          )

          if 'AUTHORGRAM_IOS_MESSAGE_ACTION_GAP' in chat:
              raise SystemExit('Selected-message preview is still owned by the actions ScrollView in the short-message path')
          if 'BluredView' in preview or 'BlurredView' in preview:
              raise SystemExit('Preview-local blur remains; full-screen blur must stay owned by ChatActivity')
          if 'compactIndices.remove(index);' in chat:
              raise SystemExit('Unsafe compact-menu index removal remains')
          if 'GridLayout compactIconBar = null;' in chat:
              if 'AUTHORGRAM_COMPACT_MENU_LIMIT' not in chat:
                  raise SystemExit('Compact iOS menu exists without a bounded item limit')
              if 'compactIndices.remove(Integer.valueOf(index))' not in chat:
                  raise SystemExit('Compact iOS menu overflow removal is not value-safe')

          badge_sources = (
              Path('TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramAuthorBadge.java'),
              Path('TMessagesProj/src/main/java/org/telegram/ui/Components/StatusBadgeComponent.java'),
              Path('TMessagesProj/src/main/java/org/telegram/ui/Cells/DialogCell.java'),
          )
          badge_text = '\n'.join(path.read_text(encoding='utf-8') for path in badge_sources)
          forbidden_badge_ids = (
              '6802848305', '6822670748', '8470484374', '8154455619',
              '7913929703', '8856346711', '8357439344', '8548193112',
              '8395237407', '8925149503', '-1003781500049',
              '-1004297907963', '3781500049', '4297907963',
          )
          leaked = [item for item in forbidden_badge_ids if item in badge_text]
          if leaked:
              raise SystemExit(f'Raw author_badge identifiers remain in source: {leaked}')
          if badge_text.count('AuthorGramAuthorBadge.matches(') < 4:
              raise SystemExit('Protected author_badge policy is not connected to all required surfaces')
          if 'AuthorGramBuildIntegrity.isTrustedBuild()' not in badge_text:
              raise SystemExit('Protected author_badge is not bound to trusted release integrity')

          print('Final header, iOS message menu, adaptive scrolling, blur, composer and badge invariants passed')
          PY

      - name: Commit repaired dev source once
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_authorgram_exact_icon_and_spy.py
          python3 scripts/fix_authorgram_adaptive_icon.py
          python3 scripts/patch_authorgram_build_key.py
          python3 scripts/patch_authorgram_play_policy.py
          python3 scripts/finalize_authorgram_source.py --role dev --package "${MAIN_PACKAGE}"
          git diff --check

          git config user.name "AuthorGram Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Finalize header, iOS menu and composer repairs"
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:dev; then
                pushed=true
                break
              fi
              git fetch --force origin dev
              git rebase origin/dev
            done
            [[ "${pushed}" == "true" ]] || {
              echo 'Unable to push finalized dev source after three attempts.' >&2
              exit 1
            }
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle build cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36'

      - name: Build two verified release APKs
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/final_release_12_9_2.sh

      - name: Verify final artifact set
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/authorgram-final/artifacts"
          mapfile -t apks < <(find "${artifact_dir}" -maxdepth 1 -type f -name '*.apk' -print | sort)
          mapfile -t main_apks < <(find "${artifact_dir}" -maxdepth 1 -type f -name 'AuthorGram-Main-*.apk' -print | sort)
          mapfile -t play_apks < <(find "${artifact_dir}" -maxdepth 1 -type f -name 'AuthorGram-Play-*.apk' -print | sort)
          mapfile -t aabs < <(find "${artifact_dir}" -maxdepth 1 -type f -name '*.aab' -print | sort)

          [[ "${#apks[@]}" -eq 2 ]] || { echo "Expected exactly two APKs, found ${#apks[@]}" >&2; exit 1; }
          [[ "${#main_apks[@]}" -eq 1 ]] || { echo "Expected exactly one Main APK" >&2; exit 1; }
          [[ "${#play_apks[@]}" -eq 1 ]] || { echo "Expected exactly one Play APK" >&2; exit 1; }
          [[ "${#aabs[@]}" -eq 0 ]] || { echo 'AAB artifacts are forbidden' >&2; exit 1; }

          aapt="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          apksigner="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          zipalign="${ANDROID_HOME}/build-tools/36.0.0/zipalign"

          verify_apk() {
            local apk="$1"
            local expected_package="$2"
            local badging package version_name version_code signer_report
            "${zipalign}" -c -P 16 4 "${apk}"
            badging="$("${aapt}" dump badging "${apk}")"
            package="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"${badging}" | head -n 1)"
            version_code="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<<"${badging}" | head -n 1)"
            version_name="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<<"${badging}" | head -n 1)"
            [[ "${package}" == "${expected_package}" ]]
            [[ "${version_code}" == "${VERSION_CODE}" ]]
            [[ "${version_name}" == "${VERSION_NAME}" ]]
            ! grep -q '^application-debuggable' <<<"${badging}"
            signer_report="$("${apksigner}" verify --verbose --print-certs "${apk}")"
            printf '%s\n' "${signer_report}"
            grep -Eq 'Verified using v2 scheme.*true|Verified using v3 scheme.*true' <<<"${signer_report}"
          }

          verify_apk "${main_apks[0]}" "${MAIN_PACKAGE}"
          verify_apk "${play_apks[0]}" "${PLAY_PACKAGE}"

          main_permissions="$("${aapt}" dump permissions "${main_apks[0]}")"
          play_permissions="$("${aapt}" dump permissions "${play_apks[0]}")"
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' <<<"${main_permissions}"
          ! grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' <<<"${play_permissions}"

          main_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "${artifact_dir}/Main-CERTIFICATE.txt" | head -n 1)"
          play_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "${artifact_dir}/Play-CERTIFICATE.txt" | head -n 1)"
          [[ -n "${main_cert}" && "${main_cert}" == "${play_cert}" ]]

          test -s "${artifact_dir}/Main-BUILD.txt"
          test -s "${artifact_dir}/Play-BUILD.txt"
          test -s "${artifact_dir}/RELEASE-SUMMARY.txt"
          test -s "${artifact_dir}/SHA256SUMS.txt"
          [[ "$(grep -c 'AuthorGram-.*\.apk' "${artifact_dir}/SHA256SUMS.txt")" -eq 2 ]]

          cat "${artifact_dir}/RELEASE-SUMMARY.txt"
          cat "${artifact_dir}/SHA256SUMS.txt"

      - name: Upload final Main and Play APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AuthorGram-12.9.2-Final-Main-and-Play-Release
          path: ${{ runner.temp }}/authorgram-final/artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish final release status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'authorgram/final-main-play-release',
              description: success
                ? 'Verified Main and Play release APK ZIP is ready'
                : 'Final Main and Play release verification or build failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
