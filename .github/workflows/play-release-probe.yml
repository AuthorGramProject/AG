name: AuthorGram Play Release Probe

on:
  push:
    branches: [dev]
    paths:
      - .github/PLAY_RELEASE_PROBE_12_9_2

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Record latest isolated Play run
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const targetPath = '.github/workflows/play-release.yml';
            const outputPath = '.github/PLAY_RELEASE_PROBE_STATUS_12_9_2.json';
            const branch = 'dev';

            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              { owner, repo, per_page: 100 },
            );
            const workflow = workflows.find(item => item.path === targetPath);
            if (!workflow) {
              core.setFailed(`Workflow not found: ${targetPath}`);
              return;
            }

            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflow.id,
              branch,
              per_page: 5,
            });
            const latest = runs.data.workflow_runs[0] || null;
            const payload = {
              workflow_id: workflow.id,
              workflow_path: workflow.path,
              workflow_state: workflow.state,
              latest: latest ? {
                run_id: latest.id,
                run_number: latest.run_number,
                run_attempt: latest.run_attempt,
                status: latest.status,
                conclusion: latest.conclusion,
                event: latest.event,
                head_branch: latest.head_branch,
                head_sha: latest.head_sha,
                html_url: latest.html_url,
                created_at: latest.created_at,
                updated_at: latest.updated_at,
              } : null,
            };

            const content = Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path: outputPath, ref: branch });
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: outputPath,
              message: `Probe isolated Play workflow ${workflow.id}`,
              content,
              branch,
              ...(sha ? { sha } : {}),
            });
