name: Integrate AuthorGram encryption into TOSS

on:
  push:
    branches: [agent/toss-final]
    paths:
      - '.github/workflows/toss-integrate-common.yml'

permissions:
  contents: write

concurrency:
  group: toss-encryption-integration
  cancel-in-progress: true

jobs:
  integrate:
    name: Apply reviewed main encryption code
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout existing TOSS branch
        uses: actions/checkout@v4
        with:
          ref: agent/toss-final
          fetch-depth: 0

      - name: Integrate security and per-chat keys
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          SOURCE = 'origin/main'

          def source(path: str) -> str:
              return subprocess.check_output(['git', 'show', f'{SOURCE}:{path}'], text=True)

          def write(path: str, text: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')

          def matching_delimiter(text: str, opening: int, left: str, right: str) -> int:
              depth = 0
              i = opening
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if line_comment:
                      if ch == '\n':
                          line_comment = False
                      i += 1
                      continue
                  if block_comment:
                      if ch == '*' and nxt == '/':
                          block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch == '/' and nxt == '/':
                      line_comment = True
                      i += 2
                      continue
                  if ch == '/' and nxt == '*':
                      block_comment = True
                      i += 2
                      continue
                  if ch in ('"', "'"):
                      quote = ch
                      i += 1
                      continue
                  if ch == left:
                      depth += 1
                  elif ch == right:
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise RuntimeError(f'Unbalanced {left}{right} block')

          common_files = [
              'TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramBuildIntegrity.java',
              'TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramChatCrypto.java',
              'TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramChatKeyStore.java',
              'TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramCrypto.java',
              'TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramCryptoInterceptor.java',
              'TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramKeyDialog.java',
              'TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramKeyProtector.java',
              'TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramMessageMeta.java',
              'TMessagesProj/src/main/res/drawable/authorgram_key.xml',
          ]
          for path in common_files:
              write(path, source(path))

          build_path = 'TMessagesProj/build.gradle'
          build = source(build_path)
          if build.count("String gramName = 'AuthorGram'") != 1:
              raise RuntimeError('Expected AuthorGram APK-name anchor in main build.gradle')
          build = build.replace("String gramName = 'AuthorGram'", "String gramName = 'TOSS'", 1)
          write(build_path, build)

          props_path = Path('gradle.properties')
          props = props_path.read_text(encoding='utf-8')
          for key in ('RELEASE_KEY_PASSWORD', 'RELEASE_KEY_ALIAS', 'RELEASE_STORE_PASSWORD'):
              props = re.sub(rf'(?m)^{re.escape(key)}=.*\n?', '', props)
          if 'APP_PACKAGE=toss.authorgram.apk' not in props:
              raise RuntimeError('TOSS package identity was lost')
          props_path.write_text(props, encoding='utf-8')

          manifest_path = Path('TMessagesProj/src/main/AndroidManifest.xml')
          manifest = manifest_path.read_text(encoding='utf-8')
          manifest = manifest.replace('    <uses-permission android:name="android.permission.READ_CLIPBOARD"/>\n', '')
          manifest = re.sub(r'\s+android:restoreAnyVersion="true"', '', manifest, count=1)
          manifest = re.sub(r'\s+android:backupAgent="\.BackupAgent"', '', manifest, count=1)
          manifest = manifest.replace('android:allowBackup="true"', 'android:allowBackup="false"', 1)
          manifest = manifest.replace('android:hasFragileUserData="true"', 'android:hasFragileUserData="false"', 1)
          manifest = manifest.replace('android:allowAudioPlaybackCapture="true"', 'android:allowAudioPlaybackCapture="false"', 1)

          def service_block(name: str):
              marker = f'android:name="{name}"'
              start = manifest.find(marker)
              if start < 0:
                  raise RuntimeError(f'Missing service {name}')
              block_start = manifest.rfind('<service', 0, start)
              block_end = manifest.find('/>', start)
              if block_start < 0 or block_end < 0:
                  raise RuntimeError(f'Invalid service block {name}')
              return block_start, block_end + 2

          for name in (
              '.BringAppForegroundService',
              '.NotificationsService',
              '.VideoEncodingService',
              'org.telegram.ui.Stories.recorder.StoryUploadingService',
              '.ImportingService',
              '.LocationSharingService',
              '.MusicPlayerService',
          ):
              start, end = service_block(name)
              block = manifest[start:end]
              if 'android:exported="true"' in block:
                  block = block.replace('android:exported="true"', 'android:exported="false"', 1)
                  manifest = manifest[:start] + block + manifest[end:]

          for name, permission in {
              '.AuthenticatorService': 'android.permission.BIND_ACCOUNT_AUTHENTICATOR',
              '.ContactsSyncAdapterService': 'android.permission.BIND_SYNC_ADAPTER',
              '.MusicBrowserService': 'android.permission.BIND_MEDIA_BROWSER_SERVICE',
          }.items():
              start, end = service_block(name)
              block = manifest[start:end]
              required = f'android:permission="{permission}"'
              if required not in block:
                  exported = 'android:exported="true"'
                  if exported not in block:
                      raise RuntimeError(f'Missing exported anchor for {name}')
                  block = block.replace(exported, exported + f'\n            {required}', 1)
                  manifest = manifest[:start] + block + manifest[end:]

          if '@mipmap/ic_launcher_toss' not in manifest:
              raise RuntimeError('TOSS launcher identity was lost')
          if 'android.permission.REQUEST_INSTALL_PACKAGES' in manifest:
              raise RuntimeError('Play build must not request install permission')
          manifest_path.write_text(manifest, encoding='utf-8')

          chat_path = Path('TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java')
          chat = chat_path.read_text(encoding='utf-8')
          if 'AUTHORGRAM_KEY_SETTINGS' not in chat:
              constant = '    private static final int AUTHORGRAM_CRYPTO_TOGGLE = 0x6A470001;\n'
              if chat.count(constant) != 1:
                  raise RuntimeError('Toggle constant anchor not found')
              chat = chat.replace(
                  constant,
                  constant + '    private static final int AUTHORGRAM_KEY_SETTINGS = 0x6A470002;\n',
                  1,
              )

              toggle_match = re.search(
                  r'(?:if|else\s+if)\s*\(\s*id\s*==\s*AUTHORGRAM_CRYPTO_TOGGLE\s*\)\s*\{',
                  chat,
              )
              if not toggle_match:
                  raise RuntimeError('Toggle handler condition not found')
              handler_open = chat.find('{', toggle_match.start(), toggle_match.end())
              handler_close = matching_delimiter(chat, handler_open, '{', '}')
              handler_indent_start = chat.rfind('\n', 0, toggle_match.start()) + 1
              handler_indent = chat[handler_indent_start:toggle_match.start()]
              key_handler = (
                  f' else if (id == AUTHORGRAM_KEY_SETTINGS) {{\n'
                  f'{handler_indent}    org.telegram.messenger.authorgram.AuthorGramKeyDialog.show(\n'
                  f'{handler_indent}            getParentActivity(),\n'
                  f'{handler_indent}            currentAccount,\n'
                  f'{handler_indent}            dialog_id\n'
                  f'{handler_indent}    );\n\n'
                  f'{handler_indent}    return;\n'
                  f'{handler_indent}}}'
              )
              chat = chat[:handler_close + 1] + key_handler + chat[handler_close + 1:]

              menu_match = re.search(
                  r'headerItem\.lazilyAddSubItem\s*\(\s*AUTHORGRAM_CRYPTO_TOGGLE\b',
                  chat,
              )
              if not menu_match:
                  raise RuntimeError('Toggle menu call not found')
              menu_open = chat.find('(', menu_match.start(), menu_match.end())
              menu_close = matching_delimiter(chat, menu_open, '(', ')')
              semicolon = chat.find(';', menu_close)
              if semicolon < 0 or semicolon - menu_close > 16:
                  raise RuntimeError('Toggle menu call terminator not found')
              menu_indent_start = chat.rfind('\n', 0, menu_match.start()) + 1
              menu_indent = chat[menu_indent_start:menu_match.start()]
              key_menu = (
                  '\n'
                  f'{menu_indent}headerItem.lazilyAddSubItem(\n'
                  f'{menu_indent}        AUTHORGRAM_KEY_SETTINGS,\n'
                  f'{menu_indent}        R.drawable.authorgram_key,\n'
                  f'{menu_indent}        LocaleController.getString(R.string.AuthorGramKeySettings)\n'
                  f'{menu_indent});'
              )
              chat = chat[:semicolon + 1] + key_menu + chat[semicolon + 1:]

          chat_path.write_text(chat, encoding='utf-8')

          string_names = (
              'AuthorGramKeySettings',
              'AuthorGramSystemKeyLocked',
              'AuthorGramCustomKeyActive',
              'AuthorGramSystemKeyActive',
              'AuthorGramGenerateKey',
              'AuthorGramGenerateKeyInfo',
              'AuthorGramRotateKey',
              'AuthorGramRotateKeyWarning',
              'AuthorGramImportKey',
              'AuthorGramImportKeyInfo',
              'AuthorGramExportKey',
              'AuthorGramRemoveKey',
              'AuthorGramRemoveKeyWarning',
              'AuthorGramKeyInputHint',
              'AuthorGramKeySaved',
              'AuthorGramKeyRemoved',
              'AuthorGramInvalidKey',
              'AuthorGramNoCustomKey',
              'AuthorGramKeyOperationFailed',
          )
          for path in (
              'TMessagesProj/src/main/res/values/strings.xml',
              'TMessagesProj/src/main/res/values-de/strings.xml',
              'TMessagesProj/src/main/res/values-uk/strings.xml',
          ):
              target = Path(path)
              target_text = target.read_text(encoding='utf-8')
              source_text = source(path)
              additions = []
              for name in string_names:
                  if f'name="{name}"' in target_text:
                      continue
                  match = re.search(
                      rf'<string\s+name="{re.escape(name)}"[^>]*>.*?</string>',
                      source_text,
                      flags=re.DOTALL,
                  )
                  if not match:
                      raise RuntimeError(f'Missing {name} in main {path}')
                  additions.append('    ' + match.group(0).strip())
              if additions:
                  if '</resources>' not in target_text:
                      raise RuntimeError(f'Missing resources root in {path}')
                  target_text = target_text.replace(
                      '</resources>',
                      '\n' + '\n'.join(additions) + '\n</resources>',
                      1,
                  )
                  target.write_text(target_text, encoding='utf-8')

          assert Path('TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramChatKeyStore.java').exists()
          assert 'APP_PACKAGE=toss.authorgram.apk' in props_path.read_text(encoding='utf-8')
          assert 'AUTHORGRAM_KEY_SETTINGS' in chat_path.read_text(encoding='utf-8')
          assert 'android:allowBackup="false"' in manifest_path.read_text(encoding='utf-8')
          print('TOSS common integration complete')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TMessagesProj gradle.properties
          if git diff --cached --quiet; then
            echo 'TOSS encryption integration is already current'
            exit 0
          fi
          git commit -m 'Integrate current AuthorGram encryption and security into TOSS'
          git push origin HEAD:agent/toss-final
