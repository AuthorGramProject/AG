name: AuthorGram Actions Cleanup Verification

on:
  push:
    branches: [dev]
    paths: [.github/ACTIONS_CLEANUP_VERIFY_TRIGGER]

permissions:
  actions: write
  contents: write

concurrency:
  group: authorgram-actions-cleanup-verification
  cancel-in-progress: false

jobs:
  verify-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: true

      - name: Delete historical, Designers, failed and cancelled runs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/cleanup_authorgram_actions.py

      - name: Verify cleanup, publish report and remove temporary workflow
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = Number(context.runId);
            const cutoffTitle = 'Update/telegram 12.9.0 20260718 212239';
            const fallbackCutoffIso = '2026-07-19T22:45:50Z';
            const designerPattern = /\bdesigners?\b/i;
            const branches = ['dev', 'main', 'play-market'];

            const allRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            );
            const cutoffMatches = allRuns.filter(run => {
              const values = [run.display_title, run.name, run.head_commit?.message].filter(Boolean);
              return values.some(value => value === cutoffTitle);
            });
            cutoffMatches.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            const cutoffIso = cutoffMatches[0]?.created_at ?? fallbackCutoffIso;
            const cutoffTime = Date.parse(cutoffIso);

            const remainingHistorical = allRuns.filter(run =>
              Number(run.id) !== currentRunId && Date.parse(run.created_at) <= cutoffTime
            );
            const remainingDesignerRuns = allRuns.filter(run =>
              Number(run.id) !== currentRunId
              && designerPattern.test(`${run.name ?? ''} ${run.display_title ?? ''}`)
            );
            const remainingUnsuccessful = allRuns.filter(run =>
              Number(run.id) !== currentRunId
              && ['failure', 'cancelled'].includes(run.conclusion)
            );

            const designerWorkflowFiles = [];
            const workflowFilesByBranch = {};
            for (const branch of branches) {
              let entries = [];
              try {
                const response = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: '.github/workflows',
                  ref: branch,
                });
                entries = Array.isArray(response.data) ? response.data : [];
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              workflowFilesByBranch[branch] = [];
              for (const entry of entries) {
                if (entry.type !== 'file' || !/\.ya?ml$/i.test(entry.name)) continue;
                workflowFilesByBranch[branch].push(entry.path);
                let source = '';
                const file = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: entry.path,
                  ref: branch,
                });
                if (!Array.isArray(file.data) && file.data.content) {
                  source = Buffer.from(file.data.content, 'base64').toString('utf8');
                }
                const topLevelName = source.match(/^name:\s*(.+)$/m)?.[1] ?? '';
                if (designerPattern.test(entry.name) || designerPattern.test(topLevelName)) {
                  designerWorkflowFiles.push({ branch, path: entry.path, name: topLevelName });
                }
              }
            }

            const otherRuns = allRuns.filter(run => Number(run.id) !== currentRunId);
            const sortedDates = otherRuns
              .map(run => run.created_at)
              .filter(Boolean)
              .sort((a, b) => Date.parse(a) - Date.parse(b));
            const report = {
              verified_at: new Date().toISOString(),
              verification_run_id: currentRunId,
              cutoff_title: cutoffTitle,
              cutoff_iso: cutoffIso,
              earliest_remaining_run: sortedDates[0] ?? null,
              remaining_run_count_excluding_current: otherRuns.length,
              remaining_historical_run_ids: remainingHistorical.map(run => run.id),
              remaining_designers_run_ids: remainingDesignerRuns.map(run => run.id),
              remaining_failed_or_cancelled_run_ids: remainingUnsuccessful.map(run => run.id),
              remaining_designers_workflow_files: designerWorkflowFiles,
              workflow_files_by_branch: workflowFilesByBranch,
              result: (
                remainingHistorical.length === 0
                && remainingDesignerRuns.length === 0
                && remainingUnsuccessful.length === 0
                && designerWorkflowFiles.length === 0
              ) ? 'success' : 'failure',
            };

            const reportPath = '.github/ACTIONS_CLEANUP_REPORT.json';
            let reportSha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path: reportPath, ref: 'dev' });
              if (!Array.isArray(existing.data)) reportSha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: reportPath,
              branch: 'dev',
              message: '[skip ci] Record verified Actions cleanup',
              content: Buffer.from(JSON.stringify(report, null, 2) + '\n').toString('base64'),
              ...(reportSha ? { sha: reportSha } : {}),
            });

            if (report.result !== 'success') {
              throw new Error(`Actions cleanup verification failed: ${JSON.stringify(report)}`);
            }

            for (const path of [
              '.github/ACTIONS_CLEANUP_VERIFY_TRIGGER',
              '.github/workflows/actions-cleanup-verification.yml',
            ]) {
              try {
                const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'dev' });
                if (!Array.isArray(current.data)) {
                  await github.rest.repos.deleteFile({
                    owner,
                    repo,
                    path,
                    branch: 'dev',
                    sha: current.data.sha,
                    message: `[skip ci] Remove temporary cleanup verification ${path}`,
                  });
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            core.info(JSON.stringify(report, null, 2));
