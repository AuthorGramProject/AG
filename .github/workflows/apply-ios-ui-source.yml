name: Apply AuthorGram iOS UI Source Restoration

on:
  push:
    branches: [dev]
    paths:
      - .github/APPLY_IOS_UI_SOURCE

permissions:
  contents: write

concurrency:
  group: authorgram-ios-ui-source-restoration
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: true

      - name: Apply deterministic source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/restore_authorgram_ios_ui.py
          python3 scripts/restore_authorgram_ios_ui.py
          python3 scripts/restore_authorgram_ios_ui.py --check
          git diff --check

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AuthorGram Source Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java \
            TMessagesProj/src/main/java/tw/nekomimi/nekogram/NekoConfig.java \
            TMessagesProj/src/main/java/toss/authorgram/settings/AGChatSettingsActivity.java \
            TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramDefaults.java \
            TMessagesProj/src/main/res/values/strings_neko.xml
          if git diff --cached --quiet; then
            echo "Source already restored."
            exit 0
          fi
          git commit -m "[skip ci] Restore stable iOS input and iOS message menu"
          git push origin HEAD:dev
