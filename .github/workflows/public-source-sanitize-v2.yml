name: Finalize sanitized public Play source

on:
  push:
    branches: [play-market]
    paths:
      - .github/workflows/public-source-sanitize-v2.yml

permissions:
  contents: read

jobs:
  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: play-market
          fetch-depth: 1

      - name: Fetch pinned public upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add nagramxf https://github.com/Keeperorowner/NagramXF.git
          git fetch --no-tags --depth=2 nagramxf 1b4e59b4b3c995a32e40ba1d44a7a7524a9b829a
          git fetch --no-tags --depth=2 nagramxf edf8adfe57d70e52a9a1ab5add43d205f0b20ef7
          git cat-file -e 39a04dc565f66a4a783a04d0ddf1349fe17cdcf6^{commit}

      - name: Subtract iOS composer feature
        shell: bash
        run: |
          set -euo pipefail
          IOS=edf8adfe57d70e52a9a1ab5add43d205f0b20ef7
          PRE=39a04dc565f66a4a783a04d0ddf1349fe17cdcf6
          TMP="${RUNNER_TEMP}/ios-subtract"
          mkdir -p "${TMP}"

          while IFS=$'\t' read -r status path; do
            [ -n "${path}" ] || continue
            case "${status}" in
              A*) rm -f -- "${path}" ;;
              M*)
                [ -f "${path}" ] || continue
                git show "${IOS}:${path}" > "${TMP}/post"
                git show "${PRE}:${path}" > "${TMP}/pre"
                git merge-file --theirs -p -- "${path}" "${TMP}/post" "${TMP}/pre" > "${TMP}/merged"
                mv "${TMP}/merged" "${path}"
                ;;
              *) ;;
            esac
          done < <(git diff-tree --no-commit-id --name-status -r "${PRE}" "${IOS}")

          # All later edits in this small state-machine file were iOS-input fixes.
          git show "${PRE}:TMessagesProj/src/main/java/org/telegram/ui/Components/ChatActivityEnterViewAnimatedIconView.java" \
            > TMessagesProj/src/main/java/org/telegram/ui/Components/ChatActivityEnterViewAnimatedIconView.java

      - name: Remove Play-inapplicable remnants
        shell: bash
        run: |
          set -euo pipefail
          rm -f release.keystore TMessagesProj/release.keystore TMessagesProj/google-services.json

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          def edit(path, fn):
              p = root / path
              if p.exists():
                  old = p.read_text(encoding='utf-8')
                  new = fn(old)
                  if new != old:
                      p.write_text(new, encoding='utf-8')

          # Strip the last Play-only Spy compatibility UI surface.
          (root/'TMessagesProj/src/main/java/toss/authorgram/settings/AGSpySettingsActivity.java').unlink(missing_ok=True)

          def settings(s):
              s = s.replace('    private static final String PLAY_PACKAGE = "toss.authorgram.apk";\n', '')
              s = s.replace('    private int spyRow;\n', '')
              s = s.replace('''        if (isPrivateMainBuild()) {\n            spyRow = addRow();\n        } else {\n            spyRow = -1;\n        }\n''', '')
              s = s.replace('''        } else if (position == spyRow) {\n            presentFragment(new AGSpySettingsActivity());\n''', '')
              s = re.sub(r'\n    private boolean isPrivateMainBuild\(\) \{.*?\n    \}\n', '\n', s, flags=re.S)
              return s
          edit('TMessagesProj/src/main/java/toss/authorgram/settings/AGSettingsActivity.java', settings)

          def router(s):
              s = s.replace('import org.telegram.messenger.ApplicationLoader;\n', '')
              s = s.replace('import org.telegram.messenger.authorgram.AuthorGramPlayPolicy;\n', '')
              s = s.replace('    private static final String PLAY_PACKAGE = "toss.authorgram.apk";\n', '')
              s = re.sub(r'\n    private static boolean isPrivateMainBuild\(\) \{.*?\n    \}\n', '\n', s, flags=re.S)
              s = re.sub(r'\s*case "spy":.*?break;\n', '', s, flags=re.S)
              s = re.sub(r'\s*case "privacy":\n\s*case "security":\n\s*case "p":.*?break;\n', '', s, flags=re.S)
              s = re.sub(r'\s*case "ghostmode":\n\s*case "ghost":.*?break;\n', '', s, flags=re.S)
              s = re.sub(r'\s*if \(isPrivateMainBuild\(\)\) \{\n\s*fragments\.add\(new AGSpySettingsActivity\(\)\);\n\s*fragments\.add\(new AGPrivacySettingsActivity\(\)\);\n\s*\}\n', '\n', s)
              return s
          edit('TMessagesProj/src/main/java/toss/authorgram/settings/AGSettingsRouter.java', router)

          def policy(s):
              s = re.sub(r'\s*// The unfinished iOS-inspired composer.*?values\.put\("iOSMessageMenu", false\);\n', '\n', s, flags=re.S)
              s = re.sub(r'\n    public static boolean canUseIosInput\(\) \{.*?\n    \}\n\n    public static boolean canUseIosUi\(\) \{.*?\n    \}\n', '\n', s, flags=re.S)
              s = s.replace('normalized.equals("spy")\n                || normalized.equals("ayuspy")\n                || ', '')
              return s
          edit('TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramPlayPolicy.java', policy)

          def chat_settings(s):
              s = re.sub(r'\n    private AbstractConfigCell appendIOSMessageInputFieldRow\(\) \{.*?\n    \}\n', '\n', s, flags=re.S)
              s = re.sub(r'^\s*private final AbstractConfigCell iOSMessageInputFieldRow = appendIOSMessageInputFieldRow\(\);\n', '', s, flags=re.M)
              return s
          edit('TMessagesProj/src/main/java/toss/authorgram/settings/AGChatSettingsActivity.java', chat_settings)

          # Later AuthorGram iOS stabilization edits that were layered on top of
          # the upstream feature are reduced to ordinary Telegram behavior.
          def enter_view(s):
              standard_attach = '''attachButton = new ImageView(context) {\n                @Override\n                public boolean dispatchTouchEvent(MotionEvent event) {\n                    if (getAlpha() < 0.5f) return false;\n                    return super.dispatchTouchEvent(event);\n                }\n            };\n            attachButton.setScaleType'''
              s = re.sub(
                  r'attachButton = new ImageView\(context\) \{.*?\n            \};\n            attachButton\.setScaleType',
                  standard_attach, s, count=1, flags=re.S
              )
              s = s.replace('attachRestore.setStartDelay(isIOSInputStyle() ? 750 : 0);', 'attachRestore.setStartDelay(0);')
              s = s.replace('icons2.setStartDelay(isIOSInputStyle() ? 750 : 110);', 'icons2.setStartDelay(110);')
              s = s.replace('if (attachButton != null && !isIOSInputStyle()) {', 'if (attachButton != null) {')

              # Any remaining standalone iOS-only blocks are later stabilization
              # blocks. Since the public Play composer has no iOS mode, retain an
              # else branch when present, otherwise remove the unreachable block.
              marker = 'if (isIOSInputStyle()) {'
              while marker in s:
                  pos = s.rfind(marker)
                  open_i = s.find('{', pos)
                  depth = 0
                  close_i = None
                  for i in range(open_i, len(s)):
                      if s[i] == '{': depth += 1
                      elif s[i] == '}':
                          depth -= 1
                          if depth == 0:
                              close_i = i
                              break
                  if close_i is None: raise RuntimeError('Unbalanced iOS block')
                  j = close_i + 1
                  while j < len(s) and s[j].isspace(): j += 1
                  if s.startswith('else', j):
                      k = j + 4
                      while k < len(s) and s[k].isspace(): k += 1
                      if k < len(s) and s[k] == '{':
                          depth = 0
                          end = None
                          for i in range(k, len(s)):
                              if s[i] == '{': depth += 1
                              elif s[i] == '}':
                                  depth -= 1
                                  if depth == 0:
                                      end = i
                                      break
                          if end is None: raise RuntimeError('Unbalanced iOS else block')
                          s = s[:pos] + s[k+1:end] + s[end+1:]
                          continue
                  s = s[:pos] + s[close_i+1:]
              return s
          edit('TMessagesProj/src/main/java/org/telegram/ui/Components/ChatActivityEnterView.java', enter_view)

          bad_names = {'iOSMessageInputField','iOSMessageInputFieldNotice','AyuSpySettings','SaveReadDate','SaveReadDateAbout'}
          name_re = re.compile(r'<string\s+name="([^"]+)"')
          for p in (root/'TMessagesProj/src/main/res').glob('values*/strings_*.xml'):
              lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
              kept = []
              for line in lines:
                  m = name_re.search(line)
                  if m and m.group(1) in bad_names:
                      continue
                  kept.append(line)
              p.write_text(''.join(kept), encoding='utf-8')
          PY

      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=TMessagesProj/src
          PATTERN='AyuSpy|SpyDao|SpyMessage(Read|ContentsRead)|SpyLastSeen|spyQueue|SaveReadDate|AyuSpySettings|authorgram_spy|AGSpySettingsActivity|iOSMessage|IOSMessage|iosInput|isIOSInputStyle'
          if grep -RInE --include='*.java' --include='*.kt' --include='*.xml' "${PATTERN}" "${ROOT}"; then
            echo 'Forbidden Spy/iOS references remain.' >&2
            exit 1
          fi
          ! find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pfx' -o -name '*.aab' -o -name '*.apk' \) -print -quit | grep -q .
          ! grep -RIlE --exclude-dir=.git '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|RELEASE_STORE_PASSWORD|RELEASE_KEY_PASSWORD|HISTORICAL_KEYSTORE_BLOB)' TMessagesProj build.gradle gradle.properties 2>/dev/null | grep -q .

      - name: Export clean delta
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/sanitized-public-play"
          mkdir -p "${OUT}"
          git diff --binary --no-renames 1b4e59b4b3c995a32e40ba1d44a7a7524a9b829a -- \
            build.gradle gradle.properties TMessagesProj \
            ':(exclude)TMessagesProj/jni/**' \
            ':(exclude)TMessagesProj/google-services.json' \
            ':(exclude)TMessagesProj/release.keystore' \
            > "${OUT}/public-play.patch"
          printf 'upstreamCommit=%s\nplaySource=%s\n' \
            '1b4e59b4b3c995a32e40ba1d44a7a7524a9b829a' "$(git rev-parse HEAD)" > "${OUT}/SOURCE.txt"
          sha256sum "${OUT}/public-play.patch" > "${OUT}/SHA256SUMS.txt"
          du -h "${OUT}/public-play.patch"

      - uses: actions/upload-artifact@v4
        with:
          name: authorgram-sanitized-public-play-v2
          path: ${{ runner.temp }}/sanitized-public-play/
          retention-days: 1
