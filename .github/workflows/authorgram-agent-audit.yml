name: Consolidate AuthorGram branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/authorgram-agent-audit.yml'

permissions:
  contents: write

concurrency:
  group: authorgram-branch-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep only main, dev, and play-market
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            git ls-remote --heads origin |
              awk '{sub("refs/heads/", "", $2); print $2}' |
              sort
          )
          printf 'Remote branches before cleanup:\n%s\n' "${branches[*]}"
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|dev|play-market)
                ;;
              *)
                git push origin --delete "$branch"
                ;;
            esac
          done
          remaining=$(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort)
          printf 'Remote branches after cleanup:\n%s\n' "$remaining"
          test "$remaining" = $'dev\nmain\nplay-market'

      - name: Remove temporary branch automation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/authorgram-agent-audit.yml
          git add -A
          git diff --cached --check
          git commit -m 'Remove temporary branch automation'
          git push origin HEAD:main
