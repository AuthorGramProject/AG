name: Main release validation

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  build:
    name: Main Release Build
    runs-on: ubuntu-latest
    env:
      NATIVE_TARGET: "arm64-v8a"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36"
      - name: Configure Android SDK Path
        run: echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Release Build
        id: release_build
        continue-on-error: true
        run: |
          set -o pipefail
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./gradlew TMessagesProj:assembleRelease 2>&1 | tee release_build.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            APK=$(find TMessagesProj/build/outputs/apk -name '*arm64-v8a*.apk' | head -1)
            APK=$(dirname "$APK")
            echo "APK=$APK" >> "$GITHUB_ENV"
          fi
          exit "$STATUS"
      - name: Upload release log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-release-build-log
          path: release_build.log
      - name: Fail when release build failed
        if: steps.release_build.outcome == 'failure'
        run: exit 1
      - name: Upload release APK
        if: steps.release_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Main-Release-APK
          path: ${{ env.APK }}
