name: Pull request

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - '**.md'
      - '**.xml'

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    env:
      NATIVE_TARGET: "arm64-v8a"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36"
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Debug Build
        id: debug_build
        continue-on-error: true
        run: |
          set -o pipefail
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export DEBUG_BUILD=true
          sed -i 's/signingConfig = signingConfigs.release//g' TMessagesProj/build.gradle
          ./gradlew TMessagesProj:assembleDebug 2>&1 | tee pr_build.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            APK=$(find TMessagesProj/build/outputs/apk -name '*arm64-v8a*.apk' | head -1)
            APK=$(dirname "$APK")
            echo "APK=$APK" >> "$GITHUB_ENV"
          fi
          exit "$STATUS"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TOSS-pr-build-log
          path: pr_build.log
      - name: Fail when build failed
        if: steps.debug_build.outcome == 'failure'
        run: exit 1
      - name: Upload debug APK
        if: steps.debug_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Debug
          path: ${{ env.APK }}
