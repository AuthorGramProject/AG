name: Export Play source delta

on:
  push:
    branches: [play-market]
    paths:
      - .github/workflows/public-source-export.yml

permissions:
  contents: read

concurrency:
  group: authorgram-public-source-export
  cancel-in-progress: true

jobs:
  export:
    name: Export source-only Play delta
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Play source
        uses: actions/checkout@v4
        with:
          ref: play-market
          fetch-depth: 1

      - name: Fetch clean NagramXF 12.9.2 base
        shell: bash
        run: |
          set -euo pipefail
          git remote add nagramxf https://github.com/Keeperorowner/NagramXF.git
          git fetch --no-tags --depth=1 nagramxf 1b4e59b4b3c995a32e40ba1d44a7a7524a9b829a
          git cat-file -e 1b4e59b4b3c995a32e40ba1d44a7a7524a9b829a^{commit}

      - name: Create private source delta
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/authorgram-public-source"
          mkdir -p "${OUT}"

          git diff --binary --no-renames \
            1b4e59b4b3c995a32e40ba1d44a7a7524a9b829a HEAD -- \
            build.gradle gradle.properties TMessagesProj \
            ':(exclude)TMessagesProj/google-services.json' \
            ':(exclude)TMessagesProj/release.keystore' \
            ':(exclude)TMessagesProj/jni/**' \
            > "${OUT}/play-source.patch"

          # Sensitive material must never enter the export.
          ! grep -aFq '5c0f63c668f7ad06ea674560f10ffb256ff2c092' "${OUT}/play-source.patch"
          ! grep -aEqi '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|RELEASE_STORE_PASSWORD|RELEASE_KEY_PASSWORD|HISTORICAL_KEYSTORE_BLOB)' "${OUT}/play-source.patch"

          printf '%s\n' 'upstream=Keeperorowner/NagramXF' > "${OUT}/SOURCE.txt"
          printf '%s\n' 'upstreamCommit=1b4e59b4b3c995a32e40ba1d44a7a7524a9b829a' >> "${OUT}/SOURCE.txt"
          printf 'playCommit=%s\n' "$(git rev-parse HEAD)" >> "${OUT}/SOURCE.txt"
          sha256sum "${OUT}/play-source.patch" > "${OUT}/SHA256SUMS.txt"
          du -h "${OUT}/play-source.patch"

      - name: Upload private source delta
        uses: actions/upload-artifact@v4
        with:
          name: authorgram-play-source-delta
          path: ${{ runner.temp }}/authorgram-public-source/
          if-no-files-found: error
          retention-days: 1
