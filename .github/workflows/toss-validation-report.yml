name: TOSS validation report

on:
  push:
    branches: [agent/toss-play-market-rebrand]
    paths: ['.github/workflows/toss-validation-report.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NATIVE_TARGET: arm64-v8a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/toss-play-market-rebrand
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36'
      - name: Build and record result
        shell: bash
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          DEBUG_BUILD: 'true'
        run: |
          set -uo pipefail
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          sed -i 's/signingConfig = signingConfigs.release//g' TMessagesProj/build.gradle
          set +e
          ./gradlew --no-daemon TMessagesProj:assembleDebug > toss-validation.log 2>&1
          STATUS=$?
          set -e
          {
            echo "status=$([ "$STATUS" -eq 0 ] && echo success || echo failure)"
            echo "head=$(git rev-parse HEAD)"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "--- log tail ---"
            tail -n 220 toss-validation.log
          } > .github/toss-validation-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/toss-validation-result.txt
          git commit -m 'Record TOSS validation result'
          git push origin HEAD:agent/toss-play-market-rebrand
          exit "$STATUS"
