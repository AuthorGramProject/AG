name: Repository maintenance audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/repository-maintenance-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build repository audit
        shell: bash
        run: |
          set -euo pipefail
          OUT=repository_maintenance_audit.txt
          {
            echo '===== HEAD ====='
            git rev-parse HEAD
            git log -1 --oneline
            echo
            echo '===== REMOTE BRANCHES ====='
            git ls-remote --heads origin | sort
            echo
            echo '===== WORKFLOWS ====='
            find .github/workflows -maxdepth 1 -type f -print -exec sed -n '1,220p' {} \;
            echo
            echo '===== GRADLE SECURITY ====='
            grep -RInE 'signingConfig|storePassword|keyPassword|KEYSTORE_PASS|ALIAS_PASS|RELEASE_.*PASSWORD|debuggable|applicationIdSuffix|versionNameSuffix|assemble(Debug|Release)' \
              gradle.properties TMessagesProj/build.gradle .github/workflows || true
            echo
            echo '===== MANIFEST SECURITY ====='
            grep -RInE 'allowBackup|restoreAnyVersion|usesCleartextTraffic|allowAudioPlaybackCapture|requestLegacyExternalStorage|preserveLegacyExternalStorage|exported="true"|REQUEST_INSTALL_PACKAGES|SYSTEM_ALERT_WINDOW|READ_CLIPBOARD' \
              TMessagesProj/src/main/AndroidManifest.xml TMessagesProj/src/main/res/xml || true
            echo
            echo '===== AUTHORGRAM CRYPTO ====='
            grep -RInE 'KEY_HEX|MARKER|AuthorGramCrypto|AuthorGramChatKeyStore|6316376597|Cipher\.getInstance|GCMParameterSpec|SecureRandom|Base64\.' \
              TMessagesProj/src/main/java/org/telegram/messenger/authorgram \
              TMessagesProj/src/main/java/org/telegram/messenger/AuthorgramAccessChecker.java || true
            echo
            echo '===== POSSIBLE SECRETS ====='
            git grep -nE '(password|passwd|secret|api[_-]?key|private[_-]?key|KEY_HEX|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' -- \
              ':!*.md' ':!*.json' ':!TMessagesProj/src/main/res/values*' || true
            echo
            echo '===== JAVA/KOTLIN TODO / DANGEROUS CATCHES ====='
            git grep -nE 'catch \((Throwable|Exception)[^)]*\) \{[[:space:]]*\}|catch \((Throwable|Exception)[^)]*\) \{[[:space:]]*//|TODO|FIXME' -- \
              'TMessagesProj/src/main/java/org/telegram/messenger/authorgram/**' \
              'TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java' || true
          } > "$OUT"
          wc -l "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: repository-maintenance-audit
          path: repository_maintenance_audit.txt
          retention-days: 7
