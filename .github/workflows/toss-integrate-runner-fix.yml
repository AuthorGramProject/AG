name: TOSS deterministic integration runner

on:
  push:
    branches: [agent/toss-final]
    paths: ['.github/workflows/toss-integrate-runner-fix.yml']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/toss-final
          fetch-depth: 0
      - name: Run integration payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/toss-integrate-common.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          payload = textwrap.dedent(workflow[start:end])
          payload = payload.replace(
              "SOURCE = 'origin/agent/security-hardening-final'",
              "SOURCE = 'origin/main'",
              1,
          )
          exec(compile(payload, 'toss-integration-payload', 'exec'), {})
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TMessagesProj gradle.properties
          git commit -m 'Integrate current AuthorGram security and per-chat keys into TOSS'
          git push origin HEAD:agent/toss-final
