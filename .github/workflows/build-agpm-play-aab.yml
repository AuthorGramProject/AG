name: Build AG-PM Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-agpm-play-aab
  cancel-in-progress: true

jobs:
  build:
    name: Build public Play source with private signing
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      AGPM_REPOSITORY: AuthorGramProject/AG-PM
      AGPM_COMMIT: 3df4c10a026eedfde16faa91d025a8f724f5df67
      PRIVATE_REPOSITORY: AuthorGramProject/AuthorGram
      HISTORICAL_SIGNING_COMMIT: eaabf4f2c52addfa1fc91d3cb91db6e3ac6e9369
      HISTORICAL_KEYSTORE_BLOB: 5c0f63c668f7ad06ea674560f10ffb256ff2c092
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      PLAY_PACKAGE: toss.authorgram.apk
      VERSION_NAME: 12.9.2
      VERSION_CODE: '6994'
      BUNDLETOOL_VERSION: 1.18.3

    steps:
      - name: Checkout exact public source
        uses: actions/checkout@v4
        with:
          repository: AuthorGramProject/AG-PM
          ref: 3df4c10a026eedfde16faa91d025a8f724f5df67
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore private release inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${LOCAL_PROPERTIES}" || { echo 'LOCAL_PROPERTIES secret is missing' >&2; exit 1; }

          meta="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${PRIVATE_REPOSITORY}/contents/TMessagesProj/release.keystore?ref=${HISTORICAL_SIGNING_COMMIT}")"
          test "$(jq -r '.sha' <<<"${meta}")" = "${HISTORICAL_KEYSTORE_BLOB}"
          jq -r '.content' <<<"${meta}" | tr -d '\n' | base64 --decode > TMessagesProj/release.keystore
          test -s TMessagesProj/release.keystore
          chmod 600 TMessagesProj/release.keystore

          gs="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${PRIVATE_REPOSITORY}/contents/TMessagesProj/google-services.json?ref=play-market")"
          jq -r '.content' <<<"${gs}" | tr -d '\n' | base64 --decode > TMessagesProj/google-services.json
          python3 -m json.tool TMessagesProj/google-services.json >/dev/null

      - name: Validate signing before Android build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import subprocess

          raw = base64.b64decode(os.environ['LOCAL_PROPERTIES'], validate=True).decode('utf-8')
          props = {}
          for line in raw.splitlines():
              line = line.strip()
              if line and not line.startswith('#') and '=' in line:
                  key, value = line.split('=', 1)
                  props[key.strip()] = value.strip()

          required = ('KEYSTORE_PASS', 'ALIAS_NAME', 'ALIAS_PASS')
          missing = [key for key in required if not props.get(key)]
          if missing:
              raise SystemExit('Missing release signing properties: ' + ', '.join(missing))

          result = subprocess.run(
              [
                  'keytool', '-list',
                  '-keystore', 'TMessagesProj/release.keystore',
                  '-storepass', props['KEYSTORE_PASS'],
                  '-alias', props['ALIAS_NAME'],
              ],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )
          if result.returncode != 0:
              raise SystemExit('Private LOCAL_PROPERTIES does not unlock the pinned release keystore/alias')
          print('Pinned release keystore and private signing secret validated')
          PY

      - name: Verify exact public source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${AGPM_COMMIT}"
          grep -q '^APP_PACKAGE=toss.authorgram.apk$' gradle.properties
          grep -q '^APP_VERSION_NAME=12.9.2$' gradle.properties
          grep -q '^APP_VERSION_CODE=6994$' gradle.properties
          ! git grep -n -E 'AyuSpy|SpyDao|SpyMessage(Read|ContentsRead)|SpyLastSeen|spyQueue|SaveReadDate|AyuSpySettings|AGSpySettingsActivity|iOSMessage|IOSMessage|iosInput|isIOSInputStyle' -- ':!*.md'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;36.0.0' 'platforms;android-36' 'ndk;27.2.12479018'
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties

      - name: Build signed release AAB
        shell: bash
        env:
          COMMIT_ID: ${{ env.AGPM_COMMIT }}
          BUILD_TIMESTAMP: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon TMessagesProj:bundleRelease

      - name: Locate and verify AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB="$(find TMessagesProj/build/outputs/bundle -type f -name '*.aab' | head -n 1)"
          test -n "${AAB}" -a -f "${AAB}"
          mkdir -p "${RUNNER_TEMP}/verified-aab"
          cp "${AAB}" "${RUNNER_TEMP}/verified-aab/AuthorGram-Play-12.9.2-6994.aab"
          sha256sum "${RUNNER_TEMP}/verified-aab/AuthorGram-Play-12.9.2-6994.aab" | tee "${RUNNER_TEMP}/verified-aab/SHA256SUMS.txt"

          curl -fsSL -o "${RUNNER_TEMP}/bundletool.jar" "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          java -jar "${RUNNER_TEMP}/bundletool.jar" validate --bundle="${RUNNER_TEMP}/verified-aab/AuthorGram-Play-12.9.2-6994.aab"

          jarsigner -verify -strict -certs "${RUNNER_TEMP}/verified-aab/AuthorGram-Play-12.9.2-6994.aab" >/dev/null
          echo 'Signed AAB validation passed'

      - name: Upload verified AAB
        uses: actions/upload-artifact@v4
        with:
          name: AuthorGram-Play-12.9.2-6994-AAB
          path: ${{ runner.temp }}/verified-aab/
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup private release inputs
        if: always()
        shell: bash
        run: |
          rm -f TMessagesProj/release.keystore TMessagesProj/google-services.json local.properties
