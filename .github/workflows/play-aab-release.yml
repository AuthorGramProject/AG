name: AuthorGram Google Play AAB Release

on:
  workflow_dispatch:
  push:
    branches: [play-market]
    paths:
      - .github/workflows/play-aab-release.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: authorgram-google-play-aab-release
  cancel-in-progress: true

jobs:
  release:
    name: Build one verified Google Play AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PLAY_PACKAGE: toss.authorgram.apk
      VERSION_NAME: 12.9.2
      VERSION_CODE: '6996'
      BUNDLETOOL_VERSION: 1.18.3
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      HISTORICAL_SIGNING_COMMIT: eaabf4f2c52addfa1fc91d3cb91db6e3ac6e9369
      HISTORICAL_KEYSTORE_BLOB: 5c0f63c668f7ad06ea674560f10ffb256ff2c092
      SOURCE_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[source-only]') }}

    steps:
      - name: Checkout Play source
        uses: actions/checkout@v4
        with:
          ref: play-market
          fetch-depth: 1

      - name: Prepare Play source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='')

          def replace_variant(text, variants, new, label):
              if new in text:
                  return text
              matches = [old for old in variants if old in text]
              if len(matches) != 1:
                  raise SystemExit(f'{label}: expected exactly one known variant, found {len(matches)}')
              return text.replace(matches[0], new, 1)

          chat_path = 'TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java'
          chat = read(chat_path)

          # Play-forbidden Ghost Mode stays absent.
          import_line = 'import tw.nekomimi.nekogram.menu.ghostmode.GhostModeExclusionPopupWrapper;\n'
          if import_line in chat:
              chat = chat.replace(import_line, '', 1)

          declaration = '        boolean showGhostMode = !ChatObject.isChannelAndNotMegaGroup(currentChat);\n'
          if declaration in chat:
              chat = chat.replace(declaration, '', 1)

          old_guard = '        if (!showGhostMode && !showSaveDeleted && !showRegexFilters && !showViewDeleted && !showClearDeleted) {\n'
          new_guard = '        if (!showSaveDeleted && !showRegexFilters && !showViewDeleted && !showClearDeleted) {\n'
          if old_guard in chat:
              chat = chat.replace(old_guard, new_guard, 1)
          elif new_guard not in chat:
              raise SystemExit('Message Filters submenu guard is missing')

          if 'if (showGhostMode) {' in chat:
              ghost_block = re.compile(
                  r'\n        if \(showGhostMode\) \{\n.*?\n        \}\n\n        if \(showSaveDeleted\) \{',
                  re.DOTALL,
              )
              chat, count = ghost_block.subn('\n        if (showSaveDeleted) {', chat, count=1)
              if count != 1:
                  raise SystemExit(f'Ghost Mode block: expected 1 occurrence, found {count}')

          old_filters = '        boolean showRegexFilters = NaConfig.INSTANCE.getRegexFiltersEnabled().Bool();'
          new_filters = '        boolean showRegexFilters = true;'
          if old_filters in chat:
              chat = chat.replace(old_filters, new_filters, 1)
          elif new_filters not in chat:
              raise SystemExit('Message Filters visibility marker is missing')

          old_root = '        headerItem.lazilyAddSwipeBackItem(R.drawable.msg2_reactions2, null, getString(R.string.AyuGramMenu), ayuLayout);'
          new_root = '        headerItem.lazilyAddSwipeBackItem(R.drawable.hide_title, null, getString(R.string.RegexFilters), ayuLayout);'
          if old_root in chat:
              chat = chat.replace(old_root, new_root, 1)
          elif new_root not in chat:
              raise SystemExit('Message Filters root menu marker is missing')

          # Exact Main/Dev behavior: CenterActionBarTitle never changes any ChatActivity
          # geometry. This controls avatar/header margins, call/search icons, overflow and
          # headerItem.forceHidden, not only the visual title position.
          if 'AUTHORGRAM_NATIVE_CHAT_HEADER' not in chat:
              centered_pattern = re.compile(
                  r'    private boolean canShowCenteredTitle\(ChatActivity parentFragment\) \{\n.*?\n    \}\n\n    public MessageObject getMessageForTranslate\(\) \{',
                  re.DOTALL,
              )
              replacement = (
                  '    private boolean canShowCenteredTitle(ChatActivity parentFragment) {\n'
                  '        // AUTHORGRAM_NATIVE_CHAT_HEADER: chats always keep Telegram\'s native header geometry.\n'
                  '        return false;\n'
                  '    }\n\n'
                  '    public MessageObject getMessageForTranslate() {'
              )
              chat, count = centered_pattern.subn(replacement, chat, count=1)
              if count != 1:
                  raise SystemExit(f'Native chat header method: expected 1 occurrence, found {count}')

          # Deliberately do not modify AuthorGram/NekoX settings-import suffix handling here.
          write(chat_path, chat)

          # Keep the ActionBar-level guard too, matching the proven standard-header repair.
          action_path = 'TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ActionBar.java'
          action = read(action_path)
          desired_action = (
              '    private boolean isCentered() {\n'
              '        // AUTHORGRAM_STANDARD_CHAT_HEADER\n'
              '        // ChatActivity always uses Telegram\'s ordinary non-centered header.\n'
              '        if (parentFragment instanceof org.telegram.ui.ChatActivity) {\n'
              '            return false;\n'
              '        }\n'
              '        return NaConfig.INSTANCE.getCenterActionBarTitle().Bool();\n'
              '    }'
          )
          action = replace_variant(
              action,
              [
                  '    private boolean isCentered() {\n        return NaConfig.INSTANCE.getCenterActionBarTitle().Bool();\n    }',
                  '    private boolean isCentered() {\n        return !(parentFragment instanceof org.telegram.ui.ChatActivity)\n                && NaConfig.INSTANCE.getCenterActionBarTitle().Bool();\n    }',
              ],
              desired_action,
              'ActionBar native chat header guard'
          )
          write(action_path, action)

          ghost_wrapper = Path('TMessagesProj/src/main/java/tw/nekomimi/nekogram/menu/ghostmode/GhostModeExclusionPopupWrapper.java')
          if ghost_wrapper.is_file():
              ghost_wrapper.unlink()
          PY

          [[ "$(sed -n 's/^APP_PACKAGE=//p' gradle.properties)" == "${PLAY_PACKAGE}" ]]
          [[ "$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)" == "${VERSION_NAME}" ]]
          [[ "$(sed -n 's/^APP_VERSION_CODE=//p' gradle.properties)" == "${VERSION_CODE}" ]]

          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("TMessagesProj/google-services.json").read_text(encoding="utf-8"))
          assert config["project_info"]["project_id"] == "authorgram-81696"
          assert config["project_info"]["project_number"] == "992278926997"
          packages = {
              client["client_info"]["android_client_info"]["package_name"]
              for client in config["client"]
          }
          assert "toss.authorgram.apk" in packages
          PY
          ! grep -Fq 'prepareAuthorGramNoFirebaseSources' build.gradle
          ! grep -Fq 'instance = new DummyPushProvider();' build.gradle
          grep -Fq 'instance = new GooglePushListenerServiceProvider();' TMessagesProj/src/main/java/org/telegram/messenger/PushListenerController.java
          grep -Fq 'ApplicationLoader.startPushServiceFallback();' TMessagesProj/src/main/java/org/telegram/messenger/GooglePushListenerServiceProvider.java
          grep -Fq 'PendingIntent.getForegroundService' TMessagesProj/src/main/java/org/telegram/messenger/ApplicationLoader.java
          grep -Fq 'FOREGROUND_SERVICE_REMOTE_MESSAGING' TMessagesProj/src/main/AndroidManifest.xml
          grep -Fq 'android:foregroundServiceType="remoteMessaging"' TMessagesProj/src/main/AndroidManifest.xml
          grep -Fq 'FOREGROUND_SERVICE_PHONE_CALL' TMessagesProj/src/main/AndroidManifest.xml
          grep -Fq 'FOREGROUND_SERVICE_TYPE_PHONE_CALL' TMessagesProj/src/main/java/org/telegram/messenger/voip/VoIPService.java
          grep -Fq 'keeping the call and using notification fallback' TMessagesProj/src/main/java/org/telegram/messenger/voip/VoIPPreNotificationService.java

          grep -Fq 'compileSdk = 36' build.gradle
          grep -Fq 'targetSdk = 36' build.gradle
          grep -Fq "implementation 'com.android.billingclient:billing:8.2.1'" TMessagesProj/build.gradle
          grep -Fq "def telegramAdBlockingEnabled = APP_PACKAGE != 'toss.authorgram.apk'" TMessagesProj/build.gradle
          grep -Fq "def authorGramSystemKeyHex = ''" TMessagesProj/build.gradle
          grep -Fq "def authorGramInstallPackagesPermission = APP_PACKAGE == 'toss.authorgram.apk' ? 'android.permission.INTERNET' : 'android.permission.REQUEST_INSTALL_PACKAGES'" TMessagesProj/build.gradle
          grep -Fq "def camerax_version = '1.5.3'" TMessagesProj/build.gradle
          test -f TMessagesProj/src/main/java/toss/authorgram/camera/AuthorGramCameraConfig.java
          test -f TMessagesProj/src/main/java/toss/authorgram/camera/AuthorGramCameraXController.java
          test -f TMessagesProj/src/main/java/toss/authorgram/settings/AGCameraSettingsActivity.java
          grep -Fq 'cameraThread.updateCameraXScale();' TMessagesProj/src/main/java/org/telegram/ui/Components/InstantCameraView.java
          grep -Fq 'private final int DO_UPDATE_CAMERAX_SCALE = 5;' TMessagesProj/src/main/java/org/telegram/ui/Components/InstantCameraView.java
          grep -Fq 'presentFragment(new AGCameraSettingsActivity());' TMessagesProj/src/main/java/toss/authorgram/settings/AGSettingsActivity.java
          grep -Fq 'mainconfig.add("AG_CameraType");' TMessagesProj/src/main/java/tw/nekomimi/nekogram/helpers/SettingsBackupHelper.java

          POLICY='TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramPlayPolicy.java'
          grep -Fq 'values.put("hideSponsoredMessage", false);' "${POLICY}"
          grep -Fq 'values.put("HideProxySponsorChannel", false);' "${POLICY}"
          grep -Fq 'values.put("localPremium", false);' "${POLICY}"
          grep -Fq 'values.put("EnableSaveDeletedMessages", false);' "${POLICY}"
          grep -Fq 'values.put("ignoreContentRestrictions", false);' "${POLICY}"
          grep -Fq 'values.put("iOSMessageInputField", false);' "${POLICY}"
          grep -Fq 'values.put("iOSMessageMenu", false);' "${POLICY}"
          ! grep -Fq 'public static boolean canUseIosInput()' "${POLICY}"

          grep -Fq 'AUTHORGRAM_NATIVE_CHAT_HEADER' TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java
          grep -Fq 'private boolean canShowCenteredTitle(ChatActivity parentFragment)' TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java
          grep -Fq 'AUTHORGRAM_STANDARD_CHAT_HEADER' TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ActionBar.java
          grep -Fq 'parentFragment instanceof org.telegram.ui.ChatActivity' TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ActionBar.java
          grep -Fq 'boolean showRegexFilters = true;' TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java
          grep -Fq 'getString(R.string.RegexFilters), ayuLayout' TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java
          ! grep -Fq 'GhostModeExclusionPopupWrapper' TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java
          ! grep -Fq 'showGhostMode' TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java
          test ! -e TMessagesProj/src/main/java/tw/nekomimi/nekogram/menu/ghostmode/GhostModeExclusionPopupWrapper.java

          # Play contains no selectable iOS-input path: the old branch-specific helper is
          # gone, the animated icon follows the Main-only iOS UI gate, and the settings
          # screen never creates the composer toggle.
          grep -Fq 'AuthorGramPlayPolicy.canUseIosUi()' TMessagesProj/src/main/java/org/telegram/ui/Components/ChatActivityEnterViewAnimatedIconView.java
          grep -Fq 'Google Play always uses Telegram' TMessagesProj/src/main/java/toss/authorgram/settings/AGChatSettingsActivity.java
          ! grep -Fq 'AuthorGramPlayPolicy.canUseIosInput()' TMessagesProj/src/main/java

          grep -Fq '? BuildConfig.OFFICIAL_BUILD' TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramAuthorBadge.java
          python3 scripts/verify_authorgram_badge_tokens.py
          git diff --check

      - name: Persist Play source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AuthorGram Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Play source already contains all requested source invariants.'
          else
            git diff --cached --check
            git commit -m '[skip ci] Play: use native Telegram chat header'
            git push origin HEAD:play-market
          fi

      - name: Source-only completion
        if: env.SOURCE_ONLY == 'true'
        shell: bash
        run: |
          echo 'Source-only repair completed. Android SDK, Gradle build, signing restore and AAB upload are intentionally skipped.'

      - name: Set up Java 21
        if: env.SOURCE_ONLY != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: env.SOURCE_ONLY != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        if: env.SOURCE_ONLY != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36'

      - name: Restore AuthorGram release signing key
        if: env.SOURCE_ONLY != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f TMessagesProj/release.keystore
          meta="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/contents/TMessagesProj/release.keystore?ref=${HISTORICAL_SIGNING_COMMIT}")"
          [[ "$(jq -r '.sha' <<<"${meta}")" == "${HISTORICAL_KEYSTORE_BLOB}" ]]
          jq -r '.content' <<<"${meta}" | tr -d '\n' | base64 --decode > TMessagesProj/release.keystore
          test -s TMessagesProj/release.keystore
          chmod 600 TMessagesProj/release.keystore
          [[ -n "${LOCAL_PROPERTIES}" ]] || { echo 'LOCAL_PROPERTIES secret is missing' >&2; exit 1; }
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties

      - name: Build signed Google Play release AAB
        if: env.SOURCE_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          NATIVE_TARGET='' ./gradlew --no-daemon --stacktrace --console=plain TMessagesProj:bundleRelease

      - name: Verify and stage the single Play AAB
        if: env.SOURCE_ONLY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/authorgram-play-release"
          mkdir -p "${OUT}"

          mapfile -t bundles < <(find TMessagesProj/build/outputs/bundle -type f -name '*.aab' | sort)
          if [[ ${#bundles[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one AAB, found ${#bundles[@]}"
            printf '%s\n' "${bundles[@]:-}"
            exit 1
          fi
          AAB="${bundles[0]}"

          BUNDLETOOL="${RUNNER_TEMP}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "${BUNDLETOOL}"
          test -s "${BUNDLETOOL}"
          java -jar "${BUNDLETOOL}" validate --bundle="${AAB}"

          MANIFEST="${RUNNER_TEMP}/AuthorGram-Play-AndroidManifest.xml"
          java -jar "${BUNDLETOOL}" dump manifest --bundle="${AAB}" --module=base > "${MANIFEST}"
          grep -Fq "package=\"${PLAY_PACKAGE}\"" "${MANIFEST}"
          grep -Fq "android:versionCode=\"${VERSION_CODE}\"" "${MANIFEST}"
          grep -Fq "android:versionName=\"${VERSION_NAME}\"" "${MANIFEST}"
          grep -Fq 'android:targetSdkVersion="36"' "${MANIFEST}"
          grep -Fq 'com.android.vending.BILLING' "${MANIFEST}"
          ! grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' "${MANIFEST}"

          CONTENTS="${RUNNER_TEMP}/AuthorGram-Play-AAB-contents.txt"
          unzip -Z1 "${AAB}" > "${CONTENTS}"
          grep -Eq '^base/lib/arm64-v8a/' "${CONTENTS}"
          grep -Eq '^base/lib/armeabi-v7a/' "${CONTENTS}"
          grep -Eq '^base/lib/x86_64/' "${CONTENTS}"
          if grep -Eqi '(^|/)(release\.keystore|[^/]*\.jks|[^/]*\.p12|[^/]*\.pfx)$' "${CONTENTS}"; then
            echo '::error::Signing material was packaged into the AAB'
            exit 1
          fi

          jarsigner -verify -verbose -certs "${AAB}" > "${RUNNER_TEMP}/AuthorGram-Play-jarsigner.txt" 2>&1

          DEST="${OUT}/AuthorGram-Play-v${VERSION_NAME}-${VERSION_CODE}-release.aab"
          cp "${AAB}" "${DEST}"
          test -s "${DEST}"
          sha256sum "${DEST}"

      - name: Upload Google Play release AAB
        if: env.SOURCE_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AuthorGram-Play-12.9.2-6996-Google-Play-AAB
          path: ${{ runner.temp }}/authorgram-play-release/AuthorGram-Play-v12.9.2-6996-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material from runner
        if: ${{ always() && env.SOURCE_ONLY != 'true' }}
        shell: bash
        run: rm -f TMessagesProj/release.keystore local.properties
