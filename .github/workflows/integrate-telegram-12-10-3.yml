name: Integrate Telegram 12.10.3 into AuthorGram

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          submodules: false

      - name: Skip if already integrated
        id: version
        shell: bash
        run: |
          if grep -q "^APP_VERSION_NAME=12.10.3$" gradle.properties && grep -q "^APP_VERSION_CODE=7089$" gradle.properties; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply official Telegram 12.10.3 app-layer delta
        if: steps.version.outputs.done != 'true'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "AuthorGram Upstream Integrator"
          git config user.email "actions@github.com"

          git remote remove telegram-upstream 2>/dev/null || true
          git remote add telegram-upstream https://github.com/DrKLO/Telegram.git
          git fetch --no-tags telegram-upstream \
            62b56a07ca7e30e39f7fd00a6728d6bbd716ca1c \
            9552e5541e1274b9557c9832b204dbfcaf44b3dc

          git diff --binary --full-index \
            62b56a07ca7e30e39f7fd00a6728d6bbd716ca1c \
            9552e5541e1274b9557c9832b204dbfcaf44b3dc \
            -- \
            TMessagesProj/src/main/java \
            TMessagesProj/src/main/kotlin \
            TMessagesProj/src/main/res \
            TMessagesProj/src/main/assets \
            TMessagesProj/proguard-rules.pro \
            ':(exclude)TMessagesProj/src/main/java/com/google/android/exoplayer2/**' \
            ':(exclude)TMessagesProj/src/main/java/androidx/media3/**' \
            > /tmp/telegram-12.10.3-app.patch

          echo "::group::Official app-layer delta"
          git diff --stat 62b56a07ca7e30e39f7fd00a6728d6bbd716ca1c 9552e5541e1274b9557c9832b204dbfcaf44b3dc -- \
            TMessagesProj/src/main/java TMessagesProj/src/main/kotlin TMessagesProj/src/main/res TMessagesProj/src/main/assets TMessagesProj/proguard-rules.pro \
            ':(exclude)TMessagesProj/src/main/java/com/google/android/exoplayer2/**' \
            ':(exclude)TMessagesProj/src/main/java/androidx/media3/**'
          echo "::endgroup::"

          set +e
          git apply --3way --index /tmp/telegram-12.10.3-app.patch
          APPLY_STATUS=$?
          set -e

          if [ "$APPLY_STATUS" -ne 0 ]; then
            echo "::group::App-layer conflict paths"
            git diff --name-only --diff-filter=U || true
            echo "::endgroup::"
            echo "::group::Conflict context"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              echo "===== $file ====="
              git diff --cc -- "$file" || true
            done < <(git diff --name-only --diff-filter=U)
            echo "::endgroup::"
            exit "$APPLY_STATUS"
          fi

          python3 - <<'PY'
          from pathlib import Path
          p = Path("gradle.properties")
          text = p.read_text(encoding="utf-8")
          out = []
          for line in text.splitlines():
              if line.startswith("APP_VERSION_CODE="):
                  line = "APP_VERSION_CODE=7089"
              elif line.startswith("APP_VERSION_NAME="):
                  line = "APP_VERSION_NAME=12.10.3"
              out.append(line)
          p.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

          git add -A
          git commit -m "Port Telegram 12.10.3 (7089) app layer"
          git push origin HEAD:"$HEAD_BRANCH"
