name: One-shot Play source cleanup

on:
  push:
    branches:
      - play-market
    paths:
      - .github/workflows/play-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Play source
        uses: actions/checkout@v4
        with:
          ref: play-market
          fetch-depth: 0

      - name: Apply and validate permanent Play cleanup
        run: python3 .github/play_cleanup_once.py

      - name: Commit clean Play source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AuthorGram Play Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(play): restore clean Play source and preserve badge spacing"
          git push origin HEAD:play-market
