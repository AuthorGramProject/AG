name: One-shot Play source cleanup

on:
  push:
    branches:
      - play-market
    paths:
      - .github/workflows/play-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Play source
        uses: actions/checkout@v4
        with:
          ref: play-market
          fetch-depth: 1

      - name: Audit remaining dev-only option handlers
        run: python3 .github/play_cleanup_diag.py

      # Temporary diagnostics pass 3; deleted by the final cleanup commit.
