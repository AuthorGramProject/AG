name: AuthorGram Play ARM64 One-Time Release

on:
  push:
    branches: [play-market]
    paths:
      - .github/workflows/play-arm64-once.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: authorgram-play-arm64-once
  cancel-in-progress: false

jobs:
  release:
    name: Build verified Play ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PLAY_PACKAGE: toss.authorgram.apk
      VERSION_NAME: 12.9.2
      VERSION_CODE: '6991'
      NATIVE_TARGET: arm64-v8a
      LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
      AUTHORGRAM_SIGNING_CERT_SHA256: ${{ secrets.AUTHORGRAM_SIGNING_CERT_SHA256 }}
      HISTORICAL_SIGNING_COMMIT: eaabf4f2c52addfa1fc91d3cb91db6e3ac6e9369
      HISTORICAL_KEY_BLOB: 5c0f63c668f7ad06ea674560f10ffb256ff2c092

    steps:
      - name: Checkout Play source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Validate Play identity and encryption baseline
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(sed -n 's/^APP_PACKAGE=//p' gradle.properties)" == "${PLAY_PACKAGE}" ]]
          [[ "$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties)" == "${VERSION_NAME}" ]]
          [[ "$(sed -n 's/^APP_VERSION_CODE=//p' gradle.properties)" == "${VERSION_CODE}" ]]

          grep -Fq "def authorGramSystemKeyHex = ''" TMessagesProj/build.gradle
          ! grep -Fq '6b8ce70d889daed80852c204106d51bf91f114ad32936b6b17068e7b399ef3fa' TMessagesProj/build.gradle
          grep -Fq 'public static void show(' TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramKeyDialog.java
          grep -Fq 'PREFERENCES_NAME = "authorgram_crypto"' TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramChatState.java
          grep -Fq 'Cipher.ENCRYPT_MODE' TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramChatCrypto.java
          grep -Fq 'AuthorGramChatCrypto.encryptText' TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramCryptoInterceptor.java
          grep -Fq 'AuthorGramKeyDialog.show(' TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java
          grep -Fq 'return !isEncryptionForbidden(dialogId);' TMessagesProj/src/main/java/org/telegram/messenger/authorgram/AuthorGramPlayPolicy.java

          test ! -e TMessagesProj/src/main/java/com/radolyn/ayugram/proprietary/AyuHistoryHook.java
          test ! -e TMessagesProj/src/main/java/com/radolyn/ayugram/ui/AyuMessageHistory.java
          test ! -e TMessagesProj/src/main/java/com/radolyn/ayugram/ui/AyuViewDeleted.java
          git diff --check

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36'

      - name: Restore existing AuthorGram signing key in runner only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e TMessagesProj/release.keystore
          META="$(gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/contents/TMessagesProj/release.keystore?ref=${HISTORICAL_SIGNING_COMMIT}")"
          [[ "$(jq -r '.sha' <<<"${META}")" == "${HISTORICAL_KEY_BLOB}" ]]
          jq -r '.content' <<<"${META}" | tr -d '\n' | base64 --decode > TMessagesProj/release.keystore
          test -s TMessagesProj/release.keystore
          chmod 600 TMessagesProj/release.keystore

      - name: Compile Play Java source
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${LOCAL_PROPERTIES}" ]] || { echo 'LOCAL_PROPERTIES secret is missing' >&2; exit 1; }
          printf 'sdk.dir=%s\n' "${ANDROID_HOME}" > local.properties
          NATIVE_TARGET=SKIP ./gradlew --no-daemon --stacktrace TMessagesProj:compileReleaseJavaWithJavac

      - name: Build Play ARM64 release APK
        shell: bash
        run: |
          set -euo pipefail
          NATIVE_TARGET=arm64-v8a ./gradlew --no-daemon --stacktrace TMessagesProj:assembleRelease

      - name: Verify and package Play ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/authorgram-play-arm64"
          python3 - <<'PY' > "${RUNNER_TEMP}/apk_path.txt"
          import json
          from pathlib import Path
          root = Path('TMessagesProj/build/outputs/apk')
          matches = []
          for metadata in root.rglob('output-metadata.json'):
              data = json.loads(metadata.read_text(encoding='utf-8'))
              for element in data.get('elements', []):
                  output = element.get('outputFile', '')
                  filters = element.get('filters') or []
                  abis = [item.get('value') for item in filters if item.get('filterType') == 'ABI']
                  candidate = (metadata.parent / output).resolve()
                  if candidate.is_file() and ('arm64-v8a' in abis or 'arm64-v8a' in output) and 'debug' not in candidate.name.lower():
                      matches.append(candidate)
          unique = sorted(set(matches))
          if len(unique) != 1:
              raise SystemExit(f'Expected exactly one arm64 release APK, found {len(unique)}: {unique}')
          print(unique[0])
          PY

          APK="$(cat "${RUNNER_TEMP}/apk_path.txt")"
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          ZIPALIGN="${ANDROID_HOME}/build-tools/36.0.0/zipalign"
          BADGING="$(${AAPT} dump badging "${APK}")"
          grep -Fq "package: name='${PLAY_PACKAGE}'" <<<"${BADGING}"
          grep -Fq "versionCode='${VERSION_CODE}'" <<<"${BADGING}"
          grep -Fq "versionName='${VERSION_NAME}'" <<<"${BADGING}"
          ! grep -q '^application-debuggable' <<<"${BADGING}"

          PERMISSIONS="$(${AAPT} dump permissions "${APK}")"
          ! grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' <<<"${PERMISSIONS}"
          "${ZIPALIGN}" -c -P 16 4 "${APK}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK}" | tee "${RUNNER_TEMP}/authorgram-play-arm64/CERTIFICATE.txt"

          if unzip -Z1 "${APK}" | grep -Eqi '(^|/)(release\.keystore|[^/]*\.jks|[^/]*\.p12|[^/]*\.pfx)$'; then
            echo 'Signing material was packaged into APK' >&2
            exit 1
          fi
          if find TMessagesProj/build -type f -name '*.aab' -print -quit | grep -q .; then
            echo 'Unexpected AAB artifact found' >&2
            exit 1
          fi

          DEST="${RUNNER_TEMP}/authorgram-play-arm64/AuthorGram-Play-v${VERSION_NAME}-release-arm64-v8a.apk"
          cp "${APK}" "${DEST}"
          (cd "${RUNNER_TEMP}/authorgram-play-arm64" && sha256sum "$(basename "${DEST}")" > SHA256SUMS.txt)
          cat > "${RUNNER_TEMP}/authorgram-play-arm64/BUILD.txt" <<EOF
          branch=play-market
          sourceCommit=${GITHUB_SHA}
          package=${PLAY_PACKAGE}
          versionName=${VERSION_NAME}
          versionCode=${VERSION_CODE}
          abi=arm64-v8a
          buildType=release
          systemKey=absent
          signingKeySourceCommit=${HISTORICAL_SIGNING_COMMIT}
          EOF

      - name: Upload Play ARM64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: AuthorGram-Play-12.9.2-ARM64-Release
          path: ${{ runner.temp }}/authorgram-play-arm64/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing key from runner
        if: always()
        shell: bash
        run: rm -f TMessagesProj/release.keystore local.properties
