name: Integrate Telegram 12.10.3

on:
  workflow_dispatch:
  push:
    branches:
      - integrate-tg-12-10-2
    paths:
      - .github/workflows/integrate-telegram-12-10-2.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout AuthorGram integration branch
        uses: actions/checkout@v4
        with:
          ref: integrate-tg-12-10-2
          fetch-depth: 0
          submodules: false

      - name: Three-way merge Telegram 12.10.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AuthorGram Upstream Integrator"
          git config user.email "actions@github.com"

          git remote remove telegram-upstream 2>/dev/null || true
          git remote add telegram-upstream https://github.com/DrKLO/Telegram.git

          git fetch --no-tags telegram-upstream             62b56a07ca7e30e39f7fd00a6728d6bbd716ca1c:refs/remotes/telegram-upstream/base-12.10.1             9552e5541e1274b9557c9832b204dbfcaf44b3dc:refs/remotes/telegram-upstream/tg-12.10.3

          BASE_TREE="$(git rev-parse refs/remotes/telegram-upstream/base-12.10.1^{tree})"
          OURS_TREE="$(git rev-parse HEAD^{tree})"
          THEIRS_TREE="$(git rev-parse refs/remotes/telegram-upstream/tg-12.10.3^{tree})"

          echo "Base tree:   $BASE_TREE"
          echo "AuthorGram:  $OURS_TREE"
          echo "Telegram:    $THEIRS_TREE"

          git read-tree -m -u "$BASE_TREE" "$OURS_TREE" "$THEIRS_TREE"

          mapfile -t CONFLICTS < <(git ls-files -u | awk '{print $4}' | sort -u)
          if [ "${#CONFLICTS[@]}" -gt 0 ]; then
            git checkout --conflict=merge -- . || true

            echo "::group::Three-way conflict paths"
            printf '%s\n' "${CONFLICTS[@]}"
            echo "::endgroup::"

            echo "::group::Conflict markers and context"
            for file in "${CONFLICTS[@]}"; do
              echo "===== $file ====="
              if [ -f "$file" ]; then
                grep -n -B 25 -A 35 -E '^(<<<<<<<|=======|>>>>>>>)' "$file" || true
              else
                git ls-files -u -- "$file" || true
              fi
            done
            echo "::endgroup::"

            echo "THREE_WAY_CONFLICT_COUNT=${#CONFLICTS[@]}" >> "$GITHUB_ENV"
            exit 2
          fi

          python3 - <<'PY'
          from pathlib import Path
          p = Path("gradle.properties")
          text = p.read_text(encoding="utf-8")
          out = []
          for line in text.splitlines():
              if line.startswith("APP_VERSION_CODE="):
                  line = "APP_VERSION_CODE=7089"
              elif line.startswith("APP_VERSION_NAME="):
                  line = "APP_VERSION_NAME=12.10.3"
              out.append(line)
          p.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

          git add -A

          if git diff --cached --quiet; then
            echo "No upstream changes detected"
            exit 0
          fi

          echo "::group::Merged Telegram 12.10.3 summary"
          git diff --cached --stat
          echo "::endgroup::"

          git commit -m "Merge Telegram 12.10.3 (7089) upstream"
          git push origin HEAD:integrate-tg-12-10-2
