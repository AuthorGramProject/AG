import java.nio.file.Paths
import org.gradle.internal.os.OperatingSystem

plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

// ---------------------------------------------------------------------------
// Automatic versioning — fully configuration-cache-safe.
// Nothing in this block should ever be edited manually.
//
// External processes are run via providers.exec {} (Gradle's supported API
// for configuration-cache-compatible process execution).  On CI every value
// is injected as an environment variable by the workflow so no git subprocess
// is needed at all during CI builds.
// ---------------------------------------------------------------------------

/** Run a git command and return trimmed stdout, or null on any failure. */
def gitOutput = { List<String> cmd ->
    try {
        def result = providers.exec {
            commandLine cmd
            workingDir rootProject.projectDir
            ignoreExitValue = true
        }
        result.result.get().exitValue == 0
                ? result.standardOutput.asText.get().trim()
                : null
    } catch (ignored) { null }
}

// versionCode — CI passes VERSION_CODE (computed by the workflow).
// Local builds try git; when git is unavailable (e.g. Android Studio without git in PATH),
// fall back to an epoch-minute counter so the value still auto-increments per build.
def epochMinutes = (System.currentTimeMillis() / 60000L) as long
def computedVersionCode = (
        System.getenv('VERSION_CODE')?.toInteger()
        ?: gitOutput(['git', 'rev-list', '--count', 'HEAD'])?.toInteger()
        ?: (epochMinutes % Integer.MAX_VALUE) as int
)

// Short SHA — CI passes COMMIT_ID; local builds ask git; fallback to a stable
// pseudo id derived from the version code so versionName is never stuck.
def shortSha = (
        System.getenv('COMMIT_ID')?.take(7)
        ?: gitOutput(['git', 'rev-parse', '--short=7', 'HEAD'])
        ?: ("t" + Integer.toString(computedVersionCode, 36)).take(7)
)

// Dirty-tree detection — skipped entirely on CI (always a clean checkout).
// The "dev+" suffix helps distinguish local test builds at a glance.
def isDirty = !System.getenv('CI') &&
        ((gitOutput(['git', 'status', '--porcelain'])?.length() ?: 0) > 0)

// Auto-derive the patch component of the human-readable version from the
// versionCode (commit count on CI, epoch-minutes fallback locally). This ensures
// the visible version (e.g. "2.12.65") changes automatically on each build.
// APP_VERSION_NAME is treated as a MAJOR.MINOR prefix; only the first two
// segments are used.
def baseSegments = APP_VERSION_NAME.tokenize('.')
def baseMajorMinor = baseSegments.size() >= 2
        ? "${baseSegments[0]}.${baseSegments[1]}"
        : APP_VERSION_NAME
def autoBaseVersion = "${baseMajorMinor}.${computedVersionCode}"

// Full version name:
//   <auto-base>-<sha>       — CI / clean local tree   (e.g. 2.12.65-abc1234)
//   <auto-base>-dev+<sha>   — dirty local working tree
//   <auto-base>-<pseudo>    — when git is unavailable locally
def verName = isDirty ? "${autoBaseVersion}-dev+${shortSha}" : "${autoBaseVersion}-${shortSha}"

def verCode = computedVersionCode

// ---------------------------------------------------------------------------
// Changelog file auto-generation
//
// Naming convention: documentations/changelogs/changelog-<verName>-<verCode>.md
// (e.g. changelog-1.0.42-abc1234-42.md). The build creates a stub for the
// current version if none exists, so contributors only need to edit content.
// The file lives outside the APK (assets are no longer used for changelogs);
// the About screen fetches the latest changelog directly from GitHub.
// ---------------------------------------------------------------------------
// Capture all Gradle-script values at configuration time into plain locals so
// the doLast{} closure remains compatible with the Gradle configuration cache
// (which forbids accessing 'rootProject', 'project', etc. at execution time).
def rootDirCC = rootProject.projectDir
def changelogDir = new File(rootDirCC, "documentations/changelogs")
def changelogFile = new File(changelogDir, "changelog-${verName}-${verCode}.md")
def changelogVerName = verName
def changelogVerCode = verCode
def changelogIndexFile = new File(changelogDir, "CHANGELOG.md")
def commitMessageFile = new File(changelogDir, "COMMIT_MESSAGE.txt")

tasks.register("generateChangelogStub") {
    description = "Create a stub changelog file for the current build if missing."
    group = "build"
    // Make the task itself cache-friendly: declare the output so Gradle can
    // skip it when up-to-date, and avoid touching project/rootProject inside
    // doLast{}.
    outputs.file(changelogFile)
    outputs.upToDateWhen { changelogFile.exists() }
    doLast {
        if (!changelogDir.exists()) {
            changelogDir.mkdirs()
        }
        if (!changelogFile.exists()) {
            def stub = """# Nagram Extera ${changelogVerName}

_Build code: ${changelogVerCode}_

## What's New

- _(add release notes here before tagging this build)_
"""
            changelogFile.text = stub
            // Compute the path relative to the captured root dir without
            // touching any Gradle script objects at execution time.
            def relPath = rootDirCC.toPath().relativize(changelogFile.toPath()).toString()
            println("Generated changelog stub: ${relPath}")
        }
    }
}

tasks.register("generateChangelogIndex") {
    description = "Generate a full aggregated CHANGELOG.md from changelog-*.md files."
    group = "build"
    outputs.file(changelogIndexFile)
    doLast {
        if (!changelogDir.exists()) {
            changelogDir.mkdirs()
        }

        // Collect all versioned changelog files and sort by trailing version code ascending.
        def files = changelogDir.listFiles()?.findAll { f ->
            f.isFile() && f.name.toLowerCase().startsWith("changelog-") && f.name.toLowerCase().endsWith(".md")
        } ?: []

        def extractTrailingNumber = { String name ->
            def trimmed = name.toLowerCase().endsWith(".md") ? name.substring(0, name.length() - 3) : name
            def m = (trimmed =~ /(\\d+)$/)
            if (m.find()) {
                try { return Long.parseLong(m.group(1)) } catch (ignored) { }
            }
            return -1L
        }

        files.sort { a, b ->
            long ca = extractTrailingNumber(a.name)
            long cb = extractTrailingNumber(b.name)
            if (ca != cb) return ca <=> cb
            return a.name.toLowerCase() <=> b.name.toLowerCase()
        }

        def sb = new StringBuilder()
        sb.append("# Changelog\n\n")
        sb.append("All notable changes to this project will be documented in this file.\n\n")
        sb.append("## [Unreleased]\n\n")
        sb.append("- _(changes go into the per-build changelog files: changelog-<versionName>-<versionCode>.md)_\n\n")

        // Append each per-build changelog as a release section in reverse chronological order.
        def releases = files.reverse()
        releases.each { f ->
            def content = f.getText("UTF-8")?.trim()
            if (content == null || content.isEmpty()) return

            // Derive a display version from the filename when possible.
            // Format: changelog-<verName>-<verCode>.md
            def base = f.name.substring(0, f.name.length() - 3)
            def display = base.startsWith("changelog-") ? base.substring("changelog-".length()) : base

            sb.append("## [").append(display).append("]\n\n")
            sb.append(content).append("\n\n")
        }

        changelogIndexFile.text = sb.toString()
    }
}

tasks.register("generateCommitMessageTemplate") {
    description = "Generate a suggested commit message template for the current build."
    group = "build"
    outputs.file(commitMessageFile)
    doLast {
        if (!changelogDir.exists()) {
            changelogDir.mkdirs()
        }
        def msg = """feat(nagram-extera): ${changelogVerName} (${changelogVerCode})

- Auto versioning + release workflow versionCode bump per run.
- GitHub changelog fetch + in-app Markdown rendering.
- Security/build hygiene (no hardcoded keys, cleartext off, debug keystore).
- UI blur/Liquid Glass precedence + recent chats sidebar refresh.
- Message menu scrollable + optional top action bar + settings toggles.
- Settings categories cleanup + localization sweep.
- CI/release workflows concurrency cancel-in-progress.
"""
        commitMessageFile.text = msg
    }
}

afterEvaluate {
    tasks.matching { it.name == "preBuild" }.configureEach {
        dependsOn("generateChangelogStub")
        dependsOn("generateChangelogIndex")
        dependsOn("generateCommitMessageTemplate")
    }
}

// Upstream Telegram reference — for display only (About screen).
def officialVer  = TELEGRAM_VERSION_NAME
def officialCode = TELEGRAM_VERSION_CODE

// Build timestamp — CI sets BUILD_TIMESTAMP; local builds use wall-clock time.
def buildTimestamp = System.getenv('BUILD_TIMESTAMP')
        ?: String.valueOf(System.currentTimeMillis() / 1000L as long)

// ---------------------------------------------------------------------------

def keystorePwd = null
def alias = null
def pwd = null

Properties properties
def base64 = System.getenv('LOCAL_PROPERTIES')
if (base64 != null && !base64.isBlank()) {
    properties = new Properties()
    properties.load(new ByteArrayInputStream(Base64.decoder.decode(base64)))
} else if (project.rootProject.file('local.properties').exists()) {
    properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
}

if (properties != null) {
    keystorePwd = properties.getProperty('KEYSTORE_PASS')
    alias = properties.getProperty('ALIAS_NAME')
    pwd = properties.getProperty('ALIAS_PASS')
}

keystorePwd = keystorePwd ?: System.getenv('KEYSTORE_PASS')
alias = alias ?: System.getenv('ALIAS_NAME')
pwd = pwd ?: System.getenv('ALIAS_PASS')

def nativeTarget = System.getenv('NATIVE_TARGET') ?: ''

if (nativeTarget == 'SKIP') {
    tasks.configureEach { task ->
        if (
            task.name.toLowerCase().contains('cmake') ||
            task.name.toLowerCase().contains('jni') ||
            task.name.toLowerCase().contains('test')
        ) {
            task.enabled = false
        }
    }
}

android {
    defaultConfig.applicationId = APP_PACKAGE

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    splits {
        abi {
            enable = true
            reset()
            universalApk = nativeTarget.isBlank()
            if (!nativeTarget.isBlank()) {
                include nativeTarget
            } else {
                include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            }
        }
    }

    defaultConfig {
        versionName verName
        versionCode verCode

        // obtain your own keys at https://core.telegram.org/api/obtaining_api_id
        def appId = System.getenv('TELEGRAM_APP_ID') ?: ''
        def appHash = System.getenv('TELEGRAM_APP_HASH') ?: ''

        if (properties != null) {
            appId = properties.getProperty('TELEGRAM_APP_ID') ?: appId
            appHash = properties.getProperty('TELEGRAM_APP_HASH') ?: appHash
        }

        // Fail fast for non-debug builds if the developer did not provide keys.
        // This prevents accidentally shipping the upstream default credentials.
        if (appId == null || appId.toString().isBlank() || appHash == null || appHash.toString().isBlank()) {
            def isDebugLike = gradle.startParameter.taskNames.any { n ->
                n.toLowerCase().contains("debug") || n.toLowerCase().contains("assembledebug")
            }
            if (!isDebugLike) {
                throw new GradleException("Missing TELEGRAM_APP_ID / TELEGRAM_APP_HASH. Provide them in local.properties or environment variables for release/staging builds.")
            }
        }

        buildConfigField 'String', 'BUILD_VERSION_STRING', '"' + verName + '"'
        buildConfigField 'String', 'OFFICIAL_VERSION', '"' + officialVer + '"'
        buildConfigField 'int', 'OFFICIAL_VERSION_CODE', officialCode + ''
        buildConfigField 'int', 'APP_ID', (appId?.toString()?.isInteger() ? appId : "0")
        buildConfigField 'String', 'APP_HASH', '"' + appHash + '"'
        buildConfigField 'long', 'BUILD_TIMESTAMP', buildTimestamp + 'L'

        // Google Maps API key comes from local.properties/env to avoid hardcoding secrets.
        def mapsKey = System.getenv('MAPS_API_KEY') ?: ''
        if (properties != null) {
            mapsKey = properties.getProperty('MAPS_API_KEY') ?: mapsKey
        }
        manifestPlaceholders += [ MAPS_API_KEY: (mapsKey ?: "") ]

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-27', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                System.getenv('PATH').split(File.pathSeparator).any { path ->
                    var file = Paths.get("${path}${File.separator}ccache${if (OperatingSystem.current().windows) ".exe" else ""}").toFile()
                    if (file.exists()) {
                        println("Using ccache ${file.getAbsolutePath()}")
                        arguments += "-DANDROID_CCACHE=${file.getAbsolutePath()}"
                        return true
                    }
                }
            }
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    externalNativeBuild {
        cmake {
            version = '3.31.6+'
            path = 'jni/CMakeLists.txt'
        }
    }

    signingConfigs {
        debug {
            // Use the standard Android debug keystore by default.
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            storeFile project.file('release.keystore')
            storePassword keystorePwd
            keyAlias alias
            keyPassword pwd
        }
    }

    buildTypes {
        debug {
            isDefault = true
            debuggable = true
            jniDebuggable = false
            multiDexEnabled = true
            signingConfig = signingConfigs.debug
        }

        staging {
            debuggable = false
            jniDebuggable = false
            minifyEnabled = true
            shrinkResources = true
            multiDexEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release', 'staging', 'debug']
            signingConfig = signingConfigs.release
        }

        release {
            debuggable = false
            jniDebuggable = false
            minifyEnabled = true
            shrinkResources = true
            multiDexEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release', 'staging', 'debug']
            signingConfig = signingConfigs.release
        }
    }

    sourceSets.main.jniLibs.srcDirs = ['./jni/']

    namespace = 'org.telegram.messenger'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            String gramName = 'NagramExtera'
            String first = String.format('%s-v%s(%s)', gramName, verName, verCode)
            output.outputFileName.set(
                output.outputFileName.get()
                    .replace('TMessagesProj', first)
                    .replace('-release', '')
                    .replace('-staging', '')
            )
        }
    }
}

configurations.configureEach {
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    // official
    implementation 'androidx.core:core-ktx:1.18.0' // 1.10.1
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2' // 1.3.6
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.mediarouter:mediarouter:1.8.0'
    implementation 'androidx.sharetarget:sharetarget:1.2.0'
    implementation 'androidx.interpolator:interpolator:1.0.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    compileOnly 'org.checkerframework:checker-qual:2.5.2'
    compileOnly 'org.checkerframework:checker-compat-qual:2.5.0'
    implementation 'com.google.firebase:firebase-messaging:25.0.1' // 22.0.0
    implementation 'com.google.firebase:firebase-crashlytics:20.0.4'
    implementation 'com.google.android.gms:play-services-cast-framework:22.2.0' // 21.4.0
    implementation 'com.google.android.gms:play-services-maps:20.0.0' // 18.1.0
    implementation 'com.google.android.gms:play-services-auth:21.5.1' // 20.4.0
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.googlecode.mp4parser:isoparser:1.0.6'
    implementation 'com.google.mlkit:language-id:17.0.6'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation ('com.google.guava:guava:33.5.0-android') { // 31.1
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'org.checkerframework', module: 'checker-compat-qual'
        exclude group: 'org.checkerframework', module: 'checker-qual'
        exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
        exclude group: 'com.google.j2objc', module: 'j2objc-annotations'
        exclude group: 'org.codehaus.mojo', module: 'animal-sniffer-annotations'
    }
    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
    implementation 'com.google.android.gms:play-services-mlkit-image-labeling:16.0.8'
    implementation "androidx.credentials:credentials:1.6.0-alpha04"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0-alpha04"
    // payment
    implementation 'com.google.android.gms:play-services-wallet:19.5.0' // 19.1.0
    implementation('com.stripe:stripe-android:2.0.2') {
        exclude group: 'com.android.support', module: 'support-annotations'
    }
    implementation 'com.android.billingclient:billing:7.1.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'

    // kotlin
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    // utilities
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    // network
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'dnsjava:dnsjava:3.6.4'
    // add for emoji
    implementation 'com.jaredrummler:truetypeparser-light:1.0.0'
    // add for UnifiedPush
    implementation 'org.unifiedpush.android:connector:3.3.2'
    // add for save deleted messages
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    // add for keep formatting in translations
    implementation 'org.apache.commons:commons-text:1.15.0'
    // translator from nekogram
    implementation 'app.nekogram.translator:translator:1.5.5'

    compileOnly fileTree('libs')
}
