## Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html

# ---------------------------------------------------------------------------
# Nagram Extera — version identity
# ---------------------------------------------------------------------------
# APP_VERSION_NAME holds only the MAJOR.MINOR prefix — the patch component
# and the SHA suffix are derived fully automatically from git at build time.
# Bump MAJOR or MINOR here for a named release milestone; never touch the
# patch number — it is replaced by the commit count on every build so the
# visible version updates with every commit.
#
# Versioning rules (all automatic):
#   versionCode  = git rev-list --count HEAD                  (strictly monotonic)
#   versionName  = <MAJOR>.<MINOR>.<commitCount>-<7-char SHA>  (CI / clean tree)
#              or  <MAJOR>.<MINOR>.<commitCount>-dev+<SHA>     (dirty working tree)
#   buildTimestamp = unix epoch seconds, from env or current wall clock
#
# A changelog stub at documentations/changelogs/changelog-<versionName>-<versionCode>.md
# is auto-generated by the :TMessagesProj:generateChangelogStub task on every build.
#
# Fallback: when git is unavailable (source-tarball build), APP_VERSION_CODE
# is used as versionCode and APP_VERSION_NAME alone as versionName.
# ---------------------------------------------------------------------------
APP_VERSION_NAME=1.0.0
APP_VERSION_CODE=1

# ---------------------------------------------------------------------------
# Upstream Telegram reference — read-only, informational
# These values appear in BuildConfig.OFFICIAL_VERSION / OFFICIAL_VERSION_CODE
# and are shown in the "Telegram version" line of the About screen.
# Never use these as versionName / versionCode for Nagram Extera itself.
# ---------------------------------------------------------------------------
TELEGRAM_VERSION_NAME=12.6.4
TELEGRAM_VERSION_CODE=6666

# ---------------------------------------------------------------------------
# Application identity
# ---------------------------------------------------------------------------
APP_PACKAGE=app.nagramextera
IS_PRIVATE=false

# ---------------------------------------------------------------------------
# Signing (placeholder; override with real values in local.properties or CI)
# ---------------------------------------------------------------------------
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android

# ---------------------------------------------------------------------------
# Android build flags
# ---------------------------------------------------------------------------
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
android.nonFinalResIds=true
android.enableR8.fullMode=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# ---------------------------------------------------------------------------
# Gradle daemon / JVM tuning
# The CI workflow overrides these values for the runner's hardware profile.
# ---------------------------------------------------------------------------
org.gradle.daemon.idletimeout=1000
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.fromEnv=JAVA_HOME
